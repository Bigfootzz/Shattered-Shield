// Puglin — Bestiary Dungeon Monsters Kit (Quaternius, QAL v1.0; see LICENSE.txt)
// Converted from the kit GLB; UAL2 clips retargeted onto its own 55-joint rig.
iqmload puglin.iqm
iqmskin Puglin_Body T_Puglin_BaseColor_1.png
iqmskin Puglin_Stick T_Puglin_BaseColor_1.png
iqmskin Puglin_Tusks T_Puglin_BaseColor_1.png
mdlscale 100
mdlspec -1
// Bind pose faces +Y in model space (same convention as zombie7 / the player
// characters); -90 yaw turns it to the engine's monster facing.
mdlyaw -90
iqmanim "attack 1" attack1.iqm 30
// Bite monsters spawn with gunselect=WEAP_BITE, so the client asks for
// "attack 7" (see zombie7's cfg) — wire the same swing to both slots.
iqmanim "attack 7" attack1.iqm 30
iqmanim dying dying.iqm 25
iqmanim dead dead.iqm 15
iqmanim pain pain.iqm 30
iqmanim idle idle.iqm 24
iqmanim forward forward.iqm 30
iqmanim backward backward.iqm 20
iqmanim left left.iqm 15
iqmanim right right.iqm 15
iqmanim jump jump.iqm 15
iqmanim swim forward.iqm 30
iqmanim sink forward.iqm 30
