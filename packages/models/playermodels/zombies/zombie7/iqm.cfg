echo "QZOMBIEBLENDER v3: zombie7 iqm.cfg executing"
iqmload zombie7.iqm
iqmskin body skin.jpg
iqmskin eyes skin.jpg
mdlscale 100
mdlspec -1
// v3 FIX (A) sideways walk: this model's bind pose faces +Y in model space,
// but the engine's monster convention (cf. zombie3) is +X with a +90 render yaw.
// mdlyaw -90 rotates the whole model (all anims) to face +X like zombie3.
mdlyaw -90
//iqmpitch back1 90 0 0 90
iqmanim "attack 1" attack1.iqm 30
// v3 FIX (B) attack never played: bite-zombies spawn with gunselect=WEAP_BITE (12),
// so renderplayer clamps the attack slot to ANIM_ATTACK1+12 -> "attack 7".
// "attack 1" alone is never requested; wiring the real swing to "attack 7" too.
iqmanim "attack 7" attack1.iqm 30
iqmanim dying dying.iqm 25
iqmanim dead dead.iqm 15
iqmanim pain pain.iqm 30
iqmanim idle idle.iqm 10
iqmanim forward forward.iqm 30
iqmanim backward backward.iqm 20
iqmanim left left.iqm 15
iqmanim right right.iqm 15
iqmanim jump jump.iqm 15
iqmanim swim forward.iqm 30
iqmanim sink forward.iqm 30
echo "QZOMBIEBLENDER v3: zombie7 iqm.cfg done"
