// Forest Giant — "Forest Monster" by CDmir (OpenGameArt, CC0)
// https://opengameart.org/content/forest-monster
// Converted from the .blend (76-joint rig, tree on the back). Dungeon mob (Ed, Nov 17).
// 3x player size: native height 41.24u (incl. tree), mdlscale 468 -> ~193u tall.
// skin1.png is an unused alternate body skin, kept in the assets dir.
iqmload forest_giant.iqm
iqmskin Monster forest-monster-skin.png
iqmskin Tree tree.png
iqmbumpmap Monster forest-monster-norm.png forest-monster-skin.png
mdlscale 468
mdlyaw -90
iqmanim "attack 1" attack1.iqm 30
// Bite monsters spawn with gunselect=WEAP_BITE, so the client asks for
// "attack 7" (see the imp cfg) — wire the same swing to both slots.
iqmanim "attack 7" attack1.iqm 30
iqmanim dying dying.iqm 25
iqmanim dead dead.iqm 15
iqmanim pain pain.iqm 30
iqmanim idle idle.iqm 24
iqmanim forward forward.iqm 30
iqmanim backward backward.iqm 20
iqmanim left left.iqm 15
iqmanim right right.iqm 15
iqmanim jump jump.iqm 15
iqmanim swim forward.iqm 30
iqmanim sink forward.iqm 30
