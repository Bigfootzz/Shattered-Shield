// Warrior sword vwep (test build, 2026-10-24, uncommitted).
// SOURCE: ~/workspace/shattered-shield-assets/knight-npc/fbx/Sword.fbx
// (Quaternius knight set; 278 verts / 252 polys in source).
// PIPELINE (official only): Blender 4.0.2 + lsalzman iqm_export.py
// (blender-2.93) -> sword.iqe -> official ~/workspace/iqm-tools/iqm/iqm.
// No third-party addon, no script rewrites of IQM data.
// ORIENTATION: FBX blade ran along +Z with grip centre at Z +0.21.
// Baked at export: rotate -90 deg about X (+Z -> +Y, the mace convention:
// tip +Y, grip on the origin) and grip-centred, so the pommel sits at
// Y -5.53 and the tip at Y +28.64 (total 34.17 units; mace is 24.0,
// vwep bow spans 42.7, warrior char is 64.4 tall).
// SCALE: baked x7.85 at export (the vwep-bow precedent: Bow_Wooden FBX
// 5.437 -> vwep bow.iqm span 42.68). No mdlscale line: like mace/bow,
// the scale lives in the IQM, not the cfg.
// TEXTURE: NONE. The source ships color-only materials (Metal/Red/Gold/
// Brown) and no image textures, and no texture files exist in the
// knight-npc assets. The IQM carries real UVs (U 0.039-0.990,
// V 0.028-0.986), so a painted sword.png can be added later with one
// `iqmskin * "sword.png"` line. Until then expect a flat/untextured
// render: shape, scale and orientation are what this test judges.
// UNVERIFIED (needs Ed's in-game eyes): mdlyaw and the in-hand roll.
// This cfg deliberately sets neither, matching the mace cfg (tip +Y,
// mdlyaw 0). If the sword points sideways in hand, the candidates are
// mdlyaw 90 / -90 (the stick/bow precedent); if the blade edge faces
// the wrong way, that is a roll fix at export, not a yaw fix.
iqmdir "playermodels/vwep/warrior/sword"
iqmload "sword.iqm"
// v0.1.22 fix: drop sword down into hand (Ed reported grip sits too high, Oct 24).
// Blade is +Y (vertical when held), so -Y moves grip down toward palm.
// 2 units is a small adjustment ("a little more" per Ed); tune if needed.
mdltrans 0 -2 0
