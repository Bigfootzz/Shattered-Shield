// Elvish long sword vwep — Warrior PvP purchased weapon (Blasque's shop; price TBD).
// SOURCE: CGTrader "Old Long Elvish Sword" by sepandjahrominejad, Royalty Free (no AI)
// (commercial game use allowed; raw files not redistributable).
// Files: ~/workspace/user/files/Old_Long_Elvish_Sword_2_yzc1.obj (467 verts / 930 faces,
// exact match to the listing) + Material_Assets_0_2awt.zip (3 maps).
// PIPELINE (official only): Blender 4.0.2 + lsalzman iqm_export.py (blender-2.93).
// ORIENTATION: mace convention — tip +Y, grip centre at origin. The OBJ blade already
// ran along +Y; the importer's +90deg X axis-conversion rotation was zeroed before
// baking (the first export baked it and produced a Z-long sword with a pommel-side
// tag; that export was discarded, not staged).
// SCALE: baked x0.6936 (OBJ span 54.79 -> 38.00 units; pommel Y -3.21, blade-base
// tag Y +7.28, tip Y +34.79; starter sword spans 34.17, warrior char is 64.4 tall).
// SHADING: all faces flat (use_smooth off) — the author's chunky low-poly look is kept,
// not smoothed. Normals are per-face; exported vert count ~2790 (split face-verts).
// TEXTURES: diffuse 1024x1024; normal 1839x1839 (NON power-of-two — engine NPOT note);
// reflection map staged but NOT referenced: the engine's IQM skin path has no
// reflection-map slot (spec is scalar), so it is carried for future use only.
// GLOW TAG: tag_tip joint at the BLADE BASE above the tang (Ed, Oct 31 — overrides the
// earlier blade-tip placement): vwep (0.094, 7.283, -0.003), just past the guard, so the
// amber/gold light washes up the whole blade. Name stays tag_tip (glow code lookup).
// UNVERIFIED (needs Ed's in-game eyes): in-hand roll / blade-edge facing (same caveat
// as the starter sword), glow visibility at distance, NPOT normal map load.
iqmdir "playermodels/vwep/warrior/elvish_sword"
iqmload "elvish_sword.iqm"
iqmskin * "elvish_sword_dif.jpg"
bumpmap "Elvish_Sword" "elvish_sword_nor.png" "elvish_sword_dif.jpg"
// Same hand correction as the starter sword (Oct 24: grip sits too high without it).
mdltrans 0 -2 0
