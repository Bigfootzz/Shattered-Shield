// Fancy wizard staff vwep — Magi PvP purchased weapon (Blasque's shop; price TBD).
// SOURCE: CGTrader "Wizard Staff" by goldmanstudio, Royalty Free (no AI)
// (commercial game use allowed; raw files not redistributable).
// Files: ~/workspace/user/files/staff_3_6k04.fbx (716 verts / 1302 faces,
// exact match to the listing) + StaffTextures_4_5n1h.zip (4 maps).
// PIPELINE (official only): Blender 4.0.2 + lsalzman iqm_export.py (blender-2.93).
// ORIENTATION: wooden-staff convention — long axis +X, tip +X, grip at origin.
// The FBX stores the staff upside-down (claw at -Z, gold cap at +Z); rotation
// (0,-90,0) about Y puts the claw at +X (top) and the gold cap at -X (butt).
// FBX import quirk: Principled alpha imported 0.0 (Knight quirk, Oct 31) — fixed
// to 1.0; the albedo PNG itself has NO alpha channel (RGB), so 1.0 is correct.
// A stale imported image node pointing at a missing '1e64e9a0.dds' was stripped
// from the material before export so the IQM records the albedo basename.
// SCALE: baked x35.8427 (FBX span 1.686 m -> 60.44 units, matching the wooden staff;
// butt X -23.29, tip X +37.15, grip at origin = 38.5% from butt, on the shaft).
// TEXTURES: albedo 4096x4096; normal 4096x4096; metallic/smoothness + AO staged
// but NOT referenced: the engine's IQM skin path has no metal/AO slot (spec is
// scalar), so they are carried for future use only. (4K maps = ~35 MB staged;
// a 2K downscale pass is possible later if package size matters.)
// GLOW TAG: tag_tip joint AT THE CLAW ORNAMENT near the top (Ed, Oct 31 — the
// light emanates from the curved design itself, not the geometric tip):
// vwep (26.521, -0.029, -0.269), centroid of 1663 gold-albedo samples in the
// claw region X[14.49, 37.15] (642 verts). Name stays tag_tip (glow code lookup).
// UNVERIFIED (needs Ed's in-game eyes): in-hand roll/lean (same caveat as the
// wooden staff), glow visibility at distance, 4K texture load.
iqmdir "playermodels/vwep/magi/fancy_staff"
iqmload "fancy_staff.iqm"
iqmskin * "fancy_staff_albedo.dds"
bumpmap "Staff" "fancy_staff_normal.dds" "fancy_staff_albedo.dds"
