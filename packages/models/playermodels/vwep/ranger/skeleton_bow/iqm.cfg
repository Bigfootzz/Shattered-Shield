// Marrowstring vwep — Ranger PvP purchased weapon (Blasque's shop; 20,000 Embers).
// SOURCE: Ed's file CS_SkeletonBow_0_upo3.zip — Celestia Studio (PDF author "Sema").
// Bow.fbx (4572 verts / 4852 faces) + Arrow.fbx (310 verts / 297 faces) + full Bow PBR set.
// LICENSE — CLEARED (Ed, Oct 31): same license as the staff (CGTrader Royalty Free) —
// free to use in a commercial game; the author's post said free to use, and credit
// is recorded in fullcredits.txt (Sema / Celestia Studio) at the game's root, which
// ships in the release ZIP. Raw source files are not redistributed, same as staff/sword.
// PIPELINE (official only): Blender 4.0.2 + lsalzman iqm_export.py (blender-2.93).
// ORIENTATION: wooden-bow convention — limbs along Y, span 42.68 (exact match to the
// wooden bow vwep), grip at origin. FBX import applies 0.01 scale + 90deg X rotation;
// transforms were applied before measuring (the first shape render missed the bow
// entirely by framing un-applied local coords — same class of bug as the sword's
// first discarded export). Rotation -90deg about X puts limbs on Y.
// SCALE: baked x10.7047 (imported span 3.987 -> 42.68 units).
// STRING: PRESENT — 16 long quad faces (material "Bow") spanning tip to tip at
// X ~10.7, in two segments meeting at the nock point. An early vertex-band check
// wrongly suggested no string (long faces have verts only at their ends); the
// preview render + a face-span check proved the string exists. Do not re-raise.
// ARROW (nocked): Arrow.fbx rotated so its bodkin tip (verified by close-up renders:
// sharp tapering point at the high end, flat cut at the nock end) points -X.
// Nock at string X 10.487, shaft through grip height (Y 0, Z -0.805), tip at
// X -23.280, ~20 units past the grip. Arrow length 33.77 (same scale factor as the
// bow, preserving the package's authored proportions).
// SHADING: all faces smooth as imported — the model's own shading is kept, not restyled.
// TEXTURES: all four maps 4096x4096 (~32 MB staged); engine references albedo +
// normal only; metallic/roughness staged but NOT referenced (no engine slots).
// FBX import quirk: NONE this time — imported Principled alphas were already 1.0
// (unlike the Knight/staff FBX alpha-0 quirk). The diagnostic renders' magenta cast
// was missing E:\ texture paths in the imported materials, fixed by rebuilding
// materials from the real maps; not a model defect.
// GLOW TAG: tag_tip joint AT THE ARROW TIP (Ed, Oct 31 — overrides the earlier
// "do not finalize" instruction): vwep (-23.280, 0.000, -0.879), verified in the
// staged IQM as the single joint. Name stays tag_tip (glow code lookup).
// UNVERIFIED (needs Ed's in-game eyes): in-hand roll / facing (mdlyaw 90 mirrored
// from the wooden bow, whose own direction note is unverified), glow visibility at
// distance from the arrow tip, 4K texture load. License cleared — see LICENSE above.
iqmdir "playermodels/vwep/ranger/skeleton_bow"
iqmload "skeleton_bow.iqm"
iqmskin * "bow_albedo.png"
bumpmap "Skeleton_Bow" "bow_normal.png" "bow_albedo.png"
// Same yaw correction as the wooden bow vwep (bow faces left without it;
// direction unverified — see UNVERIFIED above).
mdlyaw 90
