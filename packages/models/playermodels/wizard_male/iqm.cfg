iqmdir "playermodels/wizard_male"
iqmload "char.iqm"
iqmskin "Wizard_Eyebrows" "T_Hair_1_BaseColor.png"
iqmskin "Wizard_Eyes" "T_Eye_Brown.png"
iqmskin "Wizard_Beard" "T_Hair_1_BaseColor.png"
iqmskin "Wizard_Hair" "T_Hair_1_BaseColor.png"
iqmskin "Wizard_Head" "T_Superhero_Male_Dark.png"
iqmskin "Wizard_Body" "Wizard_Texture.png"
iqmskin "Wizard_Boots" "T_Ranger_BaseColor.png"
iqmskin "Wizard_ShoulderPad_L" "Wizard_Texture.png"
iqmskin "Wizard_ShoulderPad_R" "Wizard_Texture.png"
iqmskin "Wizard_Pouch" "Wizard_Texture.png"
iqmtag tag_weapon tag_weapon
// PvP cape (Nov 1): the Magi rig has NO neck_01 joint — its neck joint is
// named Neck, so the tag is defined from Neck instead, still with
// IDENTITY offset (the cape IQM is baked in neck-local space; any offset
// would shift the drape off the back). Attached in src/fpsgame/render.cpp.
// NOTE: the Magi neck frame differs from the ranger neck_01 frame, so the
// drape does not hang identically on Magi — in-game fit check still open.
iqmtag Neck tag_cape 0 0 0 0 0 0
// PvP skull pauldron (Nov 2): tag_pauldron_l/r on the shoulder joints with
// IDENTITY offset — the skull IQMs are baked in shoulder-local space.
// Attached in src/fpsgame/render.cpp. Old pads hidden (pad mesh triangle
// counts zeroed in char.iqm). Magi wear the 0.7 variant (see render.cpp).
iqmtag UpperArm.L tag_pauldron_l 0 0 0 0 0 0
iqmtag UpperArm.R tag_pauldron_r 0 0 0 0 0 0

exec "packages/models/playermodels/wizard_male/anims.cfg"
// v0.1.10 fix 8: male Magi was ~10% taller than other models; scale to 90
mdlscale 90
mdlspec -1
mdlyaw -90
mdlglow 0
