iqmdir "playermodels/wizard_male"
// Magi rebuilt Nov 15 on the Quaternius ELF (Fantasy Races pack, human color),
// wearing the full RANGER outfit (Ed's call: "Use the rangers").
// The fitted robe was terrible; the Ranger outfit is a proper fantasy set
// (hood, pauldron, tunic, legs, boots) and it fits the elf. Horns kept.
// SKIN: the Ranger texture atlas was redesigned as a mage skin (Ed's call:
// "Send the skin to Gemini to redesign the skin keeping the layout the same
// so it skins right"). Gemini returned a color spec (not an image — it can't
// output images), and Jarvis implemented it: green fabric -> deep royal blue
// (#14213D-#1D3557), brown leather -> metallic gold (#D4AF37), same 2048x2048
// resolution, UV layout untouched (pixel recolor only, no island moves).
// T_Magi_BaseColor.png is that redesigned atlas. Arms are solid blue,
// pauldron + belts solid gold, boots solid dark charcoal-blue (the atlas
// regions for those pieces didn't map cleanly).
// The elf is slim (not buff), 65-bone Humanoid rig, same joint order as the
// Ranger so the Ranger anims drive him. Staff in the RIGHT hand (tag_weapon
// parent hand_r) like the Warrior's sword.
// LESSON from .126: NO skeleton name here — the Magi gets his OWN private
// skeleton. A shared "humanoid" name broke the Warrior (shared the Ranger's
// left-hand tag_weapon and broke armor LINK_SKIN). Never share a skeleton
// name between playermodels.
iqmload "char.iqm"
// SPLIT-BODY (.131, Ed: the armor system is built so any class can swap armor
// as new models are made — no reason to limit it to one class): char.iqm is
// the elf SKIN body only — Body_Head/Torso/Arms/Legs/Feet + Eyes/Hair/Horns.
// He starts in underwear like the Warrior/Ranger males. The blue Ranger
// outfit is NO LONGER in char.iqm; it is Magi armor attach models
// (attachments/armor/magi_male_body, magi_male_legs, magi_male_boots_l/r,
// magi_male_hood), equipped via the cloth_* items (cloth_tunic/leggings/
// boots/helm). The pauldron rides with the tunic (magi_male_body).
// The old baked-in char.iqm is backed up at
// ~/workspace/bg-verify/magi/wizard_male_char_130_backup.iqm.
// Meshes in the wizard_male char.iqm (Blender export, Nov 16, split-body rebuild):
//   Body_Head = elf head + pointed ears, Body_Torso/Arms/Legs/Feet = elf skin
//   Elf_Male_Eyes (green), Elf_Male_Hair (long blonde), Elf_Male_Horns (kept)
iqmskin "Body_Head" "T_Elf_Male_BaseColor_1.png"
iqmskin "Body_Torso" "T_Elf_Male_BaseColor_1.png"
iqmskin "Body_Arms" "T_Elf_Male_BaseColor_1.png"
iqmskin "Body_Legs" "T_Elf_Male_BaseColor_1.png"
iqmskin "Body_Feet" "T_Elf_Male_BaseColor_1.png"
iqmskin "Elf_Male_Eyes" "T_Eye_Green.png"
iqmskin "Elf_Male_Hair" "T_FantasyHair_BaseColor_1.png"
iqmskin "Elf_Male_Horns" "T_FantasyHair_BaseColor_1.png"
iqmtag tag_weapon tag_weapon
// Off hand (Nov 15, Ed): the Magi's orb (SLOT_OFFHAND, "Ember Talon Orb")
// attaches to the LEFT hand. tag_offhand on hand_l, IDENTITY offset.
// The Warrior's shield uses the same tag on his left hand.
iqmtag hand_l tag_offhand 0 0 0 0 0 0
// Cape: tag_cape on the neck joint with IDENTITY offset (cape pattern).
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags (Humanoid bone names): tag_helm/tag_torso/tag_legs/
// tag_boot_l/tag_boot_r, IDENTITY offset; attach models are baked in the
// tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag spine_03 tag_torso 0 0 0 0 0 0
iqmtag pelvis tag_legs 0 0 0 0 0 0
iqmtag foot_l tag_boot_l 0 0 0 0 0 0
iqmtag foot_r tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/wizard_male/anims.cfg"
// Magi is the same height as Ranger/Warrior now (Humanoid rig, ~65 units).
// The old wizard needed mdlscale 90 (he was ~10% taller); the new Magi is 100.
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
