iqmdir "playermodels/warrior_male_ranger"
iqmload "char.iqm"
// Warrior (male) wearing the Ranger outfit — Quaternius Modular Outfits.
// Equippable via the Ranger Outfit torso item (appearance swap).
iqmskin "Male_Ranger_Acc_Pauldron" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Arms" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Arms_Bracer" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Body" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Body_Belt_1" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Body_Belt_2" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Feet_Boots" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Head_Hood" "T_Ranger_BaseColor.png"
iqmskin "Male_Ranger_Legs" "T_Ranger_BaseColor.png"
iqmtag tag_weapon tag_weapon
// Cape (Nov 10, re-applied from Nov 1): tag_cape on the neck joint
// with IDENTITY offset - the cape IQM is baked in neck-local space,
// so any offset here would shift the drape off the back.
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags (Nov 10, Ed's "true armor swapping"):
// tag_helm/tag_torso/tag_legs/tag_boot_l/tag_boot_r, IDENTITY offset;
// attach models are baked in the tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag spine_03 tag_torso 0 0 0 0 0 0
iqmtag pelvis tag_legs 0 0 0 0 0 0
iqmtag foot_l tag_boot_l 0 0 0 0 0 0
iqmtag foot_r tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/warrior_male_ranger/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
