iqmdir "playermodels/sorceress_female"
// Female Magi rebuilt Nov 16 on the Quaternius ELF FEMALE (Fantasy Races pack,
// human color), wearing the full FEMALE RANGER outfit (same call as the male:
// "Use the rangers"). Royal blue + gold, same as the male Magi.
// SKIN: the Ranger texture atlas redesigned as a mage skin (same T_Magi_BaseColor.png
// as the male — the male and female Ranger parts share the T_Ranger_BaseColor atlas,
// so the blue/gold recolor applies to both). Arms are bare (elf's own arms,
// same as the male Magi). Horns kept (the female elf has the same Elf_Male_Horns mesh).
// The elf is slim, 67-bone Humanoid rig (65 elf bones + tag_weapon + tag_offhand),
// same joint order as the Ranger so the Ranger anims drive her. Staff in the RIGHT
// hand (tag_weapon parent hand_r), book in the LEFT (tag_offhand parent hand_l).
// LESSON from .126: NO skeleton name here — the Sorceress gets her OWN private
// skeleton, in her OWN folder, with her OWN calls. A shared "humanoid" name broke
// the Warrior (shared the Ranger's left-hand tag_weapon and broke armor LINK_SKIN).
// Never share a skeleton name between playermodels, and never intertwine the
// female Magi's calls with the male's.
// Meshes in the sorceress char.iqm (Blender export, Nov 16):
//   Elf_Female_Body = elf head + pointed ears + BARE ARMS + hands. Torso/legs/feet
//   removed, outfit covers them.
//   Elf_Female_Eyes (green), Elf_Female_Hair (long blonde), Elf_Male_Horns (kept)
//   Female_Ranger_Body, Female_Ranger_Legs = the Ranger outfit (no Arms mesh —
//   the elf's bare arms are the arms now)
//   Female_Ranger_Head_Hood (hood frames the face, horns poke through the top)
//   Female_Ranger_Body_Belt_1/2 = gold belts
//   Female_Ranger_Feet (boots, same royal blue as the tunic)
// NO SKIRT (Ed, Nov 16: "Dont use this crappy dress on her"): the procedural
// Magi_Robe_Skirt was removed. She wears the Female Ranger Legs (pants) like
// the male Magi wears the Male Ranger Legs — no dress.
iqmload "char.iqm"
iqmskin "Elf_Female_Body" "T_Elf_Female_BaseColor_1.png"
iqmskin "Elf_Female_Eyes" "T_Eye_Green.png"
iqmskin "Elf_Female_Hair" "T_FantasyHair_BaseColor_1.png"
iqmskin "Elf_Male_Horns" "T_FantasyHair_BaseColor_1.png"
iqmskin "Female_Ranger_Body" "T_Magi_BaseColor.png"
iqmskin "Female_Ranger_Legs" "T_Magi_BaseColor.png"
iqmskin "Female_Ranger_Head_Hood" "T_Magi_BaseColor.png"
iqmskin "Female_Ranger_Body_Belt_1" "magi_robe_gold.png"
iqmskin "Female_Ranger_Body_Belt_2" "magi_robe_gold.png"
iqmskin "Female_Ranger_Feet" "magi_robe_blue.png"
iqmtag tag_weapon tag_weapon
// Off hand (Nov 15, Ed): the Magi's Liber Umbrarum (SLOT_OFFHAND) attaches to
// the LEFT hand. tag_offhand on hand_l, IDENTITY offset. The Warrior's shield
// uses the same tag on his left hand.
iqmtag hand_l tag_offhand 0 0 0 0 0 0
// Cape: tag_cape on the neck joint with IDENTITY offset (cape pattern).
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags (Humanoid bone names): tag_helm/tag_torso/tag_legs/
// tag_boot_l/tag_boot_r, IDENTITY offset; attach models are baked in the
// tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag spine_03 tag_torso 0 0 0 0 0 0
iqmtag pelvis tag_legs 0 0 0 0 0 0
iqmtag foot_l tag_boot_l 0 0 0 0 0 0
iqmtag foot_r tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/sorceress_female/anims.cfg"
// Female Magi is slightly shorter than the male (female elf 1.73m vs male ~1.83m).
// mdlscale 100 keeps her at her natural height (~61 units).
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
