iqmdir "playermodels/sorceress_female"
iqmload "char.iqm"
iqmskin "Sorceress_Eyebrows" "../ranger_female/T_Hair_2_BaseColor.dds"
iqmskin "Sorceress_Eyes" "T_Eye_Brown.png"
iqmskin "Sorceress_Hair" "../ranger_female/T_Hair_2_BaseColor.dds"
iqmskin "Sorceress_Head" "../ranger_female/T_Superhero_Female_Dark_BaseColor.dds"
iqmskin "Sorceress_Body" "Wizard_Texture.png"
iqmskin "Sorceress_Boots" "../ranger_male/T_Ranger_BaseColor.dds"
iqmskin "Sorceress_ShoulderPad_L" "Wizard_Texture.png"
iqmskin "Sorceress_ShoulderPad_R" "Wizard_Texture.png"
iqmskin "Sorceress_Pouch" "Wizard_Texture.png"
iqmtag tag_weapon tag_weapon
// Cape (Nov 10, re-applied from Nov 1): tag_cape on the neck joint
// with IDENTITY offset - the cape IQM is baked in neck-local space,
// so any offset here would shift the drape off the back.
iqmtag Neck tag_cape 0 0 0 0 0 0
// Armor attach tags (Nov 10, Ed's "true armor swapping"):
// tag_helm/tag_torso/tag_legs/tag_boot_l/tag_boot_r, IDENTITY offset;
// attach models are baked in the tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag Torso tag_torso 0 0 0 0 0 0
iqmtag Hips tag_legs 0 0 0 0 0 0
iqmtag Foot.L tag_boot_l 0 0 0 0 0 0
iqmtag Foot.R tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/sorceress_female/anims.cfg"
mdlscale 64
mdlspec -1
mdlyaw -90
mdlglow 0
