iqmdir "playermodels/ranger_female"
iqmload "char.iqm" "humanoid"
// UV-WRAP FALLBACK (Nov 19): armor painted onto the body texture;
// Body_Torso/Arms/Legs/Feet use T_Kevin_Body_UVWrap.png. No separate
// armor geometry. Head/hair/eyes unchanged. Shipped in v0.1.144-test.
// Rebuilt Ranger (Nov 18, Kevin mannequin re-skinned as the Ranger):
// HEAD SWAP -- Body_Head + Hair + Eyes + Eyebrows are the Ranger's own
// head wholesale (sockets, face, neck tube), re-weighted to Kevin's
// B-head/B-neck. The body below the neck is Kevin's split body.
iqmskin "Body_Head" "T_Superhero_Female_Dark_BaseColor.dds"
iqmskin "Body_Torso" "T_Kevin_Body_UVWrap.png"
iqmskin "Body_Arms" "T_Kevin_Body_UVWrap.png"
iqmskin "Body_Legs" "T_Kevin_Body_UVWrap.png"
iqmskin "Body_Feet" "T_Kevin_Body_UVWrap.png"
iqmskin "Eyebrows" "T_Hair_2_BaseColor.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Hair_Long" "T_Hair_2_BaseColor.png"
iqmskin "Quiver" "HumanAnimations_ColorPalette.png"
iqmtag tag_weapon tag_weapon
// Off hand: tag_offhand on the LEFT hand (B-hand.L). The Ranger has no
// off-hand item, so the tag sits unused on him.
iqmtag B-hand.L tag_offhand 0 0 0 0 0 0
// Cape: tag_cape on B-neck, IDENTITY offset - the cape IQM is baked in
// neck-local space.
iqmtag B-neck tag_cape 0 0 0 0 0 0
// Shoulder: tag_shoulder on B-chest, IDENTITY for now. The pauldron
// re-bake + rotation re-tune is step 3 of the armor plan; the Ranger's
// -7deg/-11deg values are Humanoid-specific and do NOT transfer.
iqmtag B-chest tag_shoulder 0 0 0 0 0 0
// Armor attach tags, IDENTITY offset; attach models are baked in the tag
// joint's local space (cape pattern).
iqmtag B-head tag_helm 0 0 0 0 0 0
iqmtag B-chest tag_torso 0 0 0 0 0 0
iqmtag B-hips tag_legs 0 0 0 0 0 0
iqmtag B-foot.L tag_boot_l 0 0 0 0 0 0
iqmtag B-foot.R tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/ranger_female/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
