iqmdir "playermodels/ranger_female"
iqmload "char.iqm"
iqmskin "Superhero_Female" "T_Superhero_Female_Dark_BaseColor.png"
iqmskin "Female_Ranger_Body" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Legs" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Feet" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Arms" "T_Ranger_BaseColor.png"
iqmskin "Eyebrows" "T_Hair_2_BaseColor.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Female_Ranger_Acc_Pauldrons" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Arms_Bracer" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Body_Belt_1" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Body_Belt_2" "T_Ranger_BaseColor.png"
iqmskin "Female_Ranger_Head_Hood" "T_Ranger_BaseColor.png"
iqmtag tag_weapon tag_weapon
// PvP cape (Nov 1): tag_cape on the neck joint with IDENTITY offset —
// the cape IQM is baked in neck_01-local space, so any offset here would
// shift the drape off the back. Attached in src/fpsgame/render.cpp.
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// PvP skull pauldron (Nov 2): tag_pauldron_l/r on the shoulder joints with
// IDENTITY offset — the skull IQMs are baked in shoulder-local space, so any
// offset here would shift the skull off the shoulder. Attached in
// src/fpsgame/render.cpp. Old pads hidden (pad mesh triangle counts zeroed
// in char.iqm).
iqmtag upperarm_l tag_pauldron_l 0 0 0 0 0 0
iqmtag upperarm_r tag_pauldron_r 0 0 0 0 0 0

exec "packages/models/playermodels/ranger_female/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
