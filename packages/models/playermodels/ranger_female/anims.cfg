// attack 1-7 (changed Nov 19): full BowShot01 cycle -- Load + Hold +
// Release concatenated into one clip (char.iqm:HumanF@BowShot01, 103
// frames @ 30fps, played at speed 20). The Hold portion is all 41
// frames, so the 2-second bow draw hold is preserved. Previously the
// attacks played the static Hold pose only, so the Ranger drew and
// held but never shot (playtest Notes 317/327/328). Ed's call Nov 18
// still stands: no sword swings exist in the Kevin pack, and the
// Ranger only uses bows (weapon gate), so attacks 1-6 play the same
// bow clip as attack 7. The RPG cast always plays attack 7 (N_RPG_CD
// forces lastattackgun=6 for Arrow Shot / Venom Shot).
// Bow tag (Nov 19): tag_weapon is now keyframed per frame in char.iqm
// (was one fixed rest orientation, wrong in idle by ~84deg), so the bow
// points the right way in idle, movement, and through the whole shot.
iqmanim "attack 1" "char.iqm:HumanF@BowShot01" 20
iqmanim "attack 2" "char.iqm:HumanF@BowShot01" 20
