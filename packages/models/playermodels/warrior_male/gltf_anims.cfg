// Ranger Male animations — glTF version (Nov 11, 2026).
// Maps game animation names to the UAL2 animations in anims.glb.
// Mirrors anims.cfg (IQM) but uses gltfanim. Walk/Jog are NOT here yet:
// they come from UAL1 (Rigify rig) and need retargeting to the Humanoid
// rig first. Until then, forward/backward/left/right fall back to idle.
gltfdir "playermodels/warrior_male"

gltfanim "idle" "anims.glb:Idle_No_Loop" 24
gltfanim "forward" "anims.glb:Idle_No_Loop" 24
gltfanim "backward" "anims.glb:Idle_No_Loop" 30
gltfanim "left" "anims.glb:Idle_No_Loop" 30
gltfanim "right" "anims.glb:Idle_No_Loop" 30
gltfanim "edit" "anims.glb:Idle_Lantern_Loop" 24
gltfanim "jump" "anims.glb:NinjaJump_Start" 30
gltfanim "lag" "anims.glb:Idle_No_Loop" 90
gltfanim "dying" "anims.glb:Hit_Knockback" 45
gltfanim "dead" "anims.glb:LayToIdle" None
gltfanim "lose" "anims.glb:Idle_Shield_Break" 18
gltfanim "pain" "anims.glb:Idle_No_Loop" 30
gltfanim "sink" "anims.glb:Slide_Exit" 10
gltfanim "swim" "anims.glb:Slide_Loop" 20
gltfanim "taunt" "anims.glb:Idle_TalkingPhone_Loop" 24
