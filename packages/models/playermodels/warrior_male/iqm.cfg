iqmdir "playermodels/warrior_male"
iqmload "char.iqm"
iqmskin "SuperHero_Male" "T_Superhero_Male_Dark.png"
iqmskin "Male_Ranger_Body" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Legs" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Feet_Boots" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Arms" "T_Warrior_Tinted.png"
iqmskin "Eyebrows" "T_Hair_1_BaseColor.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Male_Ranger_Acc_Pauldron" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Arms_Bracer" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Body_Belt_1" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Body_Belt_2" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Head_Hood" "T_Warrior_Tinted.png"
iqmtag tag_weapon tag_weapon
// PvP cape (Nov 1): tag_cape on the neck joint with IDENTITY offset —
// the cape IQM is baked in neck_01-local space, so any offset here would
// shift the drape off the back. Attached in src/fpsgame/render.cpp.
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// PvP skull pauldron (Nov 2): tag_pauldron_l/r on the shoulder joints with
// IDENTITY offset — the skull IQMs are baked in shoulder-local space, so any
// offset here would shift the skull off the shoulder. Attached in
// src/fpsgame/render.cpp. Old pads hidden (pad mesh triangle counts zeroed
// in char.iqm).
iqmtag upperarm_l tag_pauldron_l 0 0 0 0 0 0
iqmtag upperarm_r tag_pauldron_r 0 0 0 0 0 0

exec "packages/models/playermodels/warrior_male/anims.cfg"
mdlscale 74
mdlspec -1
mdlyaw -90
mdlglow 0
