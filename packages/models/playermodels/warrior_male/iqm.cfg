iqmdir "playermodels/warrior_male"
iqmload "char.iqm" "humanoid"
// New Warrior body: Quaternius Universal Base Characters, Superhero Male
// (swapped in Nov 10, 2026 — replaces the old Ranger body + pauldrons).
// Same Humanoid rig as the old model, so the ranger_male_* anims carry over.
// Old char.iqm kept as char.iqm.old-rangerbody for revert.
// Split body (Nov 10, armor swap): base body split into per-part meshes so a
// body part can be hidden when its armor slot is equipped (armor swaps in
// place of the body part instead of layering on top). All parts share the
// Superhero body texture.
iqmskin "Body_Head" "../ranger_male/T_Superhero_Male_Dark.dds"
iqmskin "Body_Torso" "../ranger_male/T_Superhero_Male_Dark.dds"
iqmskin "Body_Arms" "../ranger_male/T_Superhero_Male_Dark.dds"
iqmskin "Body_Legs" "../ranger_male/T_Superhero_Male_Dark.dds"
iqmskin "Body_Feet" "../ranger_male/T_Superhero_Male_Dark.dds"
iqmskin "Eyebrows" "../ranger_male/T_Hair_1_BaseColor.dds"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Hair" "../hair_darkbrown.png"
iqmtag tag_weapon tag_weapon
// Cape (Nov 10, re-applied from Nov 1): tag_cape on the neck joint
// with IDENTITY offset - the cape IQM is baked in neck-local space,
// so any offset here would shift the drape off the back.
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags (Nov 10, Ed's "true armor swapping"):
// tag_helm/tag_torso/tag_legs/tag_boot_l/tag_boot_r, IDENTITY offset;
// attach models are baked in the tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag spine_03 tag_torso 0 0 0 0 0 0
iqmtag pelvis tag_legs 0 0 0 0 0 0
iqmtag foot_l tag_boot_l 0 0 0 0 0 0
iqmtag foot_r tag_boot_r 0 0 0 0 0 0
// Shield attach point (Nov 12, Ed): tag_shield on the left hand (off hand);
// the Warrior's weapon is in the right hand. Unreferenced for now —
// no shield model, item, or attach code yet; the tag is here for later.
iqmtag hand_l tag_shield 0 0 0 0 0 0

exec "packages/models/playermodels/warrior_male/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
