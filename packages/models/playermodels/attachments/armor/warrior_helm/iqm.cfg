// Warrior great helm attach model — TEST (bots repo): Tripo full-face
// medieval great helm fitted to the BODY's own rig (char.glb armature), so
// it shares the body's exact bind pose. Skinned via LINK_SKIN (own private
// skeleton + a copy of the body's animation frames), rigid 100% Head.
// Full-face: pointed crown, eye slit at eye height (60.23u, slit 59.81..60.45u),
// vertical-bar faceplate, enclosed dome back. The head is fully enclosed
// (ray test: 0 face verts embedded/poking out at fit s=0.40; cavity min
// clearance 0.21u at the nose tip, p5 0.78u, median 1.41u).
// Texture is the helm's vertex colors baked to UVs (Smart UV Project,
// 1024x1024, Cycles DIFFUSE/COLOR) — the engine's IQM loader ignores
// IQM_COLOR, so a texture is required; usecol=False on export.
// HEAD row: use hidden=0 (like the iron helm). The face/eyes fill the eye
// slit naturally; hiding Body_Head would leave floating eyes in a dark slot.
iqmdir "playermodels/attachments/armor/warrior_helm"
iqmload "warrior_helm.iqm"
iqmskin "Warrior_Helm" "T_Warrior_Helm.png"
