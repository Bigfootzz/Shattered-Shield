// Warrior Body attach model — TEST (bots repo): chainmail torso.
// GEOMETRY IS SHARED WITH THE RANGER TUNIC: the .62 Warrior outfit meshes
// are the same geometry as the Ranger armor pieces (baked .62 Body vs
// ranger_body.iqm: median 0.13u; legs 0.17u, identical 1128/1128 tris;
// boots 0.19u) — the Warrior is the same SuperHero_Male body re-skinned,
// so the chainmail look comes from the TEXTURE (T_Warrior_Tinted.png),
// not different geometry. This file is a byte-copy of ranger_body.iqm
// (includes the neck/shoulder/hem refit); only the texture differs.
// Joints == body, bindcorr identity, verts fit body surface (median 0.54u).
iqmdir "playermodels/attachments/armor/warrior_body"
iqmload "warrior_body.iqm"
iqmskin "Male_Ranger_Body" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Body_Belt_1" "T_Warrior_Tinted.png"
iqmskin "Male_Ranger_Body_Belt_2" "T_Warrior_Tinted.png"
