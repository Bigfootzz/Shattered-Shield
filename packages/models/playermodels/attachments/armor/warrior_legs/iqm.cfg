// Warrior Legs attach model — TEST (bots repo): chainmail legs.
// Same geometry as the Ranger pants (baked .62 Warrior Male_Ranger_Legs
// vs ranger_legs.iqm: same-order median 0.17u, identical 1128/1128
// triangle sets) — only the texture differs (T_Warrior_Tinted.png).
// Built by a FIXED bake of the .62 Warrior mesh: positions + normals +
// tangents transformed by the per-vertex weighted bindcorr into the
// body's bind pose; texcoords/blends copied UNCHANGED from .62 (the
// .97 bake corrupted UVs by reading vartype 1 as normals — NOT repeated
// here). Joints == body (66), bindcorr identity, private skeleton.
// NOTE: installed Ranger legs/boots still carry the .97 UV corruption;
// these Warrior files do not.
iqmdir "playermodels/attachments/armor/warrior_legs"
iqmload "warrior_legs.iqm"
iqmskin "Male_Ranger_Legs" "T_Warrior_Tinted.png"
