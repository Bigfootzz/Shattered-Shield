// PvP skull pauldron attach model — magi_r variant (Ed, Nov 2).
// Baked in shoulder-tag-LOCAL space (see wiring bake); the tag is defined
// with IDENTITY offset in each player model's iqm.cfg, so any offset there
// would shift the skull off the shoulder. Attached in src/fpsgame/render.cpp.
// MESH: skull + 2 spikes combined, 5748 verts / 11648 tris (decimated from
// 116k; smoothed rim). TEXTURE: skull_gold.png, solid proof gold
// (0.85, 0.62, 0.15) matching the approved Blender proofs. Static (no frames):
// renders in bind pose at the animated shoulder tag, like the cape/bow vwep.
// Unconditional on purpose: no skull ownership system exists yet (like the
// cape), so there is nothing to gate on. The old pad meshes are hidden by
// zeroing their triangle counts in each char.iqm (see wiring notes).
iqmdir "playermodels/attachments/skull_magi_r"
iqmload "skull_magi_r.iqm"
iqmskin "SkullPauldron" "skull_gold.png"
