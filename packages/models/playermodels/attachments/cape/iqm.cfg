// PvP cape attach model — universal cape, FIRST SKIN = PvP (Ed, Oct 31).
// One design for all classes (no class has a cape); scales with the character's
// mdlscale via the attach, same as weapons.
// SOURCE: Ed's file ___0_twjh.fbx — CGTrader doupeng cape #2908000, author
// beirayzha, Royalty Free License (no AI): commercial game use allowed, raw-file
// redistribution NOT allowed, AI training NOT allowed. Ship the IQM + textures
// only, never the FBX.
// MESH: cape ONLY, 9821 verts / 19250 tris (exact FBX counts, no faces lost).
// All faces smooth. The clasp disc (192 / 124) was REMOVED Oct 31 per Ed's
// preview verdict (it read as a coin in front of the neck), and the clasp ring
// (2304 / 1152) was REMOVED Oct 31 per Ed's follow-up verdict (the ring read
// odd) — the cape is now just the drape + the gold piping, nothing at the neck.
// TEXTURES — AUTHORED, NOT FROM THE DOWNLOAD: the doupeng download contained NO
// texture files at all (confirmed: zero texture refs in the FBX, zero images on
// import, Ed confirmed none exist). cape_pvp.png (1024) is an authored charcoal
// cloth (weave + mottling, restrained) with gold piping along the TRUE cape
// outline (390 boundary edges) in the set's unified gold 0xFFB832. No clasp
// geometry remains, so cape_gold.png (formerly solid set-gold for the ring)
// was dropped from the staging Oct 31.
// UVS: the FBX UVs were a planar projection (U ~ -11.5*X, V ~ 10*Y, range
// U[-338,410] V[-363,971], single island) — NOT a paintable unwrap. They were
// NORMALIZED to [0,1] (linear remap, geometry untouched) so the authored
// texture maps once across the cape. A straight hem stripe was REJECTED: the
// hem is diagonal, so a straight band reads as a gold tip, not a trim — the
// boundary piping follows the true diagonal hem instead.
// TAG (for the follow-up code step — NOT done here): this IQM is baked in
// neck_01-LOCAL space. The tag MUST be defined from neck_01 with IDENTITY
// offset, or the cape shifts by the offset. Verified: re-applying the neck_01
// world matrix to the exported verts reproduces the worn placement exactly
// (X[-11.58,13.62] Y[-10.00,-1.71] Z[5.53,54.00]).
// WORN POSITION: cape top edge Z 54 (neck_01 at 52.50), top-center Y -6.0
// (body back surface -5.06 at shoulder height — ~1 unit clearance, no visible
// clipping), hem Z 5.53 (near ground, boots peek below). Rotated 180 deg about
// Z at placement so the drape's concave side faces the body.
// NO mdlyaw: orientation is baked into the tag-relative verts; any mdlyaw
// would rotate the attach off the back.
// UNVERIFIED (needs Ed's in-game eyes): fit on all classes (ranger used for
// the preview; other skeletons share the rig but scales differ), 1024 texture
// sharpness up close, and the tag + attach code entry itself (separate step).
iqmdir "playermodels/attachments/cape"
iqmload "cape.iqm"
iqmskin "Cape" "cape_pvp.png"
