// PvP cape attach model — MAGI VARIANT (Ed, Nov 1).
// Same design, same colors as the shared cape (charcoal drape + gold
// piping 0xFFB832, cape_pvp.png copied byte-identical from
// playermodels/attachments/cape/) so it reads as part of the same set.
// SHAPE ONLY differs: re-baked in Magi Neck-local space. The shared
// cape's drape is twisted for the Magi neck frame (its hem swings to
// the front, -Y, and passes through the robe bell); this variant is
// the shared cape's approved ranger-worn shape rotated 180 deg about
// the neck point and shifted per-height to sit 1.5 proud of the robe
// bell at every height (worst central-strip clearance +0.83, per-vert
// min +1.00, zero buried verts, measured Nov 1). Lower drape follows
// the bell; length/width kept (hem near ground, top at neck, same as
// the shared cape).
// TAG: tag_cape with IDENTITY offset on the Magi Neck joint
// (packages/models/playermodels/wizard_male/iqm.cfg and
// sorceress_female/iqm.cfg) — the variant is baked in Magi neck-local
// space, like the shared cape is in ranger neck-local space.
// ATTACH: src/fpsgame/render.cpp renderplayer selects this variant
// for wizard_male / sorceress_female and the shared cape otherwise.
// NO mdlyaw: orientation is baked into the tag-relative verts.
// UNVERIFIED (needs Ed's in-game eyes): no in-game proof exists yet;
// bind-pose geometry check only. Hem fold creases (micro-edges at the
// robe's pleat ridge, max 12.3x on 0.2-unit edges) read as cloth
// folding in the composite preview; in-game motion is the final gate.
iqmdir "playermodels/attachments/cape_magi"
iqmload "cape_magi.iqm"
iqmskin "Cape" "cape_pvp.png"
