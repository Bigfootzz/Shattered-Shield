// Ranger Male player model — glTF version (Nov 11, 2026).
// Mirrors iqm.cfg but loads char.glb (split body, 5 Body_* meshes) and
// the UAL2 animations from anims.glb. All models on the Humanoid rig share
// the "humanoid" skeleton so armor attaches LINK_REUSE and deform.
gltfdir "playermodels/ranger_male"
gltfload "char.glb" "humanoid" 0
// Split body: base body split into per-part meshes so a body part can be
// hidden when its armor slot is equipped (armor swaps in place of the body
// part instead of layering on top). All parts share the Superhero body texture.
gltfskin "Body_Head" "T_Superhero_Male_Dark.dds"
gltfskin "Body_Torso" "T_Superhero_Male_Dark.dds"
gltfskin "Body_Arms" "T_Superhero_Male_Dark.dds"
gltfskin "Body_Legs" "T_Superhero_Male_Dark.dds"
gltfskin "Body_Feet" "T_Superhero_Male_Dark.dds"
gltfskin "Face" "T_Superhero_Male_Dark.dds"
gltfskin "Face.001" "T_Superhero_Male_Dark.dds"
gltftag tag_weapon tag_weapon
// Cape: tag_cape on the neck joint with IDENTITY offset.
gltftag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags: tag_helm/tag_torso/tag_legs/tag_boot_l/tag_boot_r,
// IDENTITY offset; attach models are skinned (per-model bind pose).
gltftag Head tag_helm 0 0 0 0 0 0
gltftag spine_03 tag_torso 0 0 0 0 0 0
gltftag pelvis tag_legs 0 0 0 0 0 0
gltftag foot_l tag_boot_l 0 0 0 0 0 0
gltftag foot_r tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/ranger_male/gltf_anims.cfg"
mdlscale 3546
mdlspec -1
mdlyaw -90
mdlglow 0
