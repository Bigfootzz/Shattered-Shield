iqmdir "playermodels/ranger_male"
iqmload "char.iqm" "humanoid"
// Split body (Nov 10, armor swap): base body split into per-part meshes so a
// body part can be hidden when its armor slot is equipped (armor swaps in
// place of the body part instead of layering on top). All parts share the
// Superhero body texture.
iqmskin "Body_Head" "T_Superhero_Male_Dark.dds"
iqmskin "Body_Torso" "T_Superhero_Male_Dark.dds"
iqmskin "Body_Arms" "T_Superhero_Male_Dark.dds"
iqmskin "Body_Legs" "T_Superhero_Male_Dark.dds"
iqmskin "Body_Feet" "T_Superhero_Male_Dark.dds"
iqmskin "Eyebrows" "T_Hair_1_BaseColor.dds"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Hair" "../hair_darkbrown.png"
iqmtag tag_weapon tag_weapon
// Cape (Nov 10, re-applied from Nov 1): tag_cape on the neck joint
// with IDENTITY offset - the cape IQM is baked in neck-local space,
// so any offset here would shift the drape off the back.
iqmtag neck_01 tag_cape 0 0 0 0 0 0
// Armor attach tags (Nov 10, Ed's "true armor swapping"):
// tag_helm/tag_torso/tag_legs/tag_boot_l/tag_boot_r, IDENTITY offset;
// attach models are baked in the tag joint's local space (cape pattern).
iqmtag Head tag_helm 0 0 0 0 0 0
iqmtag spine_03 tag_torso 0 0 0 0 0 0
iqmtag pelvis tag_legs 0 0 0 0 0 0
iqmtag foot_l tag_boot_l 0 0 0 0 0 0
iqmtag foot_r tag_boot_r 0 0 0 0 0 0

exec "packages/models/playermodels/ranger_male/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
