// Tomas (monk) -- CDmir/TinyWorlds, CC0, OpenGameArt (see fullcredits.txt).
// Replaces the backwards-headed static peasant for Tomas only; Corvin
// keeps npcs/male_peasant_static. Idle is the monk's own looping idle.
iqmdir "npcs/monk"
iqmload "char.iqm"
iqmskin "Body" "monk-tuc-body-skin.png"
iqmskin "Hair" "hair-skin.png"
iqmskin "Head" "monk-tuc-head-skin.png"
iqmanim "idle" "idle.iqm" 24
// Monk .blend is in meters (~1.77 tall); peasants are ~63.7 game units,
// so scale x36 to match. (mdlscale N = N/100.)
mdlscale 3062
mdlspec -1
mdlglow 0
mdlyaw 90
