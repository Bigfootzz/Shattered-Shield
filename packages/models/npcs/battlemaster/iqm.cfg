// Battlegrounds Master (STATIC) — battleground queue NPC (Quaternius, CC0).
// Warrior model, R4 look: black under armor (arms, legs, torso, neck black
// collar; head/face skin, red hair, black eyebrows), single gray pauldron,
// brown belts, brown quilted skirt, brown buckled boots, cape, red sword
// baked into the static mesh in the right hand, blade down, NO shield.
// STATIC, like npcs/female_peasant_static: this cfg deliberately does NOT
// exec anims.cfg, so no iqmanim is ever registered. char.iqm carries zero
// embedded anims (num_anims 0, num_frames 0, num_poses 0), so the engine
// takes its numframes == 0 static path and draws the bind pose standing
// still. The bind pose IS the final pose: arms down, natural standing,
// NOT T pose (baked from the R4 Blender pose, verified by IQM decode:
// upperarm joints rotated 77.3 deg from the warrior T-pose rest).
// NO iqmtag: the sword is baked into the static mesh, not a separate
// weapon model. tag_weapon is unproven on a numframes == 0 model and an
// NPC never swaps weapons, so baking is the correct choice here.
// OWN DIRECTORY, do NOT reuse playermodels/warrior_female: the engine
// caches meshgroups by mesh path, and loading the animated warrior
// variant in the same session would collide with this static model
// (same warning as in female_peasant_static/iqm.cfg).
// Scale/yaw: mdlscale 100 as for all player/NPC models. mdlyaw 90, copied
// from npcs/female_peasant_static (the proven NPC facing fix; the warrior
// player cfg uses mdlyaw -90, which is the player-camera orientation, not
// the NPC facing). Verify facing in the in-game screenshot before commit.
iqmdir "npcs/battlemaster"
iqmload "char.iqm"
iqmskin "Superhero_Female" "T_Superhero_Female_Dark_BaseColor.png"
iqmskin "Superhero_Female_Black" "T_UnderArmor_Black.png"
iqmskin "Female_Ranger_Body" "T_Warrior_Tinted.png"
iqmskin "Female_Ranger_Body_Black" "T_UnderArmor_Black.png"
iqmskin "Female_Ranger_Body_Belt_1" "T_Warrior_Tinted.png"
iqmskin "Female_Ranger_Body_Belt_2" "T_Warrior_Tinted.png"
iqmskin "Female_Ranger_Arms" "T_UnderArmor_Black.png"
iqmskin "Female_Ranger_Arms_Bracer" "T_Warrior_Tinted.png"
iqmskin "Female_Ranger_Legs" "T_UnderArmor_Black.png"
iqmskin "Female_Ranger_Feet" "T_Warrior_Tinted.png"
iqmskin "Female_Ranger_Acc_Pauldrons" "T_Warrior_Tinted.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Eyebrows" "T_Hair_Black.png"
iqmskin "Hair_Long" "T_Hair_RedBright.png"
iqmskin "Cape2" "T_Cape_Dark.png"
iqmskin "FurTrim" "T_Fur_Brown.png"
iqmskin "Weapon_SwordGolden_RedBlade" "T_Sword_Red.png"
iqmskin "Weapon_SwordGolden_DarkGuard" "T_Sword_Dark.png"
iqmskin "Weapon_SwordGolden_DarkSteel" "T_Sword_Dark.png"
iqmskin "Weapon_SwordGolden_WoodGrip" "T_Sword_Wood.png"
iqmskin "Weapon_SwordGolden_WoodDark" "T_Sword_WoodDark.png"
mdlscale 98
mdlspec -1
mdlyaw 90
mdlglow 0
