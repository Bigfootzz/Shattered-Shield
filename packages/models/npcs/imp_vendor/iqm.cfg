// Imp Vendor "Glimmer" — friendly merchant imp (Quaternius Bestiary, CC0)
// Uses the imp mesh with T_Imp_BaseColor_2.png (distinct from hostile imps
// which use BaseColor_1), so players can tell the vendor apart at a glance.
// Includes idle anim so it stands naturally (not T-posed like static peasants).
// The imp is a folklore creature (small clever demon/familiar, classic
// merchant trope) — Ed's non-human vendor pick for v0.1.23.
iqmload imp.iqm
iqmskin Imp_Body T_Imp_BaseColor_2.png
iqmskin Imp_Chains T_Imp_BaseColor_2.png
iqmskin Imp_Mace T_Imp_BaseColor_2.png
iqmskin Imp_Shorts T_Imp_BaseColor_2.png
iqmskin Imp_SpikedCollar T_Imp_BaseColor_2.png
mdlscale 100
mdlspec -1
mdlyaw -90
iqmanim idle idle.iqm 24
