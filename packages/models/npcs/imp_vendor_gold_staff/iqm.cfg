// Imp Vendor (Gold, Staff) — "Blasque", the PvP vendor (Oct 31).
// Gold recolor of Glimmer's imp (T_Imp_BaseColor_3.png, same as
// npcs/imp_vendor_gold, which this dir does NOT modify), with the
// carried mace REPLACED by the fancy_staff (Gilded Talon) mesh baked
// into imp.iqm as Imp_Staff: the mace mesh is gone from this file,
// not hidden, so Blasque never renders two weapons. Staff verts are
// weighted 100% to hand_r (joint 30, the mace's old joint), grip at
// the hand, tip up: butt z 30.7, tip z 66.9 in bind pose (scale 0.6).
// Same skeleton + idle as the gold imp, so idle.iqm still applies.
// Staff albedo/normal copied from playermodels/vwep/magi/fancy_staff
// (source: CGTrader "Wizard Staff" by goldmanstudio, Royalty Free).
// STAFF ORIENTATION FIX (Nov 8): the staff was baked vertical in
// BIND pose, but the idle animation rotates hand_r ~87 deg from bind,
// so in game the staff lay nearly horizontal, pointing backwards
// (idle staff dir was -0.40, -0.91, 0.06). The Imp_Staff verts were
// re-baked rotated ~86.7 deg about axis (-0.89, -0.457, 0) around the
// hand_r bind position, so the staff now stands vertical (tip up) in
// the IDLE pose (verified: idle staff dir (0,0,1), within ~5 deg
// through the whole idle cycle; Blender idle render confirms).
// Backup of the pre-fix mesh: imp_pre_staff_fix.iqm (same dir).
iqmload imp.iqm
iqmskin Imp_Body ../imp_vendor_gold/T_Imp_BaseColor_3.dds
iqmskin Imp_Chains ../imp_vendor_gold/T_Imp_BaseColor_3.dds
iqmskin Imp_Staff ../../playermodels/vwep/magi/fancy_staff/fancy_staff_albedo.dds
iqmskin Imp_Shorts ../imp_vendor_gold/T_Imp_BaseColor_3.dds
iqmskin Imp_SpikedCollar ../imp_vendor_gold/T_Imp_BaseColor_3.dds
bumpmap "Imp_Staff" "../../playermodels/vwep/magi/fancy_staff/fancy_staff_normal.dds" "../../playermodels/vwep/magi/fancy_staff/fancy_staff_albedo.dds"
mdlscale 100
mdlspec -1
mdlyaw -90
iqmanim idle idle.iqm 24
