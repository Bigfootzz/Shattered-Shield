// Female Peasant (STATIC) — villager NPC (Quaternius Modular Outfits, CC0).
// Same mesh and skins as npcs/female_peasant, but with NO animation:
// this cfg deliberately does NOT exec anims.cfg, so no iqmanim is ever
// registered. The peasant char.iqm itself carries zero embedded anims
// (num_anims 0, num_frames 0), so the engine takes its numframes == 0
// static path (skelmeshgroup::render) and draws the bind pose, standing
// still. That drops the retargeted ranger idle that left NPC heads
// backwards in-game; NPCs only stand and talk, so they need no anim.
// Mesh/textures are shared with npcs/female_peasant via iqmdir (no copies,
// so a mesh fix flows through automatically). Consequence: do NOT load
// npcs/female_peasant anywhere in the same session — the engine caches
// meshgroups by mesh path, and loading the animated variant first would
// hand this model an animated skeleton. After the rpg.cpp repoint, the
// animated peasant has no remaining consumer (verified by repo grep).
// Scale/yaw are copied verbatim from the animated cfg: mdlyaw 90 was the
// facing fix, and the body facing was correct — only the head was wrong.
iqmdir "npcs/female_peasant"
iqmload "char.iqm"
iqmskin "Female_Peasant_Legs" "T_Peasant_BaseColor.png"
iqmskin "Female_Peasant_Arms" "T_Peasant_BaseColor.png"
iqmskin "Female_Peasant_Body" "T_Peasant_BaseColor.png"
iqmskin "Female_Peasant_Feet" "T_Peasant_BaseColor.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "Superhero_Female" "T_Superhero_Female_Dark_BaseColor.png"
iqmskin "Eyebrows_Female" "T_Hair_2_BaseColor.png"
iqmskin "Hair_Buns" "T_Hair_2_BaseColor.png"
mdlscale 100
mdlspec -1
mdlyaw 90
mdlglow 0
