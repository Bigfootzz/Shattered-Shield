// Male Peasant — villager NPC (Quaternius Modular Outfits, CC0).
// Converted with the official lsalzman IQM pipeline (same as v0.1.20 players).
// Idle-only: NPCs don't fight, so no tag_weapon and no attack anims.
// Note: the second arm mesh was renamed Male_Peasant_Arm2 in the
// IQM because the exporter emitted two meshes named Male_Peasant_Arms; the
// engine applies one skin per mesh name, so they must differ.
iqmdir "npcs/male_peasant"
iqmload "char.iqm"
iqmskin "Male_Peasant_Legs" "T_Peasant_BaseColor.png"
iqmskin "Male_Peasant_Body" "T_Peasant_BaseColor.png"
iqmskin "Male_Peasant_Arms" "T_Regular_Male_Dark_BaseColor.png"
iqmskin "Male_Peasant_Arm2" "T_Peasant_BaseColor.png"
iqmskin "Male_Peasant_Feet" "T_Peasant_BaseColor.png"
iqmskin "Eyes" "T_Eye_Brown.png"
iqmskin "SuperHero_Male" "T_Superhero_Male_Dark.png"
iqmskin "Eyebrows_Regular" "T_Hair_1_BaseColor.png"
iqmskin "Hair_SimpleParted" "T_Hair_1_BaseColor.png"
exec "packages/models/npcs/male_peasant/anims.cfg"
mdlscale 100
mdlspec -1
mdlyaw -90
mdlglow 0
