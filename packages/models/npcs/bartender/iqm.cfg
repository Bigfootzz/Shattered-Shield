// Maren (bartender model) -- CDmir/TinyWorlds, CC0, OpenGameArt (Kelgar set).
// Replaces the static peasant for Maren only; name, spawn, quest dialogue
// unchanged -- only the model swaps. Standing idle retargeted from the
// monk's Idle.001 (same CDmir family); sit.iqm stays as fallback only.
iqmdir "npcs/bartender"
iqmload "char.iqm"
iqmskin "Bartender_Body" "body-skin.png"
iqmskin "Bartender_Hair" "hair-skin.png"
iqmskin "Bartender_Head" "head-skin.png"
iqmanim "stand" "stand.iqm" 24
// Bartender file measures 14.635 units tall (not meters like the monk);
// peasants are ~63.7 game units, so 435 (x4.35) gives 63.66 units.
// (mdlscale N = N/100.)
mdlscale 327
mdlspec -1
mdlglow 0
// mdlyaw deliberately unset: facing orientation is unverified and must be
// checked in game at wiring time. Do not copy the monk's 90.
