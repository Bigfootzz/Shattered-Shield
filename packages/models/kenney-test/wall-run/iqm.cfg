// Kenney wall block, reused as a WALL RUN piece (Twin Keeps v7.2 fortress
// walls). Same IQM as kenney-test/wall (516 verts, 178 tris, 1 mesh, file
// bounds 71.6 x 71.6 x 93.8 units = 2.0 m wide, 2.62 m tall).
// mdlscale 500 renders 89.5u long x 89.5u thick x 117.2u tall in game
// (engine scale = /4), i.e. close to the 128u cube walls it replaces.
iqmdir "kenney-test/wall-run"
iqmload "wall.iqm"
iqmskin "wall" "colormap.png"
mdlscale 500
mdlcollide 1
