// CGTrader "Medieval House and Wood Cabin Pack" #6434365, Medieval House,
// Royalty Free No-AI. Re-exported WITHOUT joining (v7 swap): 9 meshes,
// 28,516 verts, 17,984 tris. Diffuses are the 1024-max tone-down set
// (Wood/Plaster downscaled 4096->1024); Metal + 4 Windows are flat colors
// from the source materials, baked as tiny flat PNGs.
iqmdir "cgtrader/pack-house"
iqmload "pack-house.iqm"
iqmskin "pack-house_Bricks" "bricks_basecolor.png"
iqmskin "pack-house_Metal" "metal_flat.png"
iqmskin "pack-house_Roof" "roof_basecolor.jpg"
iqmskin "pack-house_Wall" "wall_basecolor.png"
iqmskin "pack-house_Window" "window_flat.png"
iqmskin "pack-house_Window.001" "window_flat.png"
iqmskin "pack-house_Window.002" "window_flat.png"
iqmskin "pack-house_Window.003" "window_flat.png"
iqmskin "pack-house_Wood" "wood_basecolor.png"
mdlscale 80  // v7.6 (Nov 8, Ed playtest: all houses 50% smaller; 160 -> 80; was 200 -> 160 in v7.2)
mdlcollide 1
