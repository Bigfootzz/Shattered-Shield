// CGTrader "Medieval House and Wood Cabin Pack" #6434365, Wood Cabin,
// Royalty Free No-AI. Re-exported WITHOUT joining (v7 swap): 2 meshes,
// 19,610 verts, 9,416 tris. Single Wood062 diffuse (1024-max tone-down);
// Metal is a flat color from the source material, baked as a tiny PNG.
// Kept at pack-relative scale (205 file units, ~51 in game at mdlscale 100;
// was ~102 at mdlscale 200 before the v7.6 halving).
iqmdir "cgtrader/pack-cabin"
iqmload "pack-cabin.iqm"
iqmskin "pack-cabin_Metal" "metal_flat.png"
iqmskin "pack-cabin_Wood" "wood_basecolor.png"
mdlscale 100  // v7.6 (Nov 8, Ed playtest: all houses 50% smaller; 200 -> 100)
mdlcollide 1
