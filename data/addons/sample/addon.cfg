// Sample add-on (Nov 13, UI enhancement Phase 3) — proves the add-on
// loader works and shows the pattern for real add-ons. It adds a small
// "AddOns" info panel; open it with /showgui samplepanel (or bind a key).
// It uses only GUI commands + persist (a saved variable), no gameplay
// actions, so it is safe to ship as the example. Delete this folder to
// remove the sample; add your own folder beside it for a real add-on.
//
// Add-on rules (see docs/addons.md):
//  - Build UI with the same GUI commands (guiframe, guibutton, ...).
//  - Read game state with rpg* queries; never invent data.
//  - Gameplay actions (equip, use, cast, ...) ONLY inside a button or
//    key callback, which is a real hardware event. Never call them at
//    load time or from a timer/loop.
//  - Persist settings with `persist <var>`; they survive restarts.
sample_version = "1.0"
sample_author = "Static Shift"
persist sample_showwelcome
sample_showwelcome = 1

newgui samplepanel [
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    guiframe "samplepanel" 34 8 [
        guistrut 5 0
        guilist [
            guistrut 24 1
            guistrut 1.0 0
            guilist [
                guispring 1
                guitextscale 1.0 [ guitext "AddOns work" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            guistrut 0 1.0
            guibar
            guitext "This panel comes from data/addons/sample/addon.cfg." "" 0
            guitext "Add your own folder beside it to make an add-on." "" 0
            guistrut 0 1.0
        ]
        guistrut 5 0
    ]
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guilift 0.12; guipanel main" "0"
