// Shattered Shield — per-type loot tables (content data layer, crafting build).
// ss_loot begins (or reopens) the table for a monster class key; ss_loot_add
// appends a weighted entry. Weights are per 100 rolls and must not sum past
// 100 per table; the remainder is "no drop". A monster class with no table
// here falls back to the "default" table (the world loot pool); only if that
// is missing too does it fall back to the compiled-in global table.
// Loaded and validated with the rest of the data/rpg content set.

// World loot table (Nov 10, Ed's call — was the "zombie" table): the general
// gear table every monster class rolls against unless it has its own table
// below. The "default" key is the engine's fallback (see rollloot), so this
// is the world drop pool, not a zombie-only table. Same entries/weights as
// the old zombie table, plus the Warrior outfits.
// v0.1.23: jewelry added (low weights, rarer than potions/weapons).
ss_loot       "default"
ss_loot_add   "health_potion" 27
ss_loot_add   "puglin_stick" 10
ss_loot_add   "leather_helm" 8
ss_loot_add   "iron_boots" 5
ss_loot_add   "ranger_tunic" 6
ss_loot_add   "ranger_outfit" 5
ss_loot_add   "peasant_outfit" 5
ss_loot_add   "imp_mace" 5
ss_loot_add   "cloth_helm" 3
ss_loot_add   "cloth_tunic" 3
ss_loot_add   "grave_moss" 10
ss_loot_add   "copper_ring" 4
ss_loot_add   "silver_ring" 3
ss_loot_add   "copper_necklace" 4

// Imps: the starter mob. Keeps a potion drop, adds the fetch-pool materials
// (horn for the fetch, moss and bone shared with other tables).
// v0.1.23: jewelry added (low weights).
ss_loot       "imp"
ss_loot_add   "health_potion" 20
ss_loot_add   "imp_horn" 12
ss_loot_add   "grave_moss" 10
ss_loot_add   "old_bone" 8
ss_loot_add   "copper_ring" 5
ss_loot_add   "silver_ring" 4
ss_loot_add   "copper_necklace" 5

// Puglins: stick stays (a second way to arm up), hide feeds the fetch pool.
// v0.1.23: jewelry added (low weights).
ss_loot       "puglin"
ss_loot_add   "puglin_stick" 12
ss_loot_add   "puglin_hide" 18
ss_loot_add   "old_bone" 8
ss_loot_add   "copper_ring" 5
ss_loot_add   "silver_ring" 4
ss_loot_add   "copper_necklace" 5
