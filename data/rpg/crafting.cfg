// Shattered Shield — crafting recipes, Phase 1 (Oct 27, uncommitted).
//
// Minecraft-like combination crafting, consumables only. Two material
// ingredients (1 unit each, either slot order) make one consumable.
// No professions, no skill gates. Failed combinations are NOT recipes:
// the server answers those with a System-tab message and keeps the
// ingredients (craft_fail_lose 0); flipping that variable on is the only
// change needed to make failures consume ingredients instead.
//
// The Tomas quest starter is moss_bone_tonic: grave moss + old bone =
// Herbal Tonic. Tomas teaches exactly this one recipe in dialogue;
// everything else is discovered by trying, and discovered recipes land
// in the crafting window's Recipes tab, per character.
//
// Tier variants (ss_recipe_out_tier) are supported by the engine but
// Phase 1 recipes define none: all Phase 1 materials are common, so
// every craft resolves to the base output today. Rarer material variants
// in a later phase will fill these slots without code changes.

ss_recipe      "moss_bone_tonic"
ss_recipe_ing  grave_moss 1
ss_recipe_ing  old_bone 1
ss_recipe_out  herbal_tonic 1

ss_recipe      "moss_hide_wrap"
ss_recipe_ing  grave_moss 1
ss_recipe_ing  puglin_hide 1
ss_recipe_out  hide_wrap 1

ss_recipe      "bone_horn_draught"
ss_recipe_ing  old_bone 1
ss_recipe_ing  imp_horn 1
ss_recipe_out  horn_draught 1

ss_recipe      "hide_horn_tonic"
ss_recipe_ing  puglin_hide 1
ss_recipe_ing  imp_horn 1
ss_recipe_out  hidebound_tonic 1

// --- Crafting Phase 2: buff recipes (approved starter set, Oct 28) ---
// The only 2 unused distinct material pairs (Phase 1 uses moss+bone,
// moss+hide, bone+horn, hide+horn). Either slot order works (key is
// sorted in validatecrafting/commitcrafting). Tier variants of the
// output scale with ingredient tiers via ss_recipe_out_tier.
ss_recipe "moss_horn_battle"
ss_recipe_ing grave_moss 1
ss_recipe_ing imp_horn 1
ss_recipe_out battle_draught 1
ss_recipe_out_tier 1 battle_draught_t1 1
ss_recipe_out_tier 2 battle_draught_t2 1
ss_recipe_out_tier 3 battle_draught_t3 1
ss_recipe_out_tier 4 battle_draught_t4 1

ss_recipe "bone_hide_bulwark"
ss_recipe_ing old_bone 1
ss_recipe_ing puglin_hide 1
ss_recipe_out bulwark_tonic 1
ss_recipe_out_tier 1 bulwark_tonic_t1 1
ss_recipe_out_tier 2 bulwark_tonic_t2 1
ss_recipe_out_tier 3 bulwark_tonic_t3 1
ss_recipe_out_tier 4 bulwark_tonic_t4 1
