// Battlegrounds fallback flag positions (v0.1.40).
// krpg ships gametype "rpg" != gameident "fps", so FLAG entities in the
// map file are dropped at load and can never be the flag source there.
// These lines ARE the flag source for maps listed here, read by both the
// server setup and the client setup (same file, same positions).
// Format: <map> <team 1=Blue 2=Red> <x> <y> <z>
// krpg bases: Blue = the map's single playerstart XY (712,1480), but
// with z at FEET/GROUND level, NOT the playerstart z: playerstart z is
// origin level (~16 above feet), and the flag touch radius is 16, so
// a flag at playerstart z sits exactly at/beyond the radius edge.
// Proven by the s2c run: the settled player o at the blue base is
// (712,1480,4096), i.e. feet ~4080, so a flag at 4100 is 20 units
// above the feet and never touches. Blue z was 4080 (ground level),
// but s2db/s2db2/s2db3 (Oct 30) all void-died 8s after teleporting
// to blue at o.z 4096 (feet exactly 4080, zero clearance over the
// surface): "you fell to the unknown" (o.z < 0 suicide, physics
// fall-through, no dodamage). Blue z 4084 gives 4 units of
// clearance over the 4080 surface; the flag stays well inside the
// 16-unit touch radius of a standing player (feet 4080).
// Red = the far-east author-placed pickup position (6948,1748), with
// z at FEET/GROUND level like blue: the pickup z (4108) is 26 above
// the measured standing feet there (settled o 4097.56 minus ~16
// eyeheight = ~4081.56), so a flag at pickup z can never be touched
// by a standing player (touch radius is 16; the run-1 take only fired
// because the teleported player FELL through the flag's band).
// Red z 4082 = ground level at the red base.
// Retune here without rebuilding; real battleground maps with FLAG
// entities ignore this file (entity flags win when present).
krpg 1 712 1480 4084
krpg 2 6948 1748 4082
