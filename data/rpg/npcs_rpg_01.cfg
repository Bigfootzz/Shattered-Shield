// Call to Arms board (Nov 1): the mounted notice board as an NPC-like quest
// giver. The board's VISUAL is mapmodel def 81 in rpg_01.cfg (entity at
// 1778, 2052, 2192, scale 50, north wall) - NPC models are NEVER rendered in
// the world, so this entry does NOT double-draw the board; it only gives the
// board a talk target, a nameplate, and a gold minimap blip. The model path
// matches the mapmodel path so the model is preloaded once, not twice.
// Position: the board's mapmodel centre (1778, 2052) with z at the board's
// BOTTOM edge (2182), so the pick cylinder (z to z+70) covers the full board
// face - aiming at any part of the board selects it. Talk range is horizontal
// only (16u), so z does not affect F-talk range. Type questgiver + a *_main
// dialogue (not a vendor marker) so F-talk opens the quest dialogue.
ss_npc          "board"
ss_npc_name     "Call to Arms"
ss_npc_model    "objects/notice_board"
ss_npc_pos      1778 2052 2182
ss_npc_yaw      0
ss_npc_type     questgiver
ss_npc_dialogue "board_main"
