// Shattered Shield NPC content - editor Phase 1 (Oct 24, 2026).
//
// NPCs for rpg_01, migrated from the hardcoded NPCS[] table in src/rpg/rpg.cpp.
// Flat ss_* setter lines, // comments, quoted strings. Parsed strictly at map
// load (never executed). This file is written by the in-editor NPC tool (F7)
// and is hand-editable as a fallback.
//
// A vendor is not a separate NPC kind: it is a dialogue marker. Glimmer's
// dialogue "vendor_main" opens the vendor GUI instead of a quest dialogue
// graph (see rpg_talk). Vendor stock stays in the rpgvendor GUI for now;
// Phase 3 moves stock into this file as ss_npc_stock.

