// Call to Arms board (Nov 1): the mounted notice board as an NPC-like quest
// giver. The board's VISUAL is this NPC entry itself: there is NO mapmodel
// entity for the board in rpg_01.ogz (verified Nov 17 - the old def-81 claim
// was wrong; def 81 is an empty slot), so the notice_board model renders in
// the world at this NPC's position. The model origin is its CENTER (IQM z
// -20..+20, mdlscale 50 -> 20 tall in game), so z IS the board centre.
// Nov 17 playtest (Notes 172/173): the board as shipped (z 2182) sat above
// the player's eye level; lowered to eye level (ground 2145.8 + eyeheight 15
// = 2161). Talk range is horizontal only (16u), so z does not affect F-talk.
// Type questgiver + a *_main dialogue (not a vendor marker) so F-talk opens
// the quest dialogue.
ss_npc          "board"
ss_npc_name     "Call to Arms"
ss_npc_model    "objects/notice_board"
ss_npc_pos      1778 2052 2161
ss_npc_yaw      0
ss_npc_type     questgiver
ss_npc_dialogue "board_main"
