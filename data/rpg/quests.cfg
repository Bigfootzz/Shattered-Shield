// Shattered Shield quest content - quest engine v2 (Oct 21).
//
// Quests, staged objectives and NPC dialogue graphs. Flat ss_* setter lines,
// // comments, quoted strings. Parsed strictly at init (never executed).
// Quest ids are permanent and append-only: 1-3 Maren's chain, 4 the relay,
// 5 the errand, 6 the procedural fetch template.
//
// Dialogue entry selection: the first node (definition order) whose
// ss_nodewhen clauses all hold. Nodes without ss_nodewhen are goto-only
// except the graph's last node, which is the fallback.

ss_quest        1
ss_quest_key    "cull_the_imps"
ss_quest_name   "Cull the Imps"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The fields are quiet. The village sleeps a little easier."
ss_stage        1
ss_objective    kill any 5
ss_journal      "Elder Maren asked me to cull 5 of the imps plaguing the fields."

ss_quest        2
ss_quest_key    "the_imps_keep_coming"
ss_quest_name   "The Imps Keep Coming"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The imp pressure is broken - for now."
ss_stage        1
ss_objective    kill any 8
ss_journal      "Elder Maren asked me to thin 8 more of the imps."

ss_quest        3
ss_quest_key    "the_rotting_champion"
ss_quest_name   "The Rotting Champion"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The Rotting Champion is fallen. The village owes a debt."
ss_stage        1
ss_objective    kill champion 1
ss_journal      "Elder Maren asked me to slay the Rotting Champion."

ss_quest        4
ss_quest_key    "the_eastfield_letter"
ss_quest_name   "The Eastfield Letter"
ss_quest_giver  "maren"
ss_quest_final  5
ss_quest_done   "The letter reached Corvin, one way or another."
ss_stage        1
ss_objective    talk corvin
ss_journal      "Elder Maren asked me to carry a sealed letter to Corvin at the east homesteads."
ss_stage        3
ss_objective    talk maren
ss_journal      "Corvin sent a reply. I should take it back to Elder Maren."
ss_stage        4
ss_objective    talk maren
ss_journal      "Corvin took the letter and said nothing. I should report back to Elder Maren."

ss_quest        5
ss_quest_key    "a_neighborly_errand"
ss_quest_name   "A Neighborly Errand"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The tonic reached Tomas."
ss_stage        1
ss_objective    talk tomas
ss_journal      "Elder Maren asked me to take a health potion to Tomas. He is just east of Maren in the village clearing."

ss_quest        6
ss_quest_key    "village_provisions"
ss_quest_name   "Village Provisions"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_repeat 600
ss_quest_done   "The village stores are stocked - until next time."
ss_stage        1
ss_objective    fetch rolled
ss_journal      "Elder Maren asked me to gather supplies for the village stores."
ss_fetch_pool   "grave_moss" "old_bone" "imp_horn" "puglin_hide" "health_potion"
ss_fetch_amount 3 6

// ---------------------------------------------------------------- Maren --
ss_dialogue     "maren_main"

ss_node         "q1_turnin"
ss_nodewhen     quest 1 stage = 1
ss_nodewhen     objready 1
ss_say          "Elder Maren: The fields are quieter already. Good work, traveler."
ss_response     "The work is done." -> completequest 1 ; givexp 100 ; goto "q2_offer"

ss_node         "q2_turnin"
ss_nodewhen     quest 2 stage = 1
ss_nodewhen     objready 2
ss_say          "Elder Maren: Eight more down. You're earning your place here."
ss_response     "The work is done." -> completequest 2 ; givexp 150 ; goto "q3_offer"

ss_node         "q3_turnin"
ss_nodewhen     quest 3 stage = 1
ss_nodewhen     objready 3
ss_say          "Elder Maren: The champion is fallen! The village owes you a debt. Take this mace - you've earned it."
ss_response     "The work is done." -> completequest 3 ; givexp 300 ; giveitem imp_mace 1 ; close

ss_node         "letter_kind"
ss_nodewhen     quest 4 stage = 3
ss_say          "Elder Maren: His own hand! She thrives, then. You've done this village a kindness, traveler."
ss_response     "Glad to help." -> takeitem tomas_reply 1 ; givexp 150 ; completequest 4 ; close

ss_node         "letter_cold"
ss_nodewhen     quest 4 stage = 4
ss_say          "Elder Maren: No reply... Corvin was always proud. At least he knows. Thank you - after a fashion."
ss_response     "It's done." -> givexp 60 ; completequest 4 ; close

ss_node         "provisions_turnin"
ss_nodewhen     quest 6 stage = 1
ss_nodewhen     objready 6
ss_say          "Elder Maren: Just what the stores needed. The village thanks you."
ss_response     "Any time." -> takeitem rolled 1 ; givefetchxp 6 ; giveitem health_potion 1 ; setstage 6 0 ; close

ss_node         "q1_progress"
ss_nodequest    1
ss_nodewhen     quest 1 stage = 1
ss_say          "Elder Maren: The imps still plague the fields. $progress of $target slain."
ss_response     "I'll keep hunting." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "q2_progress"
ss_nodequest    2
ss_nodewhen     quest 2 stage = 1
ss_say          "Elder Maren: They keep coming, bolder now. $progress of $target slain."
ss_response     "I'll keep hunting." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "q3_progress"
ss_nodewhen     quest 3 stage = 1
ss_say          "Elder Maren: The champion still walks. End it, and the fields are ours."
ss_response     "I'll face it." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "letter_away"
ss_nodewhen     quest 4 stage = 1
ss_say          "Elder Maren: Corvin camps by the east homesteads. Mind the treeline."
ss_response     "On my way." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "errand_active"
ss_nodewhen     quest 5 stage = 1
ss_say          "Elder Maren: The potion goes to Tomas - he's just across the clearing."
ss_response     "I lost the tonic." ? hasitem health_potion < 1 -> giveitem health_potion 1 ; goto "errand_active"
ss_response     "Is there other work?" -> goto "maren_offers"
ss_response     "On my way." -> close

ss_node         "provisions_active"
ss_nodequest    6
ss_nodewhen     quest 6 stage = 1
ss_say          "Elder Maren: The stores still need $amount $item. ($progress of $target gathered.)"
ss_response     "I'll gather it." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "errand_offer"
ss_nodewhen     quest 5 stage = 0
ss_say          "Elder Maren: Before the real work - a small favor. Take this health potion to Tomas, just across the clearing. He'll know what to do with it."
ss_response     "I'll do it." -> giveitem health_potion 1 ; setstage 5 1 ; close
ss_response     "Not now." -> goto "maren_offers"

ss_node         "q1_offer"
ss_nodewhen     quest 1 stage = 0
ss_say          "Elder Maren: You're the new sword arm 'round here. The fields south of the village crawl with imps - cull 5 of them and I'll make it worth your while."
ss_response     "I'll do it." -> setstage 1 1 ; close
ss_response     "Not now." -> goto "maren_offers"

ss_node         "q2_offer"
ss_nodewhen     quest 2 stage = 0
ss_nodewhen     questdone 1
ss_say          "Elder Maren: The imps keep coming - bolder now. Thin 8 more of them and the village can breathe again."
ss_response     "I'll do it." -> setstage 2 1 ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "q3_offer"
ss_nodewhen     quest 3 stage = 0
ss_nodewhen     questdone 2
ss_say          "Elder Maren: There's worse than imps out there now. A rotting champion leads them - end it, and take its mace as proof of the deed."
ss_response     "I'll face it." -> setstage 3 1 ; spawnchampion ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "letter_offer"
ss_nodewhen     quest 4 stage = 0
ss_say          "Elder Maren: Corvin hunts the east fields and owes this village word of his kin. Take him this sealed letter - he's camped by the east homesteads."
ss_response     "I'll carry it." -> giveitem sealed_letter 1 ; setstage 4 1 ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "provisions_offer"
ss_nodewhen     quest 6 stage = 0
ss_nodewhen     cooldownready 6
ss_say          "Elder Maren: Our stores run low again. Will you gather for us?"
ss_response     "What do you need?" -> rollfetch 6 ; setstage 6 1 ; goto "provisions_rolled"
ss_response     "Not today." -> goto "maren_offers"

ss_node         "provisions_rolled"
ss_nodequest    6
ss_say          "Elder Maren: Bring me $amount $item, and the village will thank you."
ss_response     "I'll gather it." -> close

ss_node         "maren_offers"
ss_say          "Elder Maren: What weighs on you?"
ss_response     "A small favor?" ? quest 5 stage = 0 -> goto "errand_offer"
ss_response     "Work against the imps?" ? quest 1 stage = 0 -> goto "q1_offer"
ss_response     "The east road?" ? quest 4 stage = 0 -> goto "letter_offer"
ss_response     "Never mind." -> close

ss_node         "maren_done"
ss_nodewhen     questdone 1
ss_nodewhen     questdone 2
ss_nodewhen     questdone 3
ss_say          "Elder Maren: The village stands because of you. Rest, traveler - you've earned it."
ss_response     "Thank you." -> close

ss_node         "maren_default"
ss_say          "Elder Maren: The village has little, but what it has is yours."
ss_response     "Farewell." -> close

// ---------------------------------------------------------------- Tomas --
ss_dialogue     "tomas_main"

ss_node         "errand_turnin"
ss_nodewhen     quest 5 stage = 1
ss_nodewhen     hasitem health_potion >= 1
ss_say          "Tomas: The tonic! Maren worries too much, but thank her for me."
ss_response     "Here - from Maren." -> takeitem health_potion 1 ; givexp 25 ; giveitem ranger_tunic 1 ; giveitem puglin_stick 1 ; completequest 5 ; goto "errand_thanks"

ss_node         "errand_thanks"
ss_say          "Tomas: Take the tunic and this stick - you'll want them out there. Maren has real work for you now."
ss_response     "Thank you." -> close

ss_node         "tomas_idle"
ss_nodewhen     quest 5 stage = 0
ss_say          "Tomas: If you're looking for work, Elder Maren has a favor to ask."
ss_response     "I'll see her." -> close

ss_node         "tomas_done"
ss_say          "Tomas: The village looks to you now. Good luck out there."
ss_response     "Farewell." -> close

// ---------------------------------------------------------------- Corvin --
ss_dialogue     "corvin_main"

ss_node         "corvin_meet"
ss_nodewhen     quest 4 stage = 1
ss_nodewhen     hasitem sealed_letter >= 1
ss_say          "Corvin: State your business. The east road grows teeth after dark."
ss_response     "Elder Maren sends this, with her regards." -> goto "corvin_kind"
ss_response     "Letter. From the village. Take it." -> goto "corvin_cold"

ss_node         "corvin_kind"
ss_say          "Corvin: A letter? From the village... Give it here. [He reads, and his face softens.] Tell Maren my sister thrives - the homestead holds. And take these hides; you'll have more use for them than I do."
ss_response     "She'll be glad." -> takeitem sealed_letter 1 ; giveitem tomas_reply 1 ; giveitem puglin_hide 2 ; setstage 4 3 ; close

ss_node         "corvin_cold"
ss_say          "Corvin: [He takes the letter without a word and turns back to the treeline.] ...Tell her nothing. The road keeps me."
ss_response     "..." -> takeitem sealed_letter 1 ; setstage 4 4 ; close

ss_node         "corvin_idle"
ss_say          "Corvin: The east road is mine to watch. Mind the treeline."
ss_response     "Farewell." -> close
