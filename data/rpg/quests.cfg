// Shattered Shield quest content - quest engine v2 (Oct 21).
//
// Quests, staged objectives and NPC dialogue graphs. Flat ss_* setter lines,
// // comments, quoted strings. Parsed strictly at init (never executed).
// Quest ids are permanent and append-only: 1-3 Maren's chain, 4 the relay,
// 5 the errand, 6 the procedural fetch template.
//
// Dialogue entry selection: the first node (definition order) whose
// ss_nodewhen clauses all hold. Nodes without ss_nodewhen are goto-only
// except the graph's last node, which is the fallback.

ss_quest        1
ss_quest_key    "cull_the_imps"
ss_quest_name   "Cull the Imps"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The fields are quiet. The village sleeps a little easier."
ss_stage        1
ss_objective    kill any 5
ss_journal      "Elder Maren asked me to cull 5 of the imps plaguing the fields."

ss_quest        2
ss_quest_key    "the_imps_keep_coming"
ss_quest_name   "The Imps Keep Coming"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The imp pressure is broken - for now."
ss_stage        1
ss_objective    kill any 8
ss_journal      "Elder Maren asked me to thin 8 more of the imps."

ss_quest        3
ss_quest_key    "the_rotting_champion"
ss_quest_name   "The Rotting Champion"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_done   "The Rotting Champion is fallen. The village owes a debt."
ss_stage        1
ss_objective    kill champion 1
ss_journal      "Elder Maren asked me to slay the Rotting Champion."

ss_quest        4
ss_quest_key    "the_eastfield_letter"
ss_quest_name   "The Eastfield Letter"
ss_quest_giver  "maren"
ss_quest_final  5
ss_quest_done   "The letter reached Corvin, one way or another."
ss_stage        1
