ss_quest        6
ss_quest_key    "village_provisions"
ss_quest_name   "Village Provisions"
ss_quest_giver  "maren"
ss_quest_final  2
ss_quest_repeat 600
ss_quest_done   "The village stores are stocked - until next time."
ss_stage        1
ss_objective    fetch rolled
ss_journal      "Elder Maren asked me to gather supplies for the village stores."
ss_fetch_pool   "grave_moss" "old_bone" "imp_horn" "puglin_hide" "health_potion"
ss_fetch_amount 3 6

// Crafting intro (Phase 1, Oct 27, uncommitted): Tomas's follow-up, offered
// only after quest 5 is complete AND at least one recipe exists
// (recipes >= 1: with crafting.cfg unloaded the offer never fires, so the
// quest cannot be taken when there is nothing to craft). Stage 1 gathers
// two common materials; the stage 1 turn-in node is Tomas's walkthrough
// (it does NOT take the materials - the player still needs them to craft).
// Stage 2 is set by that walkthrough and has its own node reiterating
// where the crafting window is (Inventory -> Craft), so talking to Tomas
// again never falls through to the generic farewell. The first successful
// craft after it completes the quest server-side (final stage 3, no
// dialogue turn-in). Tomas teaches exactly ONE recipe (moss + bone =
// Herbal Tonic); everything else is discovered by trying and recorded
// in the Recipes tab.
ss_quest        7
ss_quest_key    "necessity_invention"
ss_quest_name   "Necessity Is the Mother of Invention"
ss_quest_giver  "tomas"
ss_quest_final  3
ss_quest_done   "You learned the craft - now the discovering begins."
ss_stage        1
ss_objective    talk tomas
ss_journal      "Tomas asked me to gather grave moss and an old bone, then return to him."
ss_stage        2
ss_objective    talk tomas
ss_journal      "Tomas showed me the crafting window. I should craft something to prove I have learned the craft."

// Corvin's necklace quest (v0.1.35, Ed Oct 28): the first turn-in
// quest that teaches the money system. Corvin asks the player to buy
// a copper necklace from Glimmer (15c, already in her stock) for his
// wife, and pays 1 silver (givemoney 100c) on turn-in. The offer uses
// Ed's own line: forgot her birthday, house ready before she comes
// home, a favor to pick up a necklace. No quest gate: offered
// whenever Corvin is talked to and quest 8 is untaken (the letter
// quest's corvin_meet node still fires first while it is active).
// Turn-in needs the talk objective (objready is true while talking
// to the target) plus the necklace in hand; the reward is money
// only, so the complete message omits the XP tail.
ss_quest        8
ss_quest_key    "gift_for_his_wife"
ss_quest_name   "A Gift for His Wife"
ss_quest_giver  "corvin"
ss_quest_final  2
ss_quest_done   "Corvin's wife has her necklace, and the house was ready."
ss_stage        1
ss_objective    talk corvin
ss_journal      "Corvin asked me to buy a copper necklace from Glimmer for his wife, then bring it back to him."

// ---------------------------------------------------------------- Maren --
ss_dialogue     "maren_main"

ss_node         "q1_turnin"
ss_nodewhen     quest 1 stage = 1
ss_nodewhen     objready 1
ss_say          "Elder Maren: The fields are quieter already. Good work, traveler."
ss_response     "The work is done." -> completequest 1 ; givexp 100 ; goto "q2_offer"

ss_node         "q2_turnin"
ss_nodewhen     quest 2 stage = 1
ss_nodewhen     objready 2
ss_say          "Elder Maren: Eight more down. You're earning your place here."
ss_response     "The work is done." -> completequest 2 ; givexp 150 ; goto "q3_offer"

ss_node         "q3_turnin"
ss_nodewhen     quest 3 stage = 1
ss_nodewhen     objready 3
ss_say          "Elder Maren: The champion is fallen! The village owes you a debt. Take this mace - you've earned it."
ss_response     "The work is done." -> completequest 3 ; givexp 300 ; giveitem imp_mace 1 ; close

ss_node         "letter_kind"
ss_nodewhen     quest 4 stage = 3
ss_say          "Elder Maren: His own hand! She thrives, then. You've done this village a kindness, traveler."
ss_response     "Glad to help." -> takeitem tomas_reply 1 ; givexp 150 ; completequest 4 ; close

ss_node         "letter_cold"
ss_nodewhen     quest 4 stage = 4
ss_say          "Elder Maren: No reply... Corvin was always proud. At least he knows. Thank you - after a fashion."
ss_response     "It's done." -> givexp 60 ; completequest 4 ; close

ss_node         "provisions_turnin"
ss_nodewhen     quest 6 stage = 1
ss_nodewhen     objready 6
ss_say          "Elder Maren: Just what the stores needed. The village thanks you."
ss_response     "Any time." -> takeitem rolled 1 ; givefetchxp 6 ; giveitem health_potion 1 ; setstage 6 0 ; close

ss_node         "q1_progress"
ss_nodequest    1
ss_nodewhen     quest 1 stage = 1
ss_say          "Elder Maren: The imps still plague the fields. $progress of $target slain."
ss_response     "I'll keep hunting." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "q2_progress"
ss_nodequest    2
ss_nodewhen     quest 2 stage = 1
ss_say          "Elder Maren: They keep coming, bolder now. $progress of $target slain."
ss_response     "I'll keep hunting." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "q3_progress"
ss_nodewhen     quest 3 stage = 1
ss_say          "Elder Maren: The champion still walks. End it, and the fields are ours."
ss_response     "I'll face it." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "letter_away"
ss_nodewhen     quest 4 stage = 1
ss_say          "Elder Maren: Corvin camps by the east homesteads. Mind the treeline."
ss_response     "On my way." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "errand_active"
ss_nodewhen     quest 5 stage = 1
ss_say          "Elder Maren: The potion goes to Tomas - he's just across the clearing."
ss_response     "I lost the tonic." ? hasitem health_potion < 1 -> giveitem health_potion 1 ; goto "errand_active"
ss_response     "Is there other work?" -> goto "maren_offers"
ss_response     "On my way." -> close

ss_node         "provisions_active"
ss_nodequest    6
ss_nodewhen     quest 6 stage = 1
ss_say          "Elder Maren: The stores still need $amount $item. ($progress of $target gathered.)"
ss_response     "I'll gather it." -> close
ss_response     "Is there other work?" -> goto "maren_offers"

ss_node         "errand_offer"
ss_nodewhen     quest 5 stage = 0
ss_say          "Elder Maren: Before the real work - a small favor. Take this health potion to Tomas, just across the clearing. He'll know what to do with it."
ss_response     "I'll do it." -> giveitem health_potion 1 ; setstage 5 1 ; close
ss_response     "Not now." -> goto "maren_offers"

ss_node         "q1_offer"
ss_nodewhen     quest 1 stage = 0
ss_say          "Elder Maren: You're the new sword arm 'round here. The fields south of the village crawl with imps - cull 5 of them and I'll make it worth your while."
ss_response     "I'll do it." -> setstage 1 1 ; close
ss_response     "Not now." -> goto "maren_offers"

ss_node         "q2_offer"
ss_nodewhen     quest 2 stage = 0
ss_nodewhen     questdone 1
ss_say          "Elder Maren: The imps keep coming - bolder now. Thin 8 more of them and the village can breathe again."
ss_response     "I'll do it." -> setstage 2 1 ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "q3_offer"
ss_nodewhen     quest 3 stage = 0
ss_nodewhen     questdone 2
ss_say          "Elder Maren: There's worse than imps out there now. A rotting champion leads them - end it, and take its mace as proof of the deed."
ss_response     "I'll face it." -> setstage 3 1 ; spawnchampion ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "letter_offer"
ss_nodewhen     quest 4 stage = 0
ss_say          "Elder Maren: Corvin hunts the east fields and owes this village word of his kin. Take him this sealed letter - he's camped by the east homesteads."
ss_response     "I'll carry it." -> giveitem sealed_letter 1 ; setstage 4 1 ; close
ss_response     "Another time." -> goto "maren_offers"

ss_node         "provisions_offer"
ss_nodewhen     quest 6 stage = 0
ss_nodewhen     cooldownready 6
ss_say          "Elder Maren: Our stores run low again. Will you gather for us?"
ss_response     "What do you need?" -> rollfetch 6 ; setstage 6 1 ; goto "provisions_rolled"
ss_response     "Not today." -> goto "maren_offers"

ss_node         "provisions_rolled"
ss_nodequest    6
ss_say          "Elder Maren: Bring me $amount $item, and the village will thank you."
ss_response     "I'll gather it." -> close

ss_node         "maren_offers"
ss_say          "Elder Maren: What weighs on you?"
ss_response     "A small favor?" ? quest 5 stage = 0 -> goto "errand_offer"
ss_response     "Work against the imps?" ? quest 1 stage = 0 -> goto "q1_offer"
ss_response     "The east road?" ? quest 4 stage = 0 -> goto "letter_offer"
ss_response     "Never mind." -> close

ss_node         "maren_done"
ss_nodewhen     questdone 1
ss_nodewhen     questdone 2
ss_nodewhen     questdone 3
ss_say          "Elder Maren: The village stands because of you. Rest, traveler - you've earned it."
ss_response     "Thank you." -> close

ss_node         "maren_default"
ss_say          "Elder Maren: The village has little, but what it has is yours."
ss_response     "Farewell." -> close

// ---------------------------------------------------------------- Tomas --
ss_dialogue     "tomas_main"

ss_node         "errand_turnin"
ss_nodewhen     quest 5 stage = 1
ss_nodewhen     hasitem health_potion >= 1
ss_say          "Tomas: The tonic! Maren worries too much, but thank her for me."
ss_response     "Here - from Maren." -> takeitem health_potion 1 ; givexp 25 ; giveitem ranger_tunic 1 ; giveitem puglin_stick 1 ; completequest 5 ; goto "errand_thanks"

ss_node         "errand_thanks"
ss_say          "Tomas: Take the tunic and this stick - you'll want them out there. Maren has real work for you now."
ss_response     "Thank you." -> close

ss_node         "tomas_idle"
ss_nodewhen     quest 5 stage = 0
ss_say          "Tomas: If you're looking for work, Elder Maren has a favor to ask."
ss_response     "I'll see her." -> close

// Crafting intro nodes (Phase 1, Oct 27, uncommitted). ORDER MATTERS:
// these sit BEFORE the unconditional tomas_done fallback, or they never
// fire (first matching node wins). craft_gather (with materials) sits
// before craft_gather_progress (without), for the same reason.
ss_node         "craft_offer"
ss_nodewhen     questdone 5
ss_nodewhen     quest 7 stage = 0
ss_nodewhen     recipes >= 1
ss_say          "Tomas: Maren's errand is done, but I have something else for you. The village needs hands that can make things, not just carry them. Will you learn the craft?"
ss_response     "Teach me." -> setstage 7 1 ; close
ss_response     "Another time." -> close

ss_node         "craft_gather"
ss_nodewhen     quest 7 stage = 1
ss_nodewhen     hasitem grave_moss >= 1
ss_nodewhen     hasitem old_bone >= 1
ss_say          "Tomas: Good. Open your Inventory, press Craft, and put grave moss and old bone together - that makes a Herbal Tonic. Rarer ingredients make better results. Failures cost nothing, and what you make is written in your Recipes tab."
ss_response     "Show me." -> setstage 7 2 ; close

ss_node         "craft_stage2"
ss_nodewhen     quest 7 stage = 2
ss_say          "Tomas: Your crafting window is in your Inventory, under Craft. Put grave moss and old bone together there, press Craft, and you will make a Herbal Tonic. Rarer ingredients make better results, and failures cost nothing."
ss_response     "I will craft." -> close

ss_node         "craft_gather_progress"
ss_nodewhen     quest 7 stage = 1
ss_say          "Tomas: Bring me grave moss and an old bone, and I will show you the craft."
ss_response     "On my way." -> close

ss_node         "craft_learned"
ss_nodewhen     questdone 7
ss_say          "Tomas: You made something with your own hands. Now go discover what else works - and tell your clan what you learn."
ss_response     "I will." -> close

ss_node         "tomas_done"
ss_say          "Tomas: The village looks to you now. Good luck out there."
ss_response     "Farewell." -> close

// ---------------------------------------------------------------- Corvin --
ss_dialogue     "corvin_main"

ss_node         "corvin_meet"
ss_nodewhen     quest 4 stage = 1
ss_nodewhen     hasitem sealed_letter >= 1
ss_say          "Corvin: State your business. The east road grows teeth after dark."
ss_response     "Elder Maren sends this, with her regards." -> goto "corvin_kind"
ss_response     "Letter. From the village. Take it." -> goto "corvin_cold"

ss_node         "corvin_kind"
ss_say          "Corvin: A letter? From the village... Give it here. [He reads, and his face softens.] Tell Maren my sister thrives - the homestead holds. And take these hides; you'll have more use for them than I do."
ss_response     "She'll be glad." -> takeitem sealed_letter 1 ; giveitem tomas_reply 1 ; giveitem puglin_hide 2 ; setstage 4 3 ; close

ss_node         "corvin_cold"
ss_say          "Corvin: [He takes the letter without a word and turns back to the treeline.] ...Tell her nothing. The road keeps me."
ss_response     "..." -> takeitem sealed_letter 1 ; setstage 4 4 ; close

// Corvin's necklace quest nodes (v0.1.35). ORDER MATTERS: these sit
// BEFORE the unconditional corvin_idle fallback, or they never fire
// (first matching node wins). Turn-in (with necklace) sits before
// progress (without), for the same reason. corvin_meet stays first
// so the letter quest keeps priority while it is active.
ss_node         "necklace_turnin"
ss_nodewhen     quest 8 stage = 1
ss_nodewhen     hasitem copper_necklace >= 1
ss_say          "Corvin: You brought one! Copper, just right. She'll love it - thank you."
ss_response     "Here - for your wife." -> takeitem copper_necklace 1 ; givemoney 100 ; completequest 8 ; goto "necklace_thanks"

ss_node         "necklace_progress"
ss_nodewhen     quest 8 stage = 1
ss_say          "Corvin: Glimmer has the necklaces - copper, nothing fancy. Bring me one and the house will be ready when she gets home."
ss_response     "On my way." -> close

ss_node         "necklace_offer"
ss_nodewhen     quest 8 stage = 0
ss_say          "Corvin: I forgot her birthday, and I need to get the house ready before she comes home. Can you do me a favor and pick up a necklace for her? Glimmer sells copper ones - bring me one back and I'll make it worth your while."
ss_response     "I'll pick one up." -> setstage 8 1 ; close
ss_response     "Not now." -> close

ss_node         "necklace_done"
ss_nodewhen     questdone 8
ss_say          "Corvin: She loved the necklace. Thank you again, traveler."
ss_response     "You're welcome." -> close

// The turn-in goto names necklace_thanks. Engine rule (server.cpp):
// a goto lands only when the target has when-clauses AND they hold -
// a no-when target falls back to entry selection. So thanks carries
// questdone 8 (true the moment completequest runs) to be landable,
// and sits AFTER done so later talks show done, not thanks, again.
// (Same shape as the pre-existing errand_thanks node, which has no
// when-clauses and therefore never lands via its goto.)
ss_node         "necklace_thanks"
ss_nodewhen     questdone 8
ss_say          "Corvin: The house will be ready, and now so is her gift. You've done me a real kindness, traveler."
ss_response     "Glad to help." -> close

ss_node         "corvin_idle"
ss_say          "Corvin: The east road is mine to watch. Mind the treeline."
ss_response     "Farewell." -> close

// ---------------------------------------------------------------- Abbott --
// v0.1.40 (battlegrounds): Lady Abbott, the Battle Master, runs the
// battleground queue. Talk -> pick a mode -> 45s queue countdown ->
// match -> scoreboard -> return in front of Abbott. CTF is live;
// KOTH/TFF are selectable stubs that answer "not yet" (no mechanics).
// LOAD-BEARING SHAPE — do not reorder casually: (1) every goto TARGET carries `ss_nodewhen level >= 1`
// (always true: characters start at level 1), because rpg_respond's
// goto lands only when the target has when-clauses AND they all hold
// (a when-less target never receives a goto — it falls back to entry
// selection); (2) abbott_greet is FIRST, so entry selection (first
// node whose whens hold, in file order) opens the greet, not the mode
// pick; (3) say lines carry no "Name: " prefix (the dialogue header
// already shows "Lady Abbott").
ss_dialogue     "abbott_main"

ss_node         "abbott_greet"
ss_nodewhen     level >= 1
ss_say          "War comes soon, be ready"
ss_response     "I seek battle." -> goto "abbott_modes"
ss_response     "Farewell." -> close

ss_node         "abbott_modes"
ss_nodewhen     level >= 1
ss_say          "Choose your field of battle."
ss_response     "Capture the Flag." -> bgqueue ctf ; close
ss_response     "King of the Hill." -> goto "abbott_koth_soon"
ss_response     "Team Free for All." -> goto "abbott_tff_soon"
ss_response     "Not yet." -> close

ss_node         "abbott_koth_soon"
ss_nodewhen     level >= 1
ss_say          "That field is not ready yet. Return when the horns sound."
ss_response     "Back." -> goto "abbott_modes"

ss_node         "abbott_tff_soon"
ss_nodewhen     level >= 1
ss_say          "That field is not ready yet. Return when the horns sound."
ss_response     "Back." -> goto "abbott_modes"
