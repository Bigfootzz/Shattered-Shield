// Shared PvP weapon glow registry (Oct 31, Ed's call: ALL PvP weapons
// share ONE signature amber/gold glow so players recognize PvP gear
// from afar).
//
// How a PvP weapon opts in (TWO steps, both required):
//   1. One `pvpglow "vwep/path"` line in this file, where the path is the
//      weapon's vwep model path exactly as it appears in its ss_item_vwep
//      line (this is the path the client learns via N_RPG_VWEP).
//   2. A tag_tip joint authored at the weapon tip at conversion time
//      (Blender: a bone/joint named tag_tip at the tip before IQM export).
//      Without tag_tip the glow code finds nothing and the weapon stays
//      dark — that is the safe no-op, not an error.
//
// The glow color itself lives in ONE place: PVPGLOW_COLOR in
// src/fpsgame/render.cpp. Change it there and every weapon here changes.
//
// STATUS: all three PvP weapons landed (entries at bottom):
//   - The Gilded Talon (Magi PvP purchased weapon; vwep staged Oct 31,
//     entry below; tag_tip at the claw ornament per Ed's spec)
//   - Duskthorn (Warrior PvP purchased weapon; vwep staged Oct 31,
//     entry below)
//   - Marrowstring (Ranger PvP purchased weapon; vwep staged Oct 31,
//     entry below; tag_tip at the nocked arrow's tip per Ed's spec)
// Do NOT add starter or
// non-PvP weapons here: the wooden staff (playermodels/vwep/magi/staff)
// and warrior sword (playermodels/vwep/warrior/sword) are stand-ins used
// while the mechanism was built, NOT PvP weapons, and must stay dark.

// Duskthorn — Warrior PvP purchased weapon (Blasque's shop, 20,000 Embers):
pvpglow "playermodels/vwep/warrior/elvish_sword"

// The Gilded Talon — Magi PvP purchased weapon (Blasque's shop, 20,000 Embers):
pvpglow "playermodels/vwep/magi/fancy_staff"

// Marrowstring — Ranger PvP purchased weapon (Blasque's shop, 20,000 Embers):
pvpglow "playermodels/vwep/ranger/skeleton_bow"
