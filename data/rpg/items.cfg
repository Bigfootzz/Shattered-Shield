// Shattered Shield — item definitions (content data layer, crafting build).
// Loaded by the server (and client, for display) at startup via the ss_*
// setter commands. One block per item: ss_item begins a definition, the
// following setters fill it in, and the next ss_item commits it. The whole
// file set is validated before anything goes live — a bad definition is
// rejected loudly in the log and the compiled-in fallback table is used
// instead. Item ids are permanent: database rows key on them, so never
// rename or reuse an id.
//
// Types: weapon | armor | consumable | material | tool
// Slots (gear only): mainhand | head | torso | legs | feet | neck | ring1 | ring2
// Neck/rings are stats-only (no 3D model/vwep shown on the character).
// Ring slots are distinct: a ring1 item equips only to ring1, ring2 only
// to ring2.

ss_item        "imp_mace"
ss_item_name   "Imp Mace"
ss_item_type   "weapon"
ss_item_slot   "mainhand"
ss_item_icon   "packages/ui/rpg/icons/icon_mace.png"
ss_item_vwep   "playermodels/vwep/warrior/mace"
ss_item_damage 15
ss_item_value  60

// Warrior sword (test item, 2026-10-24, uncommitted): vwep is the
