macro resbutton [
    guibutton "%1x%2" "screenres %1 %2" (if (&& (= $scr_w %1) (= $scr_h %2)) [result "radio_on"] [result "radio_off"])
]

part_resolution = [
    guistayopen [ guilist [
        guilist [
            guitext "16:9"
            @(resbutton 1280 720)
            @(resbutton 1366 768)
            @(resbutton 1536 864)
            @(resbutton 1600 900)
            @(resbutton 1920 1080)
            @(resbutton 2560 1440)
            @(resbutton 3840 2160)
        ]
        guibar
        guilist [
            guitext "16:10"
            @(resbutton 1280 800)
            @(resbutton 1440 900)
            @(resbutton 1680 1050)
            @(resbutton 1920 1200)
        ]
        guibar
        guilist [
            guitext "Custom"
            guilist [
                customw = $scr_w
                customh = $scr_h
                guifield customw 4 [scr_w $customw]
                guifield customh 4 [scr_h $customh]
            ]
        ]
    ] ]
]

newgui "Options: Resolution" [
    guinoautotab [
        part_resolution
        part_optionsFooter
    ]
]
