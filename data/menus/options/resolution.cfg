macro resbutton [
    guibutton "%1x%2" "screenres %1 %2" (if (&& (= $scr_w %1) (= $scr_h %2)) [result "radio_on"] [result "radio_off"])
]

part_resolution = [
    guistayopen [ guilist [
        guilist [
            guitext "16:9"
            @(resbutton 1280 720)
            @(resbutton 1366 768)
            @(resbutton 1536 864)
            @(resbutton 1600 900)
            @(resbutton 1920 1080)
            @(resbutton 2560 1440)
            @(resbutton 3840 2160)
        ]
        guibar
        guilist [
            guitext "16:10"
            @(resbutton 1280 800)
            @(resbutton 1440 900)
            @(resbutton 1680 1050)
            @(resbutton 1920 1200)
        ]
        guibar
        guilist [
            guitext "Custom"
            // v0.1.37 (Ed): Native sets scr to the desktop resolution queried
            // at startup ($desktopw/$desktoph, read-only engine vars). Emitted
            // only when the query succeeded, so it can never offer a 0x0
            // pick; a manual pick still persists as today, since this only
            // acts when pressed.
            (if (&& (> $desktopw 0) (> $desktoph 0)) [
                guibutton "Native" "screenres $desktopw $desktoph" (if (&& (= $scr_w $desktopw) (= $scr_h $desktoph)) [result "radio_on"] [result "radio_off"])
            ])
            guilist [
                customw = $scr_w
                customh = $scr_h
                guifield customw 4 [scr_w $customw]
                guifield customh 4 [scr_h $customh]
            ]
        ]
    ] ]
]

newgui "Options: Resolution" [
    guinoautotab [
        part_resolution
        part_optionsFooter
    ]
]
