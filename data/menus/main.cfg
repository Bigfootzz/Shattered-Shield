// Shattered Shield RPG main menu (ITEM 5, Oct 19; core pass)
// Front door: logo title over the backdrop. The backdrop itself is drawn
// fullscreen by renderbackground() (backdrop.png while mainmenu==1, the
// loadscreen.png art while loading). Buttons: PLAY / OPTIONS / ABOUT / EXIT.
// Version line at bottom. Stock menu backed up at main.cfg.stock.bak.
//
// LAYOUT NOTE (Revelade engine): gui orientation alternates with nesting
// depth — depth 0 is vertical, each guilist/guicenter/guialign flips it.
// So vertically-stacked centered content is: guicenter [ guilist [ ... ] ].
// (guicenter alone lays its contents out HORIZONTALLY.)
//
// API NOTE: guitext(name, icon, minwidth) — the 2nd arg is an ICON texture
// name, NOT a text scale ("0" hides it). Text size is set with guitextscale.
// guibutton(name, action, icon, minwidth) — same rule. guiimage draws a
// SQUARE icon, not a stretch.

// Show the front door at startup when not connected
sleep 1500 [ if (! (isconnected)) [ showgui main ] ]

// Character select state
menustatevar __char_server "local"
menustatevar __char_newname ""
menustatevar __char_newmodel "ranger_male"
menustatevar __char_newmodelidx 0
menustatevar __char_newarch "ranger"
menustatevar __char_newgender "male"
menustatevar __char_delete_confirm ""

// Derive the engine model id + preview index from the archetype/gender
// picks. Called after every pick and at the top of the creation menu so
// the two are never out of sync.
__char_updatemodel = [
    __char_newmodel = (concatword $__char_newarch "_" $__char_newgender)
    __char_newmodelidx = (+ (if (=s $__char_newarch "ranger") 0 2) (if (=s $__char_newgender "female") 1 0))
]

newgui main [
    guicenter [
        guilist [
            // Logo: user-supplied art (packages/ui/rpg/menu/logo.png)
            guiimage "packages/ui/rpg/menu/logo.png" [] 12 0
            guistrut 1
            guibar
            guistrut 2
            // Centered column: guialign 0 adds springs both sides of each line
            guialign 0 [ guitextscale 1.3 [ guibutton "PLAY"    [rpg_charlist; showgui characters] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "OPTIONS" [showgui Options]                   "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "ABOUT"   [showgui about]                     "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "EXIT"    [quit]                              "0" ] ]
            guistrut 2
            guibar
            guialign 0 [ guitext (concat "v" $VERSION " - Shattered Shield") ]
        ]
    ]
]

newgui about [
    guicenter [
        guilist [
            guititle "About"
            guibar
            guitextscale 1.5 [ guitext "SHATTERED SHIELD" ]
            guitext (concat "Version " $VERSION)
            guistrut 1
            guitext "A persistent-world RPG in the Revelade engine."
            guitext "Built with the Quaternius art direction."
            guistrut 2
            guibutton "Back" [showgui main] "0"
        ]
    ]
]

// Character select: three framed portrait cards side by side (EVE-style).
// Each card sits on the kit parchment panel (window_statistic.png, the same
// frame art as the character/inventory windows). Card box: guiimage scale
// 6.5 -> 13 FONTH tall, 26 FONTW wide; the -13 strut pulls the content
// cursor back up over the art (the overlay technique from rpg.cfg). The
// content column is 22 FONTW, centered on the box with fixed 2-FONTW pads.
// Filled card: live model preview, NAME / LEVEL / CLASS lines, ENTER WORLD
// + Delete on one row. Empty slot: the WHOLE framed card is the button -
// big + and "Add Character" - clicking anywhere on it opens creation.
__charcard_filled = [
    // $arg1 = slot index 0..2
    guilist [
        guiimage "packages/ui/rpg/windows/window_statistic.png" "" 6.5 0
        guistrut -13 0
        guilist [
            guispring 1
            guilist [
                guistrut 22 1 // 22-FONTW column centered on the 26-FONTW box
                guistrut 0.9 0 // top pad inside frame
                guialign 0 [ guiplayerpreview (getalias (concatword "rpg_charmodelidx" $arg1)) 0 0 [showgui characters] 3 0 ]
                guistrut 0.3 0
                guialign 0 [ guitextscale 1.1 [ guitext (getalias (concatword "rpg_charname" $arg1)) "" 0 ] ]
                guialign 0 [ guitext (concatword "Level " (getalias (concatword "rpg_charlevel" $arg1))) "" 0 ]
                guialign 0 [ guitext (getalias (concatword "rpg_chararch" $arg1)) "" 0 ]
                guistrut 0.4 0
                guilist [
                    guispring 1
                    guibutton "ENTER WORLD" (concatword "rpg_enterworld " (getalias (concatword "rpg_charname" $arg1))) "0"
                    guistrut 1 0
                    guibutton "Delete" (concatword "__char_delete_confirm = " (getalias (concatword "rpg_charname" $arg1)) "; showgui chardelete") "0"
                    guispring 1
                ]
                guistrut 0.7 0 // bottom pad
            ]
            guispring 1
        ]
    ]
]
__charcard_empty = [
    guilist [
        guiimage "packages/ui/rpg/windows/window_statistic.png" [showgui charcreate] 6.5 0
        guistrut -13 0
        guilist [
            guispring 1
            guilist [
                guistrut 22 1
                guistrut 3.4 0
                guialign 0 [ guitextscale 2.5 [ guitext "+" "" 0 ] ]
                guistrut 0.4 0
                guialign 0 [ guitextscale 1.1 [ guitext "Add Character" "" 0 ] ]
                guistrut 0.3 0
                guialign 0 [ guitextscale 0.7 [ guitext "Create a new hero" "" 0 ] ]
                guistrut 3.4 0
            ]
            guispring 1
        ]
    ]
]
newgui characters [
    guicenter [
        guilist [
            guititle "Select Character"
            guibar
            guialign 0 [ guitextscale 0.8 [ guitext "Choose a hero, or create a new one." "" 0 ] ]
            guistrut 0.5
            guilist [
                if (> $rpg_charn 0) [__charcard_filled 0] [if (< $rpg_charn 3) [__charcard_empty]]
                guistrut 2 0
                if (> $rpg_charn 1) [__charcard_filled 1] [if (< $rpg_charn 3) [__charcard_empty]]
                guistrut 2 0
                if (> $rpg_charn 2) [__charcard_filled 2] [if (< $rpg_charn 3) [__charcard_empty]]
            ]
            guistrut 1
            guibar
            // Server address (compact, bottom)
            guilist [
                guitext "Server:" "" 0
                guifield __char_server 20
            ]
            guistrut 1
            // Battlegrounds shortcut removed Oct 19 (user): battlegrounds will be
            // queued in game from a Battlegrounds Master NPC (later build).
            // The modes themselves and the battlegrounds gui below are untouched.
            guibutton "Back" [showgui main] "0"
        ]
    ]
]

// Character creation: name entry -> archetype pick (Ranger/Peasant) ->
// confirm. The two archetype cards show the LIVE model preview for the
// currently picked build (Male/Female toggle); the class line on the select
// screen always shows the archetype (no class system exists). The whole
// card is clickable. The menu is wrapped in guistayopen so picking options
// never closes it - only Create / Cancel navigate away.
__chararchcard = [
    // $arg1 = "ranger" or "peasant"
    guilist [
        guiimage "packages/ui/rpg/windows/window_statistic.png" (concatword "__char_newarch = " $arg1 "; __char_updatemodel") 4.5 0
        guistrut -9 0
        guilist [
            guispring 1
            guilist [
                guistrut 14 1 // 14-FONTW column centered on the 18-FONTW box
                guistrut 0.5 0 // top pad inside frame
                guialign 0 [ guiplayerpreview (+ (if (=s $arg1 "ranger") 0 2) (if (=s $__char_newgender "female") 1 0)) 0 0 "" 2.5 0 ]
                guistrut 0.3 0
                guialign 0 [ guitextscale 1.1 [ guitext (if (=s $arg1 "ranger") [result "Ranger"] [result "Peasant"]) "" 0 ] ]
                if (=s $__char_newarch $arg1) [
                    guialign 0 [ guitextscale 0.7 [ guitext "[ SELECTED ]" "" 0 ] ]
                ] [
                    guistrut 0.7 0
                ]
                guistrut 0.5 0 // bottom pad
            ]
            guispring 1
        ]
    ]
]
newgui charcreate [
    guistayopen [
        guicenter [
            guilist [
                __char_updatemodel
                guititle "Create Character"
                guibar
                guitext "Name your hero:"
                guifield __char_newname 24
                guistrut 1
                guitext "Choose an archetype:"
                guistrut 0.3
                guilist [
                    __chararchcard "ranger"
                    guistrut 2 0
                    __chararchcard "peasant"
                ]
                guistrut 0.8
                guilist [
                    guitext "Build:" "" 0
                    guistrut 1 0
                    if (=s $__char_newgender "male") [guititle "Male"] [guibutton "Male" [__char_newgender = "male"; __char_updatemodel] "0"]
                    guistrut 1 0
                    if (=s $__char_newgender "female") [guititle "Female"] [guibutton "Female" [__char_newgender = "female"; __char_updatemodel] "0"]
                ]
                guistrut 0.5
                guialign 0 [ guitext (concatword "Class: " (if (=s $__char_newarch "ranger") [result "Ranger"] [result "Peasant"]) "      Build: " (if (=s $__char_newgender "male") [result "Male"] [result "Female"])) "" 0 ]
                guistrut 0.8
                guilist [
                    guibutton "Create" [
                        rpg_createchar $__char_newname $__char_newmodel
                        if (= $rpg_createok 1) [rpg_charlist; showgui characters] [showgui charcreatefailed]
                    ] "0"
                    guistrut 2 0
                    guibutton "Cancel" [showgui characters] "0"
                ]
            ]
        ]
    ]
]

// Create failed (name taken or slots full)
newgui charcreatefailed [
    guicenter [
        guilist [
            guititle "Cannot Create"
            guibar
            guitext "Name taken or all 3 character slots are full."
            guistrut 1
            guibutton "Back" [showgui charcreate] "0"
        ]
    ]
]

// Delete confirmation
newgui chardelete [
    guicenter [
        guilist [
            guititle "Delete Character?"
            guibar
            guitextscale 1.1 [ guitext (concat "Delete " $__char_delete_confirm "?") ]
            guitext "This cannot be undone."
            guistrut 1
            guilist [
                guibutton "DELETE" [rpg_deletechar $__char_delete_confirm; rpg_charlist; showgui characters] "0"
                guistrut 2
                guibutton "Cancel" [showgui characters] "0"
            ]
        ]
    ]
]

// Battlegrounds: existing modes grouped (presentation only, untouched)
newgui battlegrounds [
    guicenter [
        guilist [
            guititle "Battlegrounds"
            guibar
            guitext "The existing game modes live here -"
            guitext "future PvP battlegrounds."
            guistrut 1
            guibutton "Multiplayer"    [showgui multiplayer] "0"
            guibutton "Single Player"  [showgui gamesetup]   "0"
            guibutton "Server Browser" [showgui servers]     "0"
            guistrut 1
            guibutton "Back" [showgui characters] "0"
        ]
    ]
]
