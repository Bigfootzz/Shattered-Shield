// Shattered Shield RPG main menu (ITEM 5, Oct 19; core pass)
// Front door: logo title over the backdrop. The backdrop itself is drawn
// fullscreen by renderbackground() (backdrop.png while mainmenu==1, the
// loadscreen.png art while loading). Buttons: PLAY / OPTIONS / ABOUT / EXIT.
// Version line at bottom. Stock menu backed up at main.cfg.stock.bak.
//
// LAYOUT NOTE (Revelade engine): gui orientation alternates with nesting
// depth — depth 0 is vertical, each guilist/guicenter/guialign flips it.
// So vertically-stacked centered content is: guicenter [ guilist [ ... ] ].
// (guicenter alone lays its contents out HORIZONTALLY.)
//
// API NOTE: guitext(name, icon, minwidth) — the 2nd arg is an ICON texture
// name, NOT a text scale ("0" hides it). Text size is set with guitextscale.
// guibutton(name, action, icon, minwidth) — same rule. guiimage draws a
// SQUARE icon, not a stretch.

// Show the front door at startup when not connected
sleep 1500 [ if (! (isconnected)) [ showgui main ] ]

// Character select state
menustatevar __char_server "local"
menustatevar __char_newname ""
menustatevar __char_newmodel "ranger_male"
menustatevar __char_newmodelidx 0
menustatevar __char_delete_confirm ""

newgui main [
    guicenter [
        guilist [
            // Logo: user-supplied art (packages/ui/rpg/menu/logo.png)
            guiimage "packages/ui/rpg/menu/logo.png" [] 12 0
            guistrut 1
            guibar
            guistrut 2
            // Centered column: guialign 0 adds springs both sides of each line
            guialign 0 [ guitextscale 1.3 [ guibutton "PLAY"    [rpg_charlist; showgui characters] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "OPTIONS" [showgui Options]                   "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "ABOUT"   [showgui about]                     "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "EXIT"    [quit]                              "0" ] ]
            guistrut 2
            guibar
            guialign 0 [ guitext (concat "v" $VERSION " - Shattered Shield") ]
        ]
    ]
]

newgui about [
    guicenter [
        guilist [
            guititle "About"
            guibar
            guitextscale 1.5 [ guitext "SHATTERED SHIELD" ]
            guitext (concat "Version " $VERSION)
            guistrut 1
            guitext "A persistent-world RPG in the Revelade engine."
            guitext "Built with the Quaternius art direction."
            guistrut 2
            guibutton "Back" [showgui main] "0"
        ]
    ]
]

// Character select: three portrait cards side by side (EVE-style)
newgui characters [
    guicenter [
        guilist [
            guititle "Select Character"
            guibar
            guilist [
                // Slot 0
                guilist [
                    if (> $rpg_charn 0) [
                        guiplayerpreview $rpg_charmodelidx0 0 0 [showgui characters] 3 0
                        guitext $rpg_charname0
                        guitext (concat "Level " $rpg_charlevel0)
                        guitext $rpg_chararch0
                        guistrut 1
                        guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname0] "0"
                        guibutton "Delete" [__char_delete_confirm = $rpg_charname0; showgui chardelete] "0"
                    ] [
                        guibutton "+ Add Character" [showgui charcreate] "0"
                    ]
                ]
                guistrut 3
                // Slot 1
                guilist [
                    if (> $rpg_charn 1) [
                        guiplayerpreview $rpg_charmodelidx1 0 0 [showgui characters] 3 0
                        guitext $rpg_charname1
                        guitext (concat "Level " $rpg_charlevel1)
                        guitext $rpg_chararch1
                        guistrut 1
                        guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname1] "0"
                        guibutton "Delete" [__char_delete_confirm = $rpg_charname1; showgui chardelete] "0"
                    ] [
                        if (< $rpg_charn 3) [guibutton "+ Add Character" [showgui charcreate] "0"]
                    ]
                ]
                guistrut 3
                // Slot 2
                guilist [
                    if (> $rpg_charn 2) [
                        guiplayerpreview $rpg_charmodelidx2 0 0 [showgui characters] 3 0
                        guitext $rpg_charname2
                        guitext (concat "Level " $rpg_charlevel2)
                        guitext $rpg_chararch2
                        guistrut 1
                        guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname2] "0"
                        guibutton "Delete" [__char_delete_confirm = $rpg_charname2; showgui chardelete] "0"
                    ] [
                        if (< $rpg_charn 3) [guibutton "+ Add Character" [showgui charcreate] "0"]
                    ]
                ]
            ]
            guistrut 2
            guibar
            // Server address (compact, bottom)
            guilist [
                guitext "Server:"
                guifield __char_server 20
            ]
            guistrut 1
            // Battlegrounds shortcut removed Oct 19 (user): battlegrounds will be
            // queued in game from a Battlegrounds Master NPC (later build).
            // The modes themselves and the battlegrounds gui below are untouched.
            guibutton "Back" [showgui main] "0"
        ]
    ]
]

// Character creation: name + model pick
newgui charcreate [
    guicenter [
        guilist [
            guititle "Create Character"
            guibar
            guitext "Name:"
            guifield __char_newname 24
            guistrut 1
            guitext "Model:"
            guilist [
                guibutton "Ranger M"  [__char_newmodel = "ranger_male";   __char_newmodelidx = 0] "0"
                guibutton "Ranger F"  [__char_newmodel = "ranger_female"; __char_newmodelidx = 1] "0"
                guibutton "Peasant M" [__char_newmodel = "peasant_male";  __char_newmodelidx = 2] "0"
                guibutton "Peasant F" [__char_newmodel = "peasant_female"; __char_newmodelidx = 3] "0"
            ]
            guitext (concat "Selected: " $__char_newmodel)
            guiplayerpreview $__char_newmodelidx 0 0 [showgui charcreate] 4 0
            guistrut 1
            guilist [
                guibutton "Create" [
                    rpg_createchar $__char_newname $__char_newmodel
                    if (= $rpg_createok 1) [rpg_charlist; showgui characters] [showgui charcreatefailed]
                ] "0"
                guistrut 2
                guibutton "Cancel" [showgui characters] "0"
            ]
        ]
    ]
]

// Create failed (name taken or slots full)
newgui charcreatefailed [
    guicenter [
        guilist [
            guititle "Cannot Create"
            guibar
            guitext "Name taken or all 3 character slots are full."
            guistrut 1
            guibutton "Back" [showgui charcreate] "0"
        ]
    ]
]

// Delete confirmation
newgui chardelete [
    guicenter [
        guilist [
            guititle "Delete Character?"
            guibar
            guitextscale 1.1 [ guitext (concat "Delete " $__char_delete_confirm "?") ]
            guitext "This cannot be undone."
            guistrut 1
            guilist [
                guibutton "DELETE" [rpg_deletechar $__char_delete_confirm; rpg_charlist; showgui characters] "0"
                guistrut 2
                guibutton "Cancel" [showgui characters] "0"
            ]
        ]
    ]
]

// Battlegrounds: existing modes grouped (presentation only, untouched)
newgui battlegrounds [
    guicenter [
        guilist [
            guititle "Battlegrounds"
            guibar
            guitext "The existing game modes live here -"
            guitext "future PvP battlegrounds."
            guistrut 1
            guibutton "Multiplayer"    [showgui multiplayer] "0"
            guibutton "Single Player"  [showgui gamesetup]   "0"
            guibutton "Server Browser" [showgui servers]     "0"
            guistrut 1
            guibutton "Back" [showgui characters] "0"
        ]
    ]
]
