// Shattered Shield RPG main menu (ITEM 5, Oct 19)
// Parchment-framed panel over the rpg_01 vista backdrop.
// Buttons: PLAY / OPTIONS / ABOUT / EXIT. Version line at bottom.
// Stock menu backed up at main.cfg.stock.

// Character select state
menustatevar __char_server "local"
menustatevar __char_newname ""
menustatevar __char_newmodel "ranger_male"
menustatevar __char_delete_confirm ""

newgui main [
    // Backdrop: user-supplied art (packages/ui/rpg/menu/backdrop.png)
    guiimage "packages/ui/rpg/menu/backdrop.png" [] 200 0
    guicenter [
        // Logo: user-supplied art (packages/ui/rpg/menu/logo.png)
        guiimage "packages/ui/rpg/menu/logo.png" [] 16 0
        guistrut 1
        guibar
        guistrut 2
        // Parchment-style buttons
        guibutton "PLAY"        [rpg_charlist; showgui characters]  "" 1.2
        guistrut 1
        guibutton "OPTIONS"     [showgui Options]     "" 1.2
        guistrut 1
        guibutton "ABOUT"       [showgui about]       "" 1.2
        guistrut 1
        guibutton "EXIT"        [quit]                "" 1.2
        guistrut 2
        guibar
        guitext (concat "v" $VERSION " — Shattered Shield") 0.7
    ]
] "Shattered Shield"

newgui about [
    guicenter [
        guititle "About"
        guibar
        guitext "SHATTERED SHIELD" 1.5
        guitext (concat "Version " $VERSION) 0.9
        guistrut 1
        guitext "A persistent-world RPG in the Revelade engine." 0.8
        guitext "Built with the Quaternius art direction." 0.8
        guistrut 2
        guibutton "Back" [showgui main] "" 1.0
    ]
] "About"

// Character select: three slots, live model portraits
newgui characters [
    guiimage "packages/ui/rpg/menu/backdrop.png" [] 200 0
    guicenter [
        guititle "Select Character"
        guibar
        guilist [
            // Slot 0
            guilist [
                if (> $rpg_charn 0) [
                    guiplayerpreview $rpg_charmodel0 0 0 [showgui characters] 3 0
                    guitext $rpg_charname0 1.0
                    guitext (concat "Level " $rpg_charlevel0) 0.8
                    guitext $rpg_chararch0 0.8
                    guistrut 1
                    guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname0] "" 1.0
                    guibutton "Delete" [__char_delete_confirm = $rpg_charname0; showgui chardelete] "" 0.8
                ] [
                    guibutton "+ Add Character" [showgui charcreate] "" 1.2
                ]
            ]
            guistrut 3
            // Slot 1
            guilist [
                if (> $rpg_charn 1) [
                    guiplayerpreview $rpg_charmodel1 0 0 [showgui characters] 3 0
                    guitext $rpg_charname1 1.0
                    guitext (concat "Level " $rpg_charlevel1) 0.8
                    guitext $rpg_chararch1 0.8
                    guistrut 1
                    guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname1] "" 1.0
                    guibutton "Delete" [__char_delete_confirm = $rpg_charname1; showgui chardelete] "" 0.8
                ] [
                    if (< $rpg_charn 3) [guibutton "+ Add Character" [showgui charcreate] "" 1.2]
                ]
            ]
            guistrut 3
            // Slot 2
            guilist [
                if (> $rpg_charn 2) [
                    guiplayerpreview $rpg_charmodel2 0 0 [showgui characters] 3 0
                    guitext $rpg_charname2 1.0
                    guitext (concat "Level " $rpg_charlevel2) 0.8
                    guitext $rpg_chararch2 0.8
                    guistrut 1
                    guibutton "ENTER WORLD" [rpg_enterworld $rpg_charname2] "" 1.0
                    guibutton "Delete" [__char_delete_confirm = $rpg_charname2; showgui chardelete] "" 0.8
                ] [
                    if (< $rpg_charn 3) [guibutton "+ Add Character" [showgui charcreate] "" 1.2]
                ]
            ]
        ]
        guistrut 2
        guibar
        // Server address (compact, bottom)
        guilist [
            guitext "Server:" 0.8
            guifield __char_server 20 [__char_server = $__char_server]
        ]
        guistrut 1
        guilist [
            guibutton "Battlegrounds" [showgui battlegrounds] "" 0.9
            guistrut 2
            guibutton "Back" [showgui main] "" 0.9
        ]
    ]
] "Characters"

// Character creation: name + model pick
newgui charcreate [
    guicenter [
        guititle "Create Character"
        guibar
        guitext "Name:" 0.9
        guifield __char_newname 24 [__char_newname = $__char_newname]
        guistrut 1
        guitext "Model:" 0.9
        guilist [
            guibutton "Ranger M" [__char_newmodel = "ranger_male"] "" 0.8
            guibutton "Ranger F" [__char_newmodel = "ranger_female"] "" 0.8
            guibutton "Peasant M" [__char_newmodel = "peasant_male"] "" 0.8
            guibutton "Peasant F" [__char_newmodel = "peasant_female"] "" 0.8
        ]
        guitext (concat "Selected: " $__char_newmodel) 0.8
        guiplayerpreview $__char_newmodel 0 0 [showgui charcreate] 4 0
        guistrut 1
        guilist [
            guibutton "Create" [
                rpg_createchar $__char_newname $__char_newmodel
                if (= $rpg_createok 1) [rpg_charlist; showgui characters] [guitext "Name taken or slots full!"]
            ] "" 1.0
            guistrut 2
            guibutton "Cancel" [showgui characters] "" 1.0
        ]
    ]
] "Create Character"

// Delete confirmation
newgui chardelete [
    guicenter [
        guititle "Delete Character?"
        guibar
        guitext (concat "Delete " $__char_delete_confirm "?") 1.0
        guitext "This cannot be undone." 0.8
        guistrut 1
        guilist [
            guibutton "DELETE" [rpg_deletechar $__char_delete_confirm; rpg_charlist; showgui characters] "" 1.0
            guistrut 2
            guibutton "Cancel" [showgui characters] "" 1.0
        ]
    ]
] "Delete"

// Battlegrounds: existing modes grouped (presentation only, untouched)
newgui battlegrounds [
    guicenter [
        guititle "Battlegrounds"
        guibar
        guitext "The existing game modes live here —" 0.8
        guitext "future PvP battlegrounds." 0.8
        guistrut 1
        guibutton "Multiplayer" [showgui multiplayer] "" 1.0
        guibutton "Single Player" [showgui gamesetup] "" 1.0
        guibutton "Server Browser" [showgui servers] "" 1.0
        guistrut 1
        guibutton "Back" [showgui characters] "" 0.9
    ]
] "Battlegrounds"
