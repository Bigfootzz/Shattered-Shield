// Shattered Shield — RPG inventory & equipment screens (milestone step 4)
// Skinned with the System G6/Qoma CC0 RPG UI kit (packages/ui/rpg/).
// Auto-loaded by reloadMenus. Additive: the U/K binds only act on RPG maps.

// selected inventory item (detail row)
rpg_sel = ""
rpg_seli = -1

// ---- inventory screen: kit window panel + slot grid + icons + counts ----
newgui rpginv [
    // kit panel backdrop: drawn first, then strut back up exactly its height
    // (drawn height = scale*2*FONTH px; strut moves scale*4*FONTW = same px)
    guiimage "packages/ui/rpg/windows/window_inventory.png" "" 7 0
    guistrut -14 0
    guitext "INVENTORY"
    guibar
    loop r (div (+ (rpginvcount) 3) 4) [
        guilist [
            loop c 4 [
                idx = (+ (* $r 4) $c)
                if (< $idx (rpginvcount)) [
                    guilist [
                        guiimage (rpgcell $idx) (format "rpg_seli = %1; rpg_sel = \"%2\"" $idx (rpginvid $idx)) 0.9 0
                        guitext (concatword "x" (rpginvnum $idx))
                    ]
                ] [
                    guiimage "packages/ui/rpg/slots/slot.png" "" 0.9 0
                ]
            ]
        ]
    ]
    guibar
    if (!=s $rpg_sel "") [
        guilist [
            guitext (rpginvname $rpg_seli)
            guitext (rpginvstat $rpg_seli)
            if (= (rpginvtype $rpg_seli) 2) [
                guibutton "Use" [rpguse $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
            ] [
                guibutton "Equip" [rpgequip $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
            ]
            guibutton "Drop" [rpgdrop $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
        ]
    ] [
        guitext "Click an item, then Equip / Use / Drop."
    ]
    guibar
    guibutton "Close  [U]" "cleargui" "" ""
] "" "INVENTORY"

// ---- character screen: kit statistic panel + equipment slots ----
newgui rpgchar [
    guiimage "packages/ui/rpg/windows/window_statistic.png" "" 8 0
    guistrut -16 0
    guitext "CHARACTER"
    guitext (rpgcharline)
    guitext (rpgeqtotal)
    guibar
    guitext "Equipment"
    looplist s "mainhand head torso legs feet" [
        guilist [
            guitext (concatword $s ":")
            guiimage (rpgeqcell $s) "" 0.9 0
            guilist [
                guitext (rpgeqname $s)
                guitext (rpgeqstat $s)
            ]
            guibutton "Unequip" (format "rpgunequip \"%1\"" $s) "" ""
        ]
    ]
    guibar
    guibutton "Close  [K]" "cleargui" "" ""
] "" "CHARACTER"

// RPG-only keybinds (inert on FPS maps; U/K are unbound in normal play)
bind U [if (isrpgmap) rpginventory]
bind K [if (isrpgmap) rpgcharacter]
