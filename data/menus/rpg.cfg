// Shattered Shield — RPG inventory & equipment screens (milestone step 4)
// Skinned with the System G6/Qoma CC0 RPG UI kit (packages/ui/rpg/).
// WINDOW CONFINEMENT PASS: every element is constrained inside the kit
// panel art. Construction per screen:
//   1. guiimage draws the panel as a square (scale*2*FONTH per side); the
//      non-square kit art is centered inside it. Top-level rows are
//      LEFT-aligned in the centered menu (a spring has nothing to fill at
//      top level), so the content column is centered on the panel box with
//      FIXED side pads: (boxwidth - colwidth)/2 via guistrut pads.
//      Inventory: box 16*FONTH = 32*FONTW, column 24*FONTW, pads 4*FONTW.
//   2. The content column forces its width with a leading vertical-mode
//      guistrut (guistrut N 1 in a vertical list = minimum N*FONTW width),
//      so every row is bounded by the column — PROVIDED no child row is
//      naturally wider than the column (a wider child stretches it and
//      spills again). Keep every row's natural width under the column.
//   3. guistrut -2*scale 0 backs the content up exactly the panel height
//      (guistrut with alt=0 calls space(), which moves vertically).
// Layout/confinement only: items, equip/unequip/use/drop, selection and
// persistence behavior are unchanged. Additive: I/C binds act on RPG maps.
// Auto-loaded by reloadMenus.

// selected inventory cell index (-1 = none). Item ids are resolved via
// (rpginvid $rpg_seli) at point of use, so no quoted strings appear in
// actions. NOTE: this engine ends a CubeScript string at \" — the C-style
// \" escape does NOT work here (only ^" escapes a quote). Never put \"
// inside a cfg string; the old code did and it broke every inventory and
// equipment cell click action.
rpg_seli = -1

// inventory cell click: toggle-select the cell. The quoteless action string
// "rpgcellact N" also feeds the hover tracker (guirolloverimgaction).
rpgcellact = [
    if (= $rpg_seli $arg1) [rpg_seli = -1] [rpg_seli = $arg1]
]

// ---- vendor context (v0.1.23: live) ----
// rpg_atvendor is 1 while the player is at a vendor; the inventory pop-up's
// third action then renders Sell instead of Drop. rpgvendorsell calls the
// real server sell (rpgsell). Currency: copper/silver/gold, 100c = 1s,
// 100s = 1g, stored as total copper. Sell price = item value / 2.
rpg_atvendor = 0
rpgvendorsell = [rpgsell $arg1]
// character screen tab: 0 = Primary, 1 = Offense, 2 = Defense
rpgchartab = 0

// ---- inventory screen: kit window panel, title + X inside the frame ----
// Reference: kit's own inventory mockup — title top-center inside the frame,
// close X top-right inside the frame, 8-column slot grid inside the frame,
// stack counts bottom-left inside each cell, footer helper inside the frame.
// (No gold/currency system exists in the RPG data, so the footer carries the
// helper line instead of a coin count.)
newgui rpginv [
    // STAY-OPEN (Oct 21): the engine closes a menu on ANY widget click by
    // default (shouldclearmenu in src/engine/menus.cpp: every guibutton /
    // guiimage / guiplayerpreview click sets clearlater). That is why
    // clicking a cell closed the window and forced a reopen before Equip.
    // guistayopen suppresses the auto-close for this menu's widgets, so
    // select -> Equip/Use/Drop all happen with the window open. The X
    // button still closes it via its explicit [cleargui], and Esc still
    // pops the GUI stack - neither goes through shouldclearmenu.
    guistayopen [
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, easier to read.
    // Same dimensions/position as before, art swapped to parchment,
    // text dark brown (journal precedent: 43/30/18), restored at end.
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 8 0
    guistrut -16 0
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    // The panel box is 16*FONTH = 32*FONTW wide; the 24-FONTW content column
    // is centered on it with fixed 4-FONTW pads (not springs: at top level a
    // spring has nothing to fill, so the old springs left every row
    // left-aligned and the panel misaligned with wide content). Every child
    // row must stay <= 24 FONTW or the column stretches and spills again.
    guilist [
        guistrut 4 0 // (32-24)/2: left pad, centers column on the panel box
        guilist [
            guistrut 24 1 // alt=1: force 24*FONTW min width in vertical list
            guistrut 0.75 0 // top pad inside frame
            // header: balanced title row, X inside the frame at top-right
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Inventory" "" 0 ]
                guispring 1
                guibutton "Craft" [cleargui; rpgcraft] "0"
                guistrut 0.5 0
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            // Coin total (Ed: inventory is where you sell from, so gold shows here)
            guilist [
                guispring 1
                guitextscale 0.9 [ guitext (concat "Coin: " (rpgmoney)) "" 0 ]
                guispring 1
            ]
            guibar
            // 8-column x 6-row grid (Ed, Oct 27: the frame had room for
            // one more column, 48 cells, up from 42). Each cell is
            // a vertical mini-list: icon, then space(-0.7) backs up so the
            // stack count draws over the cell's bottom-left, inside the cell.
            // Click action is the quoteless rpgcellact toggle; the action
            // string also feeds the hover tracker below.
            // v0.1.8: guinopressed kills the engine's pressed-state dark
            // overlay on the cells (it flashed + shifted a few px on every
            // click - Ed's "flicker"). Selection feedback is the cell_sel_
            // art swap, which stays.
            guinopressed [
            loop r 6 [
                guilist [
                    loop c 8 [
                        idx = (+ (* $r 8) $c)
                        guilist [
                            if (< $idx (rpginvcount)) [
                                if (= $idx $rpg_seli) [
                                    guiimage (strreplace (rpgcell $idx) "cell_" "cell_sel_") (format "rpgcellact %1" $idx) 0.7 0
                                ] [
                                    guiimage (rpgcell $idx) (format "rpgcellact %1" $idx) 0.7 0
                                ]
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext (concatword "x" (rpginvnum $idx)) "" 0 ]
                                ]
                            ] [
                                guiimage "packages/ui/rpg/slots/slot.png" "" 0.7 0
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext "" "" 0 ]
                                ]
                            ]
                        ]
                        // v0.1.31: grid row must fit the 24 FONTW column.
                        // A cell is 0.7 scale = 1.4 FONTH = 2.8 FONTW wide,
                        // so 8 cells + 8 x 0.25 struts = 24.4 FONTW, which
                        // stretched the panel past its 32 FONTW frame and
                        // pushed the window's right edge off center. At
                        // 0.20 the row is exactly 8 x (2.8 + 0.20) = 24.0.
                        guistrut 0.20 0
                    ]
                ]
            ]
            ] // guinopressed
            guibar
            // ---- hover tooltip pop-up (fixed-height detail zone) ----
            // The engine sets the guirolloverimgaction alias to the hovered
            // image's action during the render pass, every frame. The menu
            // body runs before that each frame, so: read last frame's hover,
            // then clear the alias so a stale hover can't linger. 1-frame lag,
            // imperceptible. Cell actions are "rpgcellact N", so the hovered
            // index is the tail of that string.
            rpg_hover = -1
            rpg_ract = (getalias guirolloverimgaction)
            alias guirolloverimgaction ""
            if (>= (strstr $rpg_ract "rpgcellact ") 0) [rpg_hover = (substr $rpg_ract 11)]
            // Tooltip target: the hovered cell (quick stat checks) when
            // nothing is selected; the selected cell otherwise. Once a cell is
            // clicked the pop-up LOCKS to the selection (hover no longer moves
            // it) so the cursor can travel to the action buttons without the
            // pop-up vanishing or retargeting mid-click. Click the selected
            // cell again (or close the window) to release it.
            rpg_tip = $rpg_seli
            if (>= $rpg_hover 0) [
                if (< $rpg_seli 0) [rpg_tip = $rpg_hover]
            ]
            if (>= $rpg_tip 0) [
                // The tooltip sits BELOW the grid (no overlay): the grid's
                // closing guibar above is the single separator line. The full
                // 8x6 grid stays visible. Every row here stays under the
                // 24-FONTW column budget.
                guilist [
                    guiimage (rpgcell $rpg_tip) "" 0.7 0
                    guistrut 0.4 0
                    guilist [
                        guitextscale 0.85 [ guitext (rpginvname $rpg_tip) "" 0 ]
                        guitextscale 0.7 [ guitext (rpginvstat $rpg_tip) "" 0 ]
                    ]
                ]
                // action buttons only on the locked selection, acting on the
                // selected cell; the hover-only pop-up is info-only. Scaled
                // down a touch so the whole strip sits comfortably inside the
                // panel frame with clear space above the bottom edge.
                if (= $rpg_tip $rpg_seli) [
                    guitextscale 0.85 [ guilist [
                        if (= (rpginvtype $rpg_tip) 2) [
                            guibutton "Use" [rpguse (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ] [
                            guibutton "Equip" [rpgequip (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ]
                        guistrut 0.6 0
                        if (= $rpg_atvendor 1) [
                            guibutton "Sell" [rpgvendorsell (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ] [
                            guibutton "Drop" [rpgdrop (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ]
                    ] ]
                ] [
                    // FIXED-HEIGHT detail zone (v0.1.24): hover-only pop-up
                    // is info-only, but its button row's height is reserved
                    // with a blank line at the same 0.85 scale, so hovering
                    // vs selecting does not change the window height.
                    guitextscale 0.85 [ guitext "" "" 0 ]
                ]
            ] [
                // FIXED-HEIGHT detail zone (v0.1.24): nothing hovered or
                // selected — reserve the full tooltip + button zone with
                // blank lines at the exact same scales (0.85 name + 0.7
                // stat + 0.85 button row), so the window height is identical
                // in every state. This replaces the old conditional
                // guistrut 3, which only padded the no-tip state and left
                // hover (shorter) and selected (in between) at different
                // heights, so the centered window reflowed and shifted on
                // every click/hover. The constant height equals the old
                // selected-state height, so the selected view is unchanged.
                guitextscale 0.85 [ guitext "" "" 0 ]
                guitextscale 0.7 [ guitext "" "" 0 ]
                guitextscale 0.85 [ guitext "" "" 0 ]
            ]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 4 0 // (32-24)/2: right pad, centers column on the panel box
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen (see note at the top of this menu)
] "guinoskin" "0"

// ---- character screen: kit statistic panel, reference layout ----
// Reference: kit's own statistic mockup — character name as title inside the
// frame top-center, X top-right inside the frame (v0.1.24: the redundant
// top-left back (<) button was removed — X is the only close control),
// equipment in the side columns (cells; click a filled cell to unequip),
// LVL/XP + tabbed stats on the center parchment, Primary | Offense |
// Defense tabs inside the frame at the bottom (real tab switching).
// Only real RPG data is shown: name, level, XP, weapon damage, armor,
// equipment slots, and the ability table (name/damage/cooldown/mana).
// The reference's strength/vitality/elemental rows are NOT our data and are
// left out until a real stats system exists.
// Paperdoll equipment cell (character sheet): the framed dark slot
// background ALWAYS draws (so every slot reads identically whether empty
// or filled), the slot's ghosted background icon draws on top of it, and
// when an item is equipped its icon draws OVER the ghost (each -2.8 strut
// pulls the cursor back over the 0.7-scale image in the horizontal
// mini-list). Clicking an equipped cell unequips it.
rpgpaperdoll = [
    guilist [
        guiimage "packages/ui/rpg/slots/slot.png" "" 0.7 0
        guistrut -2.8 0
        guiimage (concatword "packages/ui/rpg/slots/slotbg_" $arg1 ".png") "" 0.7 0
        if (!=s (rpgeqname $arg1) "(empty)") [
            guistrut -2.8 0
            guiimage (rpgeqcell $arg1) (concatword "rpgunequip " $arg1) 0.7 0
        ]
    ]
]
newgui rpgchar [
    // v0.1.30: standardized to the Inventory frame (Ed, Oct 27: all
    // windows same dimensions and position as Inventory).
    // Inventory: window_inventory.png scale 8, strut -16, 24 FONTW
    // column, 4 pads, no lift. Body rows are reflowed to fit 24:
    // paperdoll cells 0.8 -> 0.7, body struts 0.9 -> 0.5, stat
    // text scales down a touch, resist/attr column gaps 2.0 -> 1.0,
    // so the flanking equipment plus center stats stay inside 24.
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, same size/position.
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 8 0
    guistrut -16 0
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    // v0.1.31: fixed 4 FONTW pads, like Inventory. The old outer
    // springs have nothing to fill at top level (see the Inventory
    // comment), so the character column sat left of center in the
    // frame instead of centered on it.
    guilist [
        guistrut 4 0
        guilist [
            guistrut 24 1 // alt=1: 24*FONTW min width, same as Inventory
            guistrut 0.75 0 // top pad inside frame, same as Inventory
            // header: name centered | X top-right, all inside the frame
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext (getname) "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            guilist [
                guispring 1
                // WoW-style header line: "Level 12 Warrior   XP: 1234"
                // (same row, same position; class from rpgclass, "" when
                // unknown). Row stays under the 30-FONTW column budget.
                guitext (concatword "Level " (rpglevel) " " (rpgclass) "   XP: " (rpgxp)) "" 0
                guispring 1
            ]
            guibar
            // body: equipment columns flanking the tabbed stats
            guilist [
                guispring 1
                guilist [
                    // portrait placeholder (no portrait art staged yet)
                    guiimage "packages/ui/rpg/slots/slot.png" "" 0.7 0
                    looplist s "mainhand torso legs feet" [
                        rpgpaperdoll $s
                    ]
                ]
                guistrut 0.5 0
                guilist [
                    if (= $rpgchartab 0) [
                    guitextscale 0.75 [
                        // two short columns: every row <= 24 FONTW so the
                        // content column can never stretch past the panel.
                        guilist [
                            guilist [
                                guitext (concatword (rpgattrname 0) ": " (rpgattr 0)) "" 0
                                guitext (concatword (rpgattrname 1) ": " (rpgattr 1)) "" 0
                                guitext (concatword (rpgattrname 2) ": " (rpgattr 2)) "" 0
                            ]
                            guistrut 1.0 0
                            guilist [
                                guitext (concatword (rpgattrname 3) ": " (rpgattr 3)) "" 0
                                guitext (concatword (rpgattrname 4) ": " (rpgattr 4)) "" 0
                                guitext (concatword (rpgattrname 5) ": " (rpgattr 5)) "" 0
                            ]
                        ]
                        guitext (concatword "Max HP: " (rpgmaxhp)) "" 0
                        guitext (concatword "Max mana: " (rpgmaxmana)) "" 0
                    ] ] [ if (= $rpgchartab 1) [
                    guitextscale 0.7 [
                        looplist a "0 1 2 3 4" [
                            guitext (concatword (rpgabname $a) " (" (rpgabtype $a) "): " (rpgabstatdmg $a) " dmg") "" 0
                            guitext (concatword "  " (rpgabcdstr $a) " cd   " (rpgabmana $a) " mana") "" 0
                        ]
                        guitext (concatword "Crit: " (rpgcritchance) "  " (rpgcritmult)) "" 0
                        guitext (concatword "Weapon: +" (rpgweapondmg) "  Mana: " (rpgmana) " / " (rpgmaxmana)) "" 0
                    ] ] [
                    guitextscale 0.75 [
                        guitext (concatword "Armor: " (rpgarmortotal) "  reduces " (rpgarmorred)) "" 0
                        looplist s "head neck torso legs feet ring1 ring2" [
                            guitext (concatword $s ": +" (rpgeqarmor $s)) "" 0
                        ]
                        guitext "Resists (not active yet):" "" 0
                        guilist [
                            guilist [
                                guitext (concatword (rpgresistname 0) ": " (rpgresist 0)) "" 0
                                guitext (concatword (rpgresistname 1) ": " (rpgresist 1)) "" 0
                                guitext (concatword (rpgresistname 2) ": " (rpgresist 2)) "" 0
                            ]
                            guistrut 1.0 0
                            guilist [
                                guitext (concatword (rpgresistname 3) ": " (rpgresist 3)) "" 0
                                guitext (concatword (rpgresistname 4) ": " (rpgresist 4)) "" 0
                                guitext (concatword (rpgresistname 5) ": " (rpgresist 5)) "" 0
                            ]
                        ]
                    ] ] ]
                ]
                guistrut 0.5 0
                guilist [
                    // Right column: head + jewelry (neck, two rings).
                    // Jewelry is stats-only (no 3D model shown), but the
                    // slots sit here so the sheet shows the full set.
                    // 4 cells here vs portrait + 4 on the left, so the
                    // body row height is unchanged.
                    rpgpaperdoll "head"
                    rpgpaperdoll "neck"
                    rpgpaperdoll "ring1"
                    rpgpaperdoll "ring2"
                ]
                guispring 1
            ]
            guibar
            // tabs: real switching, active tab highlighted as title text
            guilist [
                guispring 1
                if (= $rpgchartab 0) [ guititle "Primary" 0 ] [ guibutton "Primary" "rpgchartab = 0" "" "" ]
                guistrut 1.5 0
                if (= $rpgchartab 1) [ guititle "Offense" 0 ] [ guibutton "Offense" "rpgchartab = 1" "" "" ]
                guistrut 1.5 0
                if (= $rpgchartab 2) [ guititle "Defense" 0 ] [ guibutton "Defense" "rpgchartab = 2" "" "" ]
                guispring 1
            ]
            // ---- hover tooltip (WoW-style, additive) ----
            // Paperdoll cell actions are "rpgunequip <slot>", so the hovered
            // slot is the tail of that string. Same 1-frame-lag pattern as
            // the inventory tooltip: the engine sets guirolloverimgaction
            // during the render pass, so read last frame's value, then clear
            // it so a stale hover can't linger. Hover-only, info-only:
            // clicking a cell still unequips immediately (unchanged).
            // Empty slots carry no action, so they never tooltip; tab/X
            // buttons carry other actions and are rejected by the prefix
            // check. Value is appended to the detail line only when > 0.
            // The tooltip replaces the hint line (same footer area), so the panel
            // height budget is unchanged: tooltip row ~1.55 FONTH + 0.5
            // pad vs hint 0.75 + 1.4 pad.
            rpg_charhover = ""
            rpg_cact = (getalias guirolloverimgaction)
            alias guirolloverimgaction ""
            if (>= (strstr $rpg_cact "rpgunequip ") 0) [rpg_charhover = (substr $rpg_cact 11)]
            if (!=s $rpg_charhover "") [
                rpg_hslot = $rpg_charhover
                if (=s $rpg_charhover "mainhand") [rpg_hslot = "Main Hand"]
                if (=s $rpg_charhover "head") [rpg_hslot = "Head"]
                if (=s $rpg_charhover "neck") [rpg_hslot = "Neck"]
                if (=s $rpg_charhover "torso") [rpg_hslot = "Chest"]
                if (=s $rpg_charhover "legs") [rpg_hslot = "Legs"]
                if (=s $rpg_charhover "feet") [rpg_hslot = "Feet"]
                if (=s $rpg_charhover "ring1") [rpg_hslot = "Ring 1"]
                if (=s $rpg_charhover "ring2") [rpg_hslot = "Ring 2"]
                rpg_hdetail = (concatword $rpg_hslot " | " (rpgeqstat $rpg_charhover))
                if (> (rpgeqvalue $rpg_charhover) 0) [rpg_hdetail = (concatword $rpg_hdetail " | Value " (rpgeqvalue $rpg_charhover))]
                guilist [
                    guiimage (rpgeqcell $rpg_charhover) "" 0.7 0
                    guistrut 0.4 0
                    guilist [
                        guitextscale 0.85 [ guitext (rpgeqname $rpg_charhover) "" 0 ]
                        guitextscale 0.7 [ guitext $rpg_hdetail "" 0 ]
                    ]
                ]
                guistrut 0.5 0 // bottom pad (tooltip shown)
            ] [
                guilist [
                    guispring 1
                    guitextscale 0.75 [ guitext "Click an equipped item to unequip it." "" 0 ]
                    guispring 1
                ]
                guistrut 1.4 0 // bottom pad
            ]
        ]
        guistrut 4 0 // right pad, matches Inventory
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin" "0"

// RPG keybinds: I opens inventory, C opens the character screen (replacing U/K).
// RPG-gated: on RPG maps they open the RPG windows; anywhere else they keep
// their stock actions (I = taunt, C = radio team menu), so FPS maps are untouched.
bind I [if (isrpgmap) [rpginventory] [taunt]]
bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
// Chat prompt posts to the ACTIVE chat tab's channel: Clan tab -> teamsay,
// World and System tabs -> say (System is read-only). The "b" inputcommand flag
// marks this as a chat-box input: it renders in the panel's framed field on ALL
// maps (world + battlegrounds, user ruling Oct 19), never at the stock
// bottom-left. Chat keys (T, /, Y) open the in-panel field on all maps.
rpgchat = [inputcommand $arg1 (if (= $rpg_chattab 1) [sayteam (getcommandbuf)] [say (getcommandbuf)]) "[Chat]" "b"]
bind T [rpgchat ""]
bind SLASH [rpgchat "/"]
bind Y [rpgchat ""]
// Talk to the selected NPC (quest chain v1): F on RPG maps sends N_RPG_TALK
// for the selected NPC; the server runs the dialogue state machine. Stock F
// has no gameplay bind, so the fallthrough is empty and FPS maps are untouched.
// Right-click stays auto-attack — it never talks.
bind F [if (isrpgmap) [rpgtalk] []]
// Quest log (quest engine v2, Oct 21): J on RPG maps opens the derived
// quest-log view. Stock J has no gameplay bind, so the fallthrough is empty.
bind J [if (isrpgmap) [rpgjournal] []]
// Action slots, keys 1-0 (kit-strip HUD): on RPG maps 1 casts Power Strike,
// 2 casts Spark Bolt, 3 casts Arcane Bolt and 4 casts Ice Bolt (the bolt
// spells are wizard/sorceress-only, server-gated; slots 5-0 are empty today,
// so they do nothing); on any other map the stock weapon-selection binds
// run unchanged.
bind 1 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 0] [ability1]] [setweapon 1]]
bind 2 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 1] [ability2]] [setweapon 2]]
bind 3 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 2] [ability3]] [setweapon 3]]
bind 4 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 3] [ability4]] [setweapon 4]]
bind 5 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 4] [ability5]] [setweapon 5]]
bind 6 [if (isrpgmap) [] [setweapon 6]]
bind 7 [if (isrpgmap) [] [setweapon 7]]
bind 8 [if (isrpgmap) [] [setweapon 8]]
bind 9 [if (isrpgmap) [] [setweapon 9]]
bind 0 [if (isrpgmap) [] [setweapon 10]]
// Mouse, RPG-gated: on RPG maps the mouse is a free cursor - left click
// selects (rpgclick 0), right click selects + auto-attacks (rpgclick 1).
// On any other map the stock FPS attack binds run unchanged. While a menu
// is open the GUI consumes clicks before binds ever fire, so the windows
// keep working exactly as before.
bind MOUSE1 [if (isrpgmap) [rpgclick 0] [attack 0]]
bind MOUSE2 [if (isrpgmap) [rpgclick 1] [attack 1]]
// Tab, RPG-gated (Issue #11, Oct 21): on RPG maps Tab cycles nearby
// targets nearest-first (wrapping) instead of the stock scoreboard;
// anywhere else the scoreboard is unchanged. The chat box tabs are
// mouse-driven, so Tab has no chat function to conflict with.
bind TAB [if (isrpgmap) [rpgtabcycle] [showscores]]
// defaults.cfg loads AFTER this file and rebinds keys to the stock actions,
// so re-assert our binds on every map start. Chat keys (T/SLASH/Y) are asserted
// on ALL maps (uniform chat surface, user ruling Oct 19); the RPG-action binds
// stay RPG-gated (battleground maps keep their stock I/C/1-0/MOUSE/F binds).

// Quest engine v2: dialogue panel (Oct 21). The server sends node text +
// response buttons (N_RPG_DIALOG); the buttons send back the button index.
// Keys 1-4 mirror the buttons while the panel is open (see binds above).
// v0.1.8: framed dialogue window (Ed: "text just goes in a long line, feels
// awkward"). Same kit window treatment as rpgjournal: window_inventory.png
// backdrop, NPC name as title, wrapped dialogue text, response buttons.
// The dialogue text is pre-wrapped at ~50 chars by rpg_dlg_wrap (client.cpp).
newgui rpgdialog [
    // v0.1.30: standardized to the Inventory frame (Ed, Oct 27: all
    // windows same dimensions and position as Inventory, which is
    // perfect). Inventory: window_inventory.png scale 8, strut -16,
    // 24 FONTW column, 4 pads, no lift. Dialogue text is dark-on-light
    // no longer: inventory art is dark, so text uses the default
    // light colors (no guitextcolor override in this block).
    // Wrap is 40 chars in client.cpp, so 40*0.6 = 24 FONTW fits the
    // column exactly at the same 0.6 text scale as before.
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, same size/position.
    // Parchment is light, so text runs dark brown again (journal precedent).
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 8 0
    guistrut -16 0
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    guilist [
        guistrut 4 0 // left pad, same as Inventory
        guilist [
            guistrut 24 1 // 24*FONTW min width, same as Inventory
            guistrut 0.75 0 // top pad
            // header: NPC name centered, X top-right
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext (rpg_dlg_npc) "" 0 ]
                guispring 1
                guibutton "X" [rpg_closerdlg] "0"
                guistrut 1.0 0
            ]
            guibar
            // dialogue text (pre-wrapped): 0.6 scale like the quest log so the
            // 50-char wrap stays inside the 36-FONTW column
            guitextscale 0.6 [
                loop i (rpg_dlg_lines) [
                    guitext (rpg_dlg_line $i) "" 0
                ]
            ]
            guibar
            // response buttons
            loop i (rpg_dlg_n) [
                guibutton (concatword (+ $i 1) ". " (rpg_dlg_resp $i)) [rpgrespond $i] "0"
            ]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 4 0 // right pad, same as Inventory
    ]
    // v0.1.30, Ed Oct 27 09:57: dialogue dripped down again in parchment
    // proof (top 314, bottom off screen, vs Inventory 155-889).
    // Restore a lift, dialogue only: 0.15 puts it at Inventory height
    // (top ~160, bottom ~870, clear of the HUD strip). The old 0.30
    // lift from HEAD put it upper-middle; 0.15 matches the other
    // windows, which Ed says look fine. If a longer dialogue still
    // drips, bump this, do not remove it again.
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guilift 0.15" "0"

// Quest engine v2: J-key quest log (Oct 21). A derived view over the client
// quest caches (no new table); rpgjournal rebuilds the lines on open.
// FRAMED (Oct 21): the same kit window treatment as the character and
// inventory windows - window_inventory.png as the panel, the -22 strut
// pulling the content cursor back up over the art, title + X inside the
// frame, content column centered on the panel box. Content and behavior
// are unchanged: the engine wraps lines at ~58 chars, so the log text runs
// at 0.6 scale to stay inside the 36-FONTW column; short logs are
// bottom-padded so the content fills the 22-FONTH panel.
newgui rpgjournal [
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 11 0
    guistrut -22 0
    // v0.1.10 fix 3: parchment is light, so journal text runs dark brown
    // (mirrors rpgdialog; defaults restored at the end of this block)
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    guilist [
        guistrut 4 0 // left pad: centers the 36-FONTW column on the 44-FONTW box
        guilist [
            guistrut 36 1 // alt=1: 36*FONTW min width; rows stay <= 36
            guistrut 0.75 0 // top pad inside frame
            // header: title centered, X top-right inside the frame
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Quest Log" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            guibar
            guitextscale 0.6 [
                loop i (rpg_journal_lines) [
                    guitext (rpg_journal_line $i) "" 0
                ]
            ]
            // pad short logs so the content reaches the 22-FONTH panel
            // (header ~2.75 FONTH + 0.6 per line + 0.5 bottom pad)
            rpg_jrpad = (- 19.2 (* (rpg_journal_lines) 0.6))
            if (> $rpg_jrpad 0) [guistrut $rpg_jrpad 0]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 4 0 // right pad
    ]
    // restore the default light-on-dark text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin" "0"

map_changed = [
    bind T [rpgchat ""]
    bind SLASH [rpgchat "/"]
    bind Y [rpgchat ""]
    if (isrpgmap) [
        bind I [if (isrpgmap) [rpginventory] [taunt]]
        bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
        bind 1 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 0] [ability1]] [setweapon 1]]
        bind 2 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 1] [ability2]] [setweapon 2]]
        bind 3 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 2] [ability3]] [setweapon 3]]
        bind 4 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 3] [ability4]] [setweapon 4]]
        bind J [if (isrpgmap) [rpgjournal] []]
        bind 5 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 4] [ability5]] [setweapon 5]]
        bind 6 [if (isrpgmap) [] [setweapon 6]]
        bind 7 [if (isrpgmap) [] [setweapon 7]]
        bind 8 [if (isrpgmap) [] [setweapon 8]]
        bind 9 [if (isrpgmap) [] [setweapon 9]]
        bind 0 [if (isrpgmap) [] [setweapon 10]]
        bind MOUSE1 [if (isrpgmap) [rpgclick 0] [attack 0]]
        bind MOUSE2 [if (isrpgmap) [rpgclick 1] [attack 1]]
        bind TAB [if (isrpgmap) [rpgtabcycle] [showscores]]
        bind F [if (isrpgmap) [rpgtalk] []]
// Quest log (quest engine v2, Oct 21): J on RPG maps opens the derived
// quest-log view. Stock J has no gameplay bind, so the fallthrough is empty.
bind J [if (isrpgmap) [rpgjournal] []]
        rpgcleartarget
    ]
]

// In-game pause menu (playtest fix, Oct 19): Esc with no RPG window open shows
// exactly these four options on ALL maps (world + battlegrounds). Styled with
// the main-menu family (logo, centered text column). If an RPG window is open,
// Esc closes it first (togglemainmenu pops one GUI before showing this).
newgui sspause [
    guicenter [
        guilist [
            guiimage "packages/ui/rpg/menu/logo.png" [] 6 0
            guistrut 1
            guibar
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Return to Game" [cleargui] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Switch Character" [disconnect; rpg_charlist; showgui characters] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Settings" [showgui Options] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Exit" [quit] "0" ] ]
            guistrut 1
            guibar
        ]
    ]
]

// ---- vendor GUI (v0.1.23): Glimmer's shop ----
// Opens when talking to Glimmer (N_RPG_VENDOR). Sets rpg_atvendor = 1 so
// the inventory pop-up shows Sell instead of Drop. Closing resets it.
// Buy list is Glimmer's fixed stock (prices = item value in copper).
// Sell: open inventory (I) while here and use the Sell button on any gear.
newgui rpgvendor [
    // v0.1.30: NOT guistayopen. Vendor is now a normal modal GUI, like
    // Inventory, Dialogue and Character, so it renders in the same
    // framed, centered path as the other windows (Ed's Oct 27
    // standardization). The actual talk failure was server-side:
    // sendf "r" sent an empty packet, so the client never received
    // N_RPG_VENDOR at all; stayopen removal alone did not fix talk
    // (headless test v30c, still no GUI), the "ri" send fix did.
    // v0.1.30: frame scale 10, strut -20, NOT 8/-16. The shop has
    // 15 buy buttons plus header and footer, which need ~20 FONTH
    // tall, while Inventory needs 16; at 8/-16 the last three items
    // and the footer spilled below the frame (headless proof Oct 27).
    // Width, column (24) and centering still match Inventory; only
    // height is taller, because the shop content is taller. Flagged
    // to Ed, not hidden: if he wants exact Inventory height, the
    // buy list would need tabs or smaller text instead.
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, same size/position.
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 10 0
    guistrut -20 0
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    // v0.1.31: center the content in the wider frame. Scale 10 is a
    // 20 FONTH = 40 FONTW panel, but the old pads were 4 on the left
    // only, so the 24 column sat left of center with 12 FONTW of
    // empty parchment on the right (Ed's "off screen / should be
    // centered" vendor shot). 8 + 24 + 8 = 40, centered exactly.
    guilist [
        guistrut 8 0
        guilist [
            guistrut 24 1
            guistrut 0.75 0
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Glimmer's Wares" "" 0 ]
                guispring 1
                guibutton "X" [rpg_atvendor = 0; cleargui] "0"
                guistrut 1.0 0
            ]
            // Glimmer greeting (MMO research: vendor barks are flavour, shop opens regardless)
            guilist [
                guispring 1
                guitextscale 0.85 [ guitext "Shiny things for shiny coins!" "" 0 ]
                guispring 1
            ]
            guibar
            // Player gold (copper/silver/gold format from rpgmoney)
            guilist [
                guitextscale 1.0 [ guitext (concat "Your coin: " (rpgmoney)) "" 0 ]
            ]
            guibar
            guitextscale 0.9 [ guitext "Buy from Glimmer (click to buy):" "" 0 ]
            // v0.1.30: buy list is VERTICAL, one button per row, at 0.7
            // scale. The old horizontal rows summed to ~68 FONTW (four
            // buttons side by side), which stretched the 24 column
            // past the Inventory frame and rendered the shop as a
            // full-width strip instead of a framed window (headless
            // proof Oct 27). Vertical at 0.7: longest button 22 chars
            // = 15.4 FONTW, and 15 buttons at ~0.7 FONTH each fit
            // the 16 FONTH frame height with header and footer.
            // Footer buttons are also stacked, and the Sell line is
            // shortened, for the same reason.
            // v0.1.31: 0.7 -> 0.65, with the footer in one row, so the
            // whole shop (15 buys + footer) fits the scale-10 frame
            // with Close Shop inside it, not just below the edge.
            guitextscale 0.65 [
                guibutton "Puglin Stick - 10c" [rpgbuy puglin_stick] "" ""
                guibutton "Wooden Bow - 25c" [rpgbuy wooden_bow] "" ""
                guibutton "Imp Mace - 60c" [rpgbuy imp_mace] "" ""
                guibutton "Warrior Sword - 60c" [rpgbuy warrior_sword] "" ""
                guibutton "Leather Helm - 15c" [rpgbuy leather_helm] "" ""
                guibutton "Iron Helm - 25c" [rpgbuy iron_helm] "" ""
                guibutton "Ranger Tunic - 30c" [rpgbuy ranger_tunic] "" ""
                guibutton "Chain Tunic - 45c" [rpgbuy chain_tunic] "" ""
                guibutton "Leather Leggings - 15c" [rpgbuy leather_leggings] "" ""
                guibutton "Iron Leggings - 25c" [rpgbuy iron_leggings] "" ""
                guibutton "Leather Boots - 12c" [rpgbuy leather_boots] "" ""
                guibutton "Iron Boots - 20c" [rpgbuy iron_boots] "" ""
                guibutton "Copper Necklace - 15c" [rpgbuy copper_necklace] "" ""
                guibutton "Copper Ring - 12c" [rpgbuy copper_ring] "" ""
                guibutton "Silver Ring - 18c" [rpgbuy silver_ring] "" ""
            ]
            guibar
            guitextscale 0.7 [ guitext "Sell via inventory (half value)." "" 0 ]
            // v0.1.31: footer fits the frame. The old stacked footer
            // (two buttons at 0.7) plus 15 buy buttons at 0.7 pushed
            // Close Shop just below the frame edge in game. Buy
            // buttons drop to 0.65 and the footer buttons sit side by
            // side in one row, saving enough height to keep Close
            // Shop inside the frame at the same scale 10.
            guitextscale 0.7 [
                guilist [
                    guibutton "Open Inventory to Sell" [rpginventory] "" ""
                    guistrut 1.0 0
                    guibutton "Close Shop" [rpg_atvendor = 0; cleargui] "" ""
                ]
            ]
            guistrut 0.5 0
        ]
        guistrut 8 0 // right pad, centers the 24 column in the 40 frame
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin" "0"
// v0.1.30, Ed feedback Oct 27 on v30e shot: vendor was the ONLY window
// without "guinoskin" "0", so the engine drew its default skin (the big
// dark background covering most of the screen, hard to read against)
// and a showtab label "RPGVENDOR" above the frame. Inventory,
// Character and Dialogue all end "guinoskin" "0": no skin, no tab.
// Vendor now matches them exactly, so no background and no label.
// ---- crafting window (Phase 1, Oct 27, uncommitted) ----
// Parchment window in the Inventory family (same art, dark brown text,
// 24-FONTW content column, fixed pads). Taller than Inventory (scale 9,
// 18 FONTH) because the materials list needs the room; vendor already
// sets the precedent for a taller frame (scale 10). Two tabs: Craft
// (two slots + materials list + Craft button) and Recipes (the player's
// discovered recipes, server-sent, verbatim). Results arrive via the
// System tab (rpg_qmsg), like sell messages, so no result row is needed
// here. Add-button actions are format-baked ("rpgcraftadd N") because a
// loop variable read at click time would hold the loop-end value.
rpg_crafttab = 0
newgui rpgcraft [
    guistayopen [
    guiimage "packages/ui/rpg/windows/window_parchment.png" "" 9 0
    guistrut -18 0
    guitextcolorr 43
    guitextcolorg 30
    guitextcolorb 18
    guilist [
        guistrut 4 0
        guilist [
            guistrut 24 1
            guistrut 0.75 0
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Crafting" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            guilist [
                guispring 1
                if (= $rpg_crafttab 0) [ guititle "Craft" 0 ] [ guibutton "Craft" "rpg_crafttab = 0" "0" ]
                guistrut 1.5 0
                if (= $rpg_crafttab 1) [ guititle "Recipes" 0 ] [ guibutton "Recipes" "rpg_crafttab = 1" "0" ]
                guispring 1
            ]
            guibar
            if (= $rpg_crafttab 0) [
                guitextscale 0.85 [ guitext "Pick two materials, then Craft." "" 0 ]
                guilist [
                    guilist [
                        guiimage (rpgcraftsloticon 0) "rpgcraftclear 0" 0.7 0
                        guitextscale 0.7 [ guitext (rpgcraftslotname 0) "" 0 ]
                    ]
                    guistrut 1.0 0
                    guilist [
                        guiimage (rpgcraftsloticon 1) "rpgcraftclear 1" 0.7 0
                        guitextscale 0.7 [ guitext (rpgcraftslotname 1) "" 0 ]
                    ]
                ]
                guitextscale 0.7 [ guitext "Click a slot to clear it." "" 0 ]
                guitextscale 0.7 [ guitext "Results appear in the System tab." "" 0 ]
                guibar
                guitextscale 0.85 [ guitext "Materials:" "" 0 ]
                loop i (rpginvcount) [
                    if (= (rpginvtype $i) 3) [
                        guilist [
                            guitextscale 0.7 [ guitext (concatword (rpginvname $i) " x" (rpginvnum $i)) "" 0 ]
                            guispring 1
                            guibutton "Add" (format "rpgcraftadd %1" $i) "0"
                        ]
                    ]
                ]
                guibar
                guilist [
                    guispring 1
                    guibutton "Craft" [rpgcraftsend] "0"
                    guispring 1
                ]
                guitextscale 0.7 [ guitext "Failed combinations cost nothing." "" 0 ]
            ] [
                guitextscale 0.85 [ guitext "Discovered recipes:" "" 0 ]
                if (= (rpg_recipe_lines) 0) [
                    guitextscale 0.7 [ guitext "No recipes discovered yet." "" 0 ]
                ] [
                    guitextscale 0.7 [
                        loop i (rpg_recipe_lines) [
                            guitext (rpg_recipe_line $i) "" 0
                        ]
                    ]
                ]
                // Pad the short Recipes tab so the window sits high enough
                // for the fixed parchment backdrop to fit on screen.
                // (guistrut N 0 = N FONTH of vertical space here.)
                guistrut 10 0
            ]
            guistrut 0.5 0
        ]
        guistrut 4 0
    ]
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen
] "guinoskin" "0"

// Vendor open sets the at-vendor flag (inventory Sell button appears).
// The N_RPG_VENDOR handler calls rpgvendor, which shows this GUI; the
// flag is set here so it is active as soon as the window renders.
rpgvendoropen = [rpg_atvendor = 1; showgui rpgvendor]

// --- RPG: editor Phase 1 (Oct 24, 2026) - NPC placement tool ---
// F7 in EDIT MODE ONLY opens the NPC editor. Outside edit mode, F7 still
// takes a screenshot (data/screenshot.cfg bind is untouched; editbinds only
// apply while editing).
// v0.1.27 (item 5): F7 needs editing actually toggled ON (E key), not just
// the COOP EDIT game mode - if F7 flashes (screenshot), editing is not
// toggled on. Fallback that always works: open the console and type
// shownpceditor. If the GUI name is ever unregistered, showgui now logs
// "unknown menu" to the console instead of failing silently.
editbind F7 [showgui npceditor]

// Editor state (CubeScript aliases; the GUI reads them live).
npc_sel = -1
npc_new_id = "new_npc"
npc_new_name = "New NPC"
npc_new_model = "npcs/male_peasant_static"

newgui npceditor [
    guitext "NPC Editor - Phase 1" "" 0
    guitext (concatword "Map: " (npc_loaded_map) " - " (npc_count) " NPCs (" (if (= (npc_from_file) 1) ["from file"] ["fallback"]) ")") "" 0
    guibar
    // NPC list: click a row to select it for move/delete.
    loop i (npc_count) [
        guilist [
            guibutton (concatword (npc_name $i) " [" (npc_id $i) "] " (npc_model $i)) [npc_sel = $i] ""
            guitext (concatword (npc_x $i) " " (npc_y $i) " " (npc_z $i) " yaw " (npc_yaw $i) " " (npc_type $i)) "" 0
        ]
    ]
    guibar
    guitext (concatword "Selected: " (npc_name $npc_sel) " [" (npc_id $npc_sel) "]") "" 0
    guilist [
        guibutton "Move to me" [npc_move_here $npc_sel] ""
        guibutton "Move to view target" [npc_move_view $npc_sel] ""
        guibutton "Delete" [npc_remove $npc_sel; npc_sel = -1] ""
    ]
    guibar
    guitext "Add new NPC (default model is the male peasant; type/dialogue in Phase 2):" "" 0
    guilist [
        guitext "ID:" "" 0
        guifield npc_new_id 20
        guitext "Name:" "" 0
        guifield npc_new_name 20
    ]
    guilist [
        guitext "Model:" "" 0
        guifield npc_new_model 30
    ]
    guilist [
        guibutton "Add here" [npc_add_here $npc_new_id $npc_new_name $npc_new_model] ""
        guibutton "Add at view target" [npc_add_view $npc_new_id $npc_new_name $npc_new_model] ""
    ]
    guibar
    guilist [
        guibutton "Save NPCs" [npc_save] ""
        guibutton "Close" [cleargui] ""
    ]
    guitext "Save writes data/rpg/npcs_<map>.cfg. Reload the map for the server to pick it up." "" 0
]
