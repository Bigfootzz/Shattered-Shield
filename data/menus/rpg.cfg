// Shattered Shield — RPG inventory & equipment screens (milestone step 4)
// Skinned with the System G6/Qoma CC0 RPG UI kit (packages/ui/rpg/).
// UI POLISH PASS (step 4.3): flat inventory grid (icon + count side by
// side; selected cell uses a pre-composited highlight-border image),
// two-line detail zone and two-line equipment rows so all content stays
// inside the kit panels instead of springing past them.
// Auto-loaded by reloadMenus. Additive: the U/K binds only act on RPG maps.

// selected inventory item (detail row)
rpg_sel = ""
rpg_seli = -1

// ---- inventory screen: kit window panel + slot grid + icons + counts ----
newgui rpginv [
    // kit panel backdrop: drawn first, then space back up exactly its height
    // (drawn height = scale*2*FONTH px; guistrut -N 0 = space(-N) = -N*FONTH)
    guiimage "packages/ui/rpg/windows/window_inventory.png" "" 8 0
    guistrut -16 0
    guialign 0 [ guitextscale 1.4 [ guitext "INVENTORY" ] ]
    guibar
    // 4-column grid, one flat horizontal row per grid row: each cell is
    // icon + count side by side (no nested vertical cell, so the count
    // no longer drops onto its own line). In a horizontal row,
    // guistrut N 0 = space(N) moves horizontally, so the selection
    // highlight backs up one icon width (1.8*FONTH = 3.6*FONTW) to sit
    // exactly under the icon.
    loop r (div (+ (rpginvcount) 3) 4) [
        guilist [
            loop c 4 [
                idx = (+ (* $r 4) $c)
                if (< $idx (rpginvcount)) [
                    // selected slot: pre-composited cell image with the cyan
                    // highlight border baked in (no overlay positioning needed).
                    if (= $idx $rpg_seli) [
                        guiimage (strreplace (rpgcell $idx) "cell_" "cell_sel_") (format "rpg_seli = %1; rpg_sel = \"%2\"" $idx (rpginvid $idx)) 0.9 0
                    ] [
                        guiimage (rpgcell $idx) (format "rpg_seli = %1; rpg_sel = \"%2\"" $idx (rpginvid $idx)) 0.9 0
                    ]
                    guitext (concatword "x" (rpginvnum $idx))
                    guitext "  "
                ] [
                    guiimage "packages/ui/rpg/slots/slot.png" "" 0.9 0
                    guitext "  "
                ]
            ]
        ]
    ]
    guibar
    // detail zone: two short lines (icon + name/stat, then the buttons)
    // so it fits the panel width instead of springing past the frame.
    if (!=s $rpg_sel "") [
        guilist [
            guiimage (rpgcell $rpg_seli) "" 0.9 0
            guitext (concatword " " (rpginvname $rpg_seli) "  " (rpginvstat $rpg_seli))
        ]
        guilist [
            if (= (rpginvtype $rpg_seli) 2) [
                guibutton "Use" [rpguse $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
            ] [
                guibutton "Equip" [rpgequip $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
            ]
            guibutton "Drop" [rpgdrop $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
        ]
    ] [
        guitext "Click an item, then Equip / Use / Drop."
    ]
    guibar
    guialign 0 [ guibutton "Close  [U]" "cleargui" "" "" ]
] "" "INVENTORY"

// ---- character screen: kit statistic panel, clean two-zone layout ----
// Zone 1: stats (two fixed single-line rows). Zone 2: one two-line row per
// equipment slot ("slot: name" on line 1, stat + Unequip on line 2), so the
// rows fit the panel width instead of springing past the frame.
newgui rpgchar [
    guiimage "packages/ui/rpg/windows/window_statistic.png" "" 9 0
    guistrut -18 0
    guialign 0 [ guitextscale 1.4 [ guitext "CHARACTER" ] ]
    guibar
    guitext (rpgcharline)
    guitext (rpgeqtotal)
    guibar
    guialign 0 [ guitext "Equipment" ]
    looplist s "mainhand head torso legs feet" [
        guilist [
            guiimage (rpgeqcell $s) "" 0.9 0
            guilist [
                guitext (concatword " " $s ": " (rpgeqname $s))
                guilist [
                    guitext (concatword " " (rpgeqstat $s))
                    guispring 1
                    if (!=s (rpgeqname $s) "(empty)") [
                        guibutton "Unequip" (format "rpgunequip \"%1\"" $s) "" ""
                    ]
                ]
            ]
        ]
    ]
    guibar
    guialign 0 [ guibutton "Close  [K]" "cleargui" "" "" ]
] "" "CHARACTER"

// RPG-only keybinds (inert on FPS maps; U/K are unbound in normal play)
bind U [if (isrpgmap) rpginventory]
bind K [if (isrpgmap) rpgcharacter]
