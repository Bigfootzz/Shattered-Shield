// Shattered Shield — RPG inventory & equipment screens (milestone step 4)
// Skinned with the System G6/Qoma CC0 RPG UI kit (packages/ui/rpg/).
// WINDOW CONFINEMENT PASS: every element is constrained inside the kit
// panel art. Construction per screen:
//   1. guiimage draws the panel as a square (scale*2*FONTH per side); the
//      non-square kit art is centered inside it. Top-level rows are
//      LEFT-aligned in the centered menu (a spring has nothing to fill at
//      top level), so the content column is centered on the panel box with
//      FIXED side pads: (boxwidth - colwidth)/2 via guistrut pads.
//      Inventory: box 16*FONTH = 32*FONTW, column 24*FONTW, pads 4*FONTW.
//   2. The content column forces its width with a leading vertical-mode
//      guistrut (guistrut N 1 in a vertical list = minimum N*FONTW width),
//      so every row is bounded by the column — PROVIDED no child row is
//      naturally wider than the column (a wider child stretches it and
//      spills again). Keep every row's natural width under the column.
//   3. guistrut -2*scale 0 backs the content up exactly the panel height
//      (guistrut with alt=0 calls space(), which moves vertically).
// Layout/confinement only: items, equip/unequip/use/drop, selection and
// persistence behavior are unchanged. Additive: I/C binds act on RPG maps.
// Auto-loaded by reloadMenus.

// selected inventory item (detail row)
rpg_sel = ""
rpg_seli = -1
// character screen tab: 0 = Primary, 1 = Offense, 2 = Defense
rpgchartab = 0

// ---- inventory screen: kit window panel, title + X inside the frame ----
// Reference: kit's own inventory mockup — title top-center inside the frame,
// close X top-right inside the frame, 7-column slot grid inside the frame,
// stack counts bottom-left inside each cell, footer helper inside the frame.
// (No gold/currency system exists in the RPG data, so the footer carries the
// helper line instead of a coin count.)
newgui rpginv [
    guiimage "packages/ui/rpg/windows/window_inventory.png" "" 8 0
    guistrut -16 0
    // The panel box is 16*FONTH = 32*FONTW wide; the 24-FONTW content column
    // is centered on it with fixed 4-FONTW pads (not springs: at top level a
    // spring has nothing to fill, so the old springs left every row
    // left-aligned and the panel misaligned with wide content). Every child
    // row must stay <= 24 FONTW or the column stretches and spills again.
    guilist [
        guistrut 4 0 // (32-24)/2: left pad, centers column on the panel box
        guilist [
            guistrut 24 1 // alt=1: force 24*FONTW min width in vertical list
            guistrut 0.9 0 // top pad inside frame
            // header: balanced title row, X inside the frame at top-right
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.3 [ guitext "Inventory" "" 0 ]
                guispring 1
                guibutton "X" "cleargui" "" ""
                guistrut 1.0 0
            ]
            guibar
            // 7-column x 3-row grid. Each cell is a vertical mini-list:
            // icon, then space(-1.0) backs up one FONTH so the stack count
            // draws over the cell's bottom-left, inside the cell.
            loop r 3 [
                guilist [
                    loop c 7 [
                        idx = (+ (* $r 7) $c)
                        guilist [
                            if (< $idx (rpginvcount)) [
                                if (= $idx $rpg_seli) [
                                    guiimage (strreplace (rpgcell $idx) "cell_" "cell_sel_") (format "rpg_seli = %1; rpg_sel = \"%2\"" $idx (rpginvid $idx)) 0.8 0
                                ] [
                                    guiimage (rpgcell $idx) (format "rpg_seli = %1; rpg_sel = \"%2\"" $idx (rpginvid $idx)) 0.8 0
                                ]
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext (concatword "x" (rpginvnum $idx)) "" 0 ]
                                ]
                            ] [
                                guiimage "packages/ui/rpg/slots/slot.png" "" 0.8 0
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext "" "" 0 ]
                                ]
                            ]
                        ]
                        guistrut 0.25 0
                    ]
                ]
            ]
            guibar
            // detail zone for the selected item (inside the frame)
            if (!=s $rpg_sel "") [
                guilist [
                    guiimage (rpgcell $rpg_seli) "" 0.8 0
                    guistrut 0.4 0
                    // 0.8 scale: longest v1 line "Puglin Stick  +8 damage"
                    // (23 chars) = 3.6 + 23*0.8 = 22 FONTW, under the
                    // 24-FONTW column budget so the column never stretches
                    guitextscale 0.8 [ guitext (concatword (rpginvname $rpg_seli) "  " (rpginvstat $rpg_seli)) "" 0 ]
                ]
                guilist [
                    if (= (rpginvtype $rpg_seli) 2) [
                        guibutton "Use" [rpguse $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
                    ] [
                        guibutton "Equip" [rpgequip $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
                    ]
                    guistrut 0.6 0
                    guibutton "Drop" [rpgdrop $rpg_sel; rpg_sel = ""; rpg_seli = -1] "" ""
                ]
                guibar
            ]
            // footer helper, centered inside the frame. Two short lines:
            // the single 40-char line was the widest row and stretched the
            // whole column past the panel. Both lines < 24 FONTW.
            guilist [
                guispring 1
                guitext "Click an item, then" "" 0
                guispring 1
            ]
            guilist [
                guispring 1
                guitext "Equip / Use / Drop." "" 0
                guispring 1
            ]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 4 0 // (32-24)/2: right pad, centers column on the panel box
    ]
] "guinoskin" "0"

// ---- character screen: kit statistic panel, reference layout ----
// Reference: kit's own statistic mockup — character name as title inside the
// frame top-center, back (<) top-left and X top-right inside the frame,
// equipment in the side columns (cells; click a filled cell to unequip),
// LVL/XP + tabbed stats on the center parchment, Primary | Offense |
// Defense tabs inside the frame at the bottom (real tab switching).
// Only real RPG data is shown: name, level, XP, weapon damage, armor,
// equipment slots, and the ability table (name/damage/cooldown/mana).
// The reference's strength/vitality/elemental rows are NOT our data and are
// left out until a real stats system exists.
newgui rpgchar [
    guiimage "packages/ui/rpg/windows/window_statistic.png" "" 9 0
    guistrut -18 0
    guilist [
        guispring 1
        guilist [
            guistrut 29 1 // alt=1: force 29*FONTW min width in vertical list
            guistrut 0.7 0 // top pad inside frame
            // header: back | name | X, all inside the frame
            guilist [
                guistrut 2.5 0
                guibutton "<" "cleargui" "" ""
                guispring 1
                guitextscale 1.3 [ guitext (getname) "" 0 ]
                guispring 1
                guibutton "X" "cleargui" "" ""
            ]
            guilist [
                guispring 1
                guitext (concatword "LVL: " (rpglevel) "     XP: " (rpgxp)) "" 0
                guispring 1
            ]
            guibar
            // body: equipment columns flanking the tabbed stats
            guilist [
                guispring 1
                guilist [
                    // portrait placeholder (no portrait art staged yet)
                    guiimage "packages/ui/rpg/slots/slot.png" "" 1.1 0
                    looplist s "mainhand torso legs feet" [
                        guiimage (rpgeqcell $s) (if (!=s (rpgeqname $s) "(empty)") (format "rpgunequip \"%1\"" $s) "") 0.9 0
                    ]
                ]
                guistrut 1.0 0
                guilist [
                    if (= $rpgchartab 0) [
                        // two short columns: every row <= 24 FONTW so the
                        // content column can never stretch past the panel.
                        guilist [
                            guilist [
                                guitext (concatword (rpgattrname 0) ": " (rpgattr 0)) "" 0
                                guitext (concatword (rpgattrname 1) ": " (rpgattr 1)) "" 0
                                guitext (concatword (rpgattrname 2) ": " (rpgattr 2)) "" 0
                            ]
                            guistrut 2.0 0
                            guilist [
                                guitext (concatword (rpgattrname 3) ": " (rpgattr 3)) "" 0
                                guitext (concatword (rpgattrname 4) ": " (rpgattr 4)) "" 0
                                guitext (concatword (rpgattrname 5) ": " (rpgattr 5)) "" 0
                            ]
                        ]
                        guitext (concatword "Max HP: " (rpgmaxhp)) "" 0
                        guitext (concatword "Max mana: " (rpgmaxmana)) "" 0
                    ] [ if (= $rpgchartab 1) [
                        guitext (concatword (rpgabname 0) " (" (rpgabtype 0) "): " (rpgabstatdmg 0) " dmg") "" 0
                        guitext (concatword "  " (rpgabcdstr 0) " cd   " (rpgabmana 0) " mana") "" 0
                        guitext (concatword (rpgabname 1) " (" (rpgabtype 1) "): " (rpgabstatdmg 1) " dmg") "" 0
                        guitext (concatword "  " (rpgabcdstr 1) " cd   " (rpgabmana 1) " mana") "" 0
                        guitext (concatword "Crit: " (rpgcritchance) "  " (rpgcritmult)) "" 0
                        guitext (concatword "Weapon: +" (rpgweapondmg) "  Mana: " (rpgmana) " / " (rpgmaxmana)) "" 0
                    ] [
                        guitext (concatword "Armor: " (rpgarmortotal) "  reduces " (rpgarmorred)) "" 0
                        looplist s "head torso legs feet" [
                            guitext (concatword $s ": +" (rpgeqarmor $s)) "" 0
                        ]
                        guitext "Resists (not active yet):" "" 0
                        guilist [
                            guilist [
                                guitext (concatword (rpgresistname 0) ": " (rpgresist 0)) "" 0
                                guitext (concatword (rpgresistname 1) ": " (rpgresist 1)) "" 0
                                guitext (concatword (rpgresistname 2) ": " (rpgresist 2)) "" 0
                            ]
                            guistrut 2.0 0
                            guilist [
                                guitext (concatword (rpgresistname 3) ": " (rpgresist 3)) "" 0
                                guitext (concatword (rpgresistname 4) ": " (rpgresist 4)) "" 0
                                guitext (concatword (rpgresistname 5) ": " (rpgresist 5)) "" 0
                            ]
                        ]
                    ] ]
                ]
                guistrut 1.0 0
                guilist [
                    guiimage (rpgeqcell "head") (if (!=s (rpgeqname "head") "(empty)") "rpgunequip \"head\"" "") 0.9 0
                ]
                guispring 1
            ]
            guibar
            // tabs: real switching, active tab highlighted as title text
            guilist [
                guispring 1
                if (= $rpgchartab 0) [ guititle "Primary" 0 ] [ guibutton "Primary" "rpgchartab = 0" "" "" ]
                guistrut 1.5 0
                if (= $rpgchartab 1) [ guititle "Offense" 0 ] [ guibutton "Offense" "rpgchartab = 1" "" "" ]
                guistrut 1.5 0
                if (= $rpgchartab 2) [ guititle "Defense" 0 ] [ guibutton "Defense" "rpgchartab = 2" "" "" ]
                guispring 1
            ]
            guilist [
                guispring 1
                guitext "Click an equipped item to unequip it." "" 0
                guispring 1
            ]
            guistrut 0.5 0 // bottom pad
        ]
        guispring 1
    ]
] "guinoskin" "0"

// RPG keybinds: I opens inventory, C opens the character screen (replacing U/K).
// RPG-gated: on RPG maps they open the RPG windows; anywhere else they keep
// their stock actions (I = taunt, C = radio team menu), so FPS maps are untouched.
bind I [if (isrpgmap) [rpginventory] [taunt]]
bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
// defaults.cfg loads AFTER this file and rebinds I/C to the stock actions,
// so re-assert the RPG binds on every map start (RPG maps only; FPS maps keep
// their stock binds because the gate below never fires there).
map_changed = [
    if (isrpgmap) [
        bind I [if (isrpgmap) [rpginventory] [taunt]]
        bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
    ]
]
