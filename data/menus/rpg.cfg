// Shattered Shield — RPG inventory & equipment screens (milestone step 4)
// Skinned with the System G6/Qoma CC0 RPG UI kit (packages/ui/rpg/).
// WINDOW CONFINEMENT PASS: every element is constrained inside the kit
// panel art. Construction per screen:
//   1. guiimage draws the panel as a square (scale*2*FONTH per side); the
//      non-square kit art is centered inside it. Top-level rows are
//      LEFT-aligned in the centered menu (a spring has nothing to fill at
//      top level), so the content column is centered on the panel box with
//      FIXED side pads: (boxwidth - colwidth)/2 via guistrut pads.
//      Inventory: box 16*FONTH = 32*FONTW, column 24*FONTW, pads 4*FONTW.
//   2. The content column forces its width with a leading vertical-mode
//      guistrut (guistrut N 1 in a vertical list = minimum N*FONTW width),
//      so every row is bounded by the column — PROVIDED no child row is
//      naturally wider than the column (a wider child stretches it and
//      spills again). Keep every row's natural width under the column.
//   3. guistrut -2*scale 0 backs the content up exactly the panel height
//      (guistrut with alt=0 calls space(), which moves vertically).
// Layout/confinement only: items, equip/unequip/use/drop, selection and
// persistence behavior are unchanged. Additive: I/C binds act on RPG maps.
// Auto-loaded by reloadMenus.

// selected inventory cell index (-1 = none). Item ids are resolved via
// (rpginvid $rpg_seli) at point of use, so no quoted strings appear in
// actions. NOTE: this engine ends a CubeScript string at \" — the C-style
// \" escape does NOT work here (only ^" escapes a quote). Never put \"
// inside a cfg string; the old code did and it broke every inventory and
// equipment cell click action.
rpg_seli = -1
// Previous selection, for the hover-delay click reset (Note 20): when a
// click changes the selection, the hover timer restarts.
rpg_seli_prev = -1
// Hover delay (Note 20, Nov 13): rpg_hover_cell tracks which cell the
// hover timer is for; rpg_hover_since is the totalmillis when that hover
// started. The hover pop-up only appears after ~3s on the same cell.
rpg_hover_cell = -1
rpg_hover_since = 0
// Character-sheet hover delay (same rule, per-slot string instead of an
// index): which slot the timer is for, and when that hover started.
rpg_charhover_cell = ""
rpg_charhover_since = 0

// inventory cell click: toggle-select the cell. The quoteless action string
// "rpgcellact N" also feeds the hover tracker (guirolloverimgaction).
rpgcellact = [
    if (= $rpg_seli $arg1) [rpg_seli = -1] [rpg_seli = $arg1]
]

// ---- vendor context (v0.1.23: live) ----
// rpg_atvendor is 1 while the player is at a vendor; the inventory pop-up's
// third action then renders Sell instead of Drop. The Sell button calls
// the server sell directly (rpgsell); the old rpgvendorsell alias indirection
// is gone (v0.1.34: it was the one unproven link in the GUI sell path, and
// a silent alias failure would leave the count unchanged with no visible
// message). Currency: copper/silver/gold, 100c = 1s,
// 100s = 1g, stored as total copper. Sell price = item value / 2.
rpg_atvendor = 0
// character screen tab: 0 = Primary, 1 = Offense, 2 = Defense
rpgchartab = 0
// spells side panel (Nov 13 rework): 1 = the spells list is open beside
// the sheet, 0 = closed. Separate from rpgchartab — Spells does not swap
// the center stats, it toggles this panel.
// FLOATING PANEL (v0.1.103): the spells list is now its own window
// (newgui rpgspells, docked right of the sheet via guishiftx), not a
// column inside rpgchar. rpg_togglespells opens/closes it and keeps the
// flag in sync; the sheet's X button closes both.
rpgshowspells = 0
rpg_togglespells = [
    if (= $rpgshowspells 1) [
        rpgshowspells = 0
        hidegui rpgspells
    ] [
        rpgshowspells = 1
        showgui rpgspells
    ]
]

// ---- inventory screen: kit window panel, title + X inside the frame ----
// Reference: kit's own inventory mockup — title top-center inside the frame,
// close X top-right inside the frame, 8-column slot grid inside the frame,
// stack counts bottom-left inside each cell, footer helper inside the frame.
// (No gold/currency system exists in the RPG data, so the footer carries the
// helper line instead of a coin count.)
newgui rpginv [
    // STAY-OPEN (Oct 21): the engine closes a menu on ANY widget click by
    // default (shouldclearmenu in src/engine/menus.cpp: every guibutton /
    // guiimage / guiplayerpreview click sets clearlater). That is why
    // clicking a cell closed the window and forced a reopen before Equip.
    // guistayopen suppresses the auto-close for this menu's widgets, so
    // select -> Equip/Use/Drop all happen with the window open. The X
    // button still closes it via its explicit [cleargui], and Esc still
    // pops the GUI stack - neither goes through shouldclearmenu.
    guistayopen [
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, easier to read.
    // Same dimensions/position as before, art swapped to parchment,
    // text dark brown (journal precedent: 43/30/18), restored at end.
    // v0.1.36 tight frame (Ed Oct 28, WoW-style): the parchment is a
    // background stretched over the content box (guibackgroundtex),
    // so the frame hugs the content — no fixed 8.5 image, no strut.
    // Menu width stays 5+24+5 = 34 FONTW; menu height = content height.
    // The engine centers the menu rect, so the frame's center is the
    // menu center in every state. Lift 0.12 (shared anchor).
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): the inventory lives
    // in a fixed 34 FONTW x 16 FONTH frame (guiframe). The frame never
    // grows with content, so the window size is constant in every state
    // (grid, tooltip, buttons). Content taller than the frame scrolls
    // inside it; content wider is clipped. 16 FONTH is an estimate
    // (header 1.2 + coin 0.7 + grid ~9.5 + tooltip ~1.95 + pads/bars
    // ~2.2); Ed to confirm in game.
    guiminbox 34 18 [
        guistrut 5 0 // (34-24)/2: left pad, centers column on the panel box
        guilist [
            guistrut 24 1 // alt=1: force 24*FONTW min width in vertical list
            guistrut 1.0 0 // top inset inside the tight frame (uniform across windows)
            // header: balanced title row, X alone inside the frame at
            // top-right (v0.1.35, Ed Oct 28: Craft/Recipes live in their
            // own window now, so Inventory has no tab row at all).
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Inventory" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            // FIX (Note 80, Nov 14): the coin line sat at ~2.2 FONTH, inside
            // the 3.5-FONTH plaque, so Coin/Embers overlapped the plaque
            // edge and were hard to read. A 1.3-FONTH spacer drops the coin
            // line to 3.5 FONTH, clear of the plaque — same fix as the
            // sheet's Level line and the crafting tabs.
            guistrut 1.3 0
            // Coin total (Ed: inventory is where you sell from, so gold shows here)
            // Scale 0.7, single space: the 0.9 + 3-space line ran past the
            // 24 FONTW column (and the steel frame interior is narrower
            // still), clipping Coin at left and Embers at right.
            guilist [
                guispring 1
                guitextscale 0.7 [ guitext (concat "Coin: " (rpgmoney) " Embers: " (rpgembers)) "" 0 ]
                guispring 1
            ]
            guibar
            // 8-column x 6-row grid (Ed, Oct 27: the frame had room for
            // one more column, 48 cells, up from 42). Each cell is
            // a vertical mini-list: icon, then space(-0.7) backs up so the
            // stack count draws over the cell's bottom-left, inside the cell.
            // Click action is the quoteless rpgcellact toggle; the action
            // string also feeds the hover tracker below.
            // v0.1.8: guinopressed kills the engine's pressed-state dark
            // overlay on the cells (it flashed + shifted a few px on every
            // click - Ed's "flicker"). Selection feedback is the cell_sel_
            // art swap, which stays.
            guinopressed [
            loop r 6 [
                guilist [
                    loop c 8 [
                        idx = (+ (* $r 8) $c)
                        guilist [
                            if (< $idx (rpginvcount)) [
                                if (= $idx $rpg_seli) [
                                    guiimage (strreplace (rpgcell $idx) "cell_" "cell_sel_") (format "rpgcellact %1" $idx) 0.7 0
                                ] [
                                    guiimage (rpgcell $idx) (format "rpgcellact %1" $idx) 0.7 0
                                ]
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext (concatword "x" (rpginvnum $idx)) "" 0 ]
                                ]
                            ] [
                                guiimage "packages/ui/rpg/slots/slot.png" "" 0.7 0
                                guistrut -0.7 0
                                guilist [
                                    guistrut 0.25 0
                                    guitextscale 0.65 [ guitext "" "" 0 ]
                                ]
                            ]
                        ]
                        // v0.1.31: grid row must fit the 24 FONTW column.
                        // A cell is 0.7 scale = 1.4 FONTH = 2.8 FONTW wide,
                        // so 8 cells + 8 x 0.25 struts = 24.4 FONTW, which
                        // stretched the panel past its 32 FONTW frame and
                        // pushed the window's right edge off center. At
                        // 0.20 the row is exactly 8 x (2.8 + 0.20) = 24.0.
                        guistrut 0.20 0
                    ]
                ]
            ]
            ] // guinopressed
            guibar
            // ---- hover tooltip pop-up (fixed-height detail zone) ----
            // The engine sets the guirolloverimgaction alias to the hovered
            // image's action during the render pass, every frame. The menu
            // body runs before that each frame, so: read last frame's hover,
            // then clear the alias so a stale hover can't linger. 1-frame lag,
            // imperceptible. Cell actions are "rpgcellact N", so the hovered
            // index is the tail of that string.
            rpg_hover = -1
            rpg_ract = (getalias guirolloverimgaction)
            alias guirolloverimgaction ""
            if (>= (strstr $rpg_ract "rpgcellact ") 0) [rpg_hover = (substr $rpg_ract 11)]
            // Hover delay (Note 20, Nov 13): reset the timer when the
            // hovered cell changes (including leaving to no hover) or a
            // click changes the selection; the pop-up only shows after
            // ~3s of continuous hover on the same cell. A click
            // (selection) is immediate and bypasses the delay.
            if (!= $rpg_hover $rpg_hover_cell) [
                rpg_hover_cell = $rpg_hover
                rpg_hover_since = (getmillis 1)
            ]
            if (!= $rpg_seli $rpg_seli_prev) [
                rpg_seli_prev = $rpg_seli
                rpg_hover_since = (getmillis 1)
            ]
            rpg_hover_ready = (&& (>= $rpg_hover 0) (>= (- (getmillis 1) $rpg_hover_since) 3000))
            // Tooltip target: the hovered cell (quick stat checks) when
            // nothing is selected; the selected cell otherwise. Once a cell is
            // clicked the pop-up LOCKS to the selection (hover no longer moves
            // it) so the cursor can travel to the action buttons without the
            // pop-up vanishing or retargeting mid-click. Click the selected
            // cell again (or close the window) to release it.
            rpg_tip = $rpg_seli
            if ($rpg_hover_ready) [
                if (< $rpg_seli 0) [rpg_tip = $rpg_hover]
            ]
            if (>= $rpg_tip 0) [
                // The tooltip sits BELOW the grid (no overlay): the grid's
                // closing guibar above is the single separator line. The full
                // 8x6 grid stays visible. Every row here stays under the
                // 24-FONTW column budget. Scales shrunk (Note 20, Nov 13):
                // name 0.85 -> 0.7, stat 0.7 -> 0.55, icon 0.7 -> 0.55.
                guilist [
                    guiimage (rpgcell $rpg_tip) "" 0.55 0
                    guistrut 0.4 0
                    guilist [
                        guitextscale 0.7 [ guitext (rpginvname $rpg_tip) "" 0 ]
                        guitextscale 0.55 [ guitext (rpginvstat $rpg_tip) "" 0 ]
                    ]
                ]
                // action buttons only on the locked selection, acting on the
                // selected cell; the hover-only pop-up is info-only. Scaled
                // down a touch so the whole strip sits comfortably inside the
                // panel frame with clear space above the bottom edge.
                if (= $rpg_tip $rpg_seli) [
                    guitextscale 0.7 [ guilist [
                        if (= (rpginvtype $rpg_tip) 2) [
                            guibutton "Use" [rpguse (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ] [
                            guibutton "Equip" [rpgequip (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ]
                        guistrut 0.6 0
                        if (= $rpg_atvendor 1) [
                            guibutton "Sell" [rpgsell (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ] [
                            guibutton "Drop" [rpgdrop (rpginvid $rpg_seli); rpg_seli = -1] "" ""
                        ]
                    ] ]
                ] [
                    // FIXED-HEIGHT detail zone (v0.1.24): hover-only pop-up
                    // is info-only, but its button row's height is reserved
                    // with a blank line at the same 0.7 scale, so hovering
                    // vs selecting does not change the window height.
                    guitextscale 0.7 [ guitext "" "" 0 ]
                ]
            ] [
                // FIXED-HEIGHT detail zone (v0.1.24): nothing hovered or
                // selected — reserve the full tooltip + button zone with
                // blank lines at the exact same scales (0.7 name + 0.55
                // stat + 0.7 button row), so the window height is identical
                // in every state. This replaces the old conditional
                // guistrut 3, which only padded the no-tip state and left
                // hover (shorter) and selected (in between) at different
                // heights, so the centered window reflowed and shifted on
                // every click/hover. The constant height equals the old
                // selected-state height, so the selected view is unchanged.
                guitextscale 0.7 [ guitext "" "" 0 ]
                guitextscale 0.55 [ guitext "" "" 0 ]
                guitextscale 0.7 [ guitext "" "" 0 ]
            ]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 5 0 // (34-24)/2: right pad, centers column on the panel box
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen (see note at the top of this menu)
] "guinoskin; guilift 0; guipanel main" "0"

// ---- character screen: kit statistic panel, reference layout ----
// Reference: kit's own statistic mockup — character name as title inside the
// frame top-center, X top-right inside the frame (v0.1.24: the redundant
// top-left back (<) button was removed — X is the only close control),
// equipment in the side columns (cells; click a filled cell to unequip),
// LVL/XP + tabbed stats on the center parchment, Primary | Offense |
// Defense tabs inside the frame at the bottom (real tab switching).
// Only real RPG data is shown: name, level, XP, weapon damage, armor,
// equipment slots, and the ability table (name/damage/cooldown/mana).
// The reference's strength/vitality/elemental rows are NOT our data and are
// left out until a real stats system exists.
// Paperdoll equipment cell (character sheet): the framed dark slot
// background ALWAYS draws (so every slot reads identically whether empty
// or filled), the slot's ghosted background icon draws on top of it, and
// when an item is equipped its icon draws OVER the ghost (each -3.6 strut
// pulls the cursor back over the 0.9-scale image in the horizontal
// mini-list). Scale 0.9 (Ed, Nov 14, Note 78: bigger icons) — each cell
// is 1.8 FONTH, 4 stacked = 7.2 FONTH per column. Clicking an equipped
// cell unequips it.
rpgpaperdoll = [
    guilist [
        guiimage "packages/ui/rpg/slots/slot.png" "" 0.9 0
        guistrut -3.6 0
        guiimage (concatword "packages/ui/rpg/slots/slotbg_" $arg1 ".png") "" 0.9 0
        if (!=s (rpgeqname $arg1) "(empty)") [
            guistrut -3.6 0
            guiimage (rpgeqcell $arg1) (concatword "rpgunequip " $arg1) 0.9 0
        ]
    ]
]
newgui rpgchar [
    // v0.1.40 (Ed Oct 30, .39 note 2): character-sheet tabs closed the whole
    // window on click. The engine closes a GUI on button click unless the
    // body is wrapped in guistayopen (same mechanism as the Oct 21 main-card
    // fix and the .34 craft-window stay-open fix; shouldclearmenu in
    // src/engine/menus.cpp). Wrapping the body keeps the sheet open across
    // Primary/Offense/Defense tab clicks; the X button's explicit [cleargui]
    // and Esc still close it.
    guistayopen [
    // FLOATING PANEL SYNC (v0.1.103): if the spells panel was closed
    // by Escape (top window pops first), its flag goes stale — reset
    // it so the Spells tab shows the correct state. The panel only
    // ever opens from the toggle, so a set flag with no panel means
    // it was closed out from under us.
    if (&& (= $rpgshowspells 1) (! (guishowing "rpgspells"))) [rpgshowspells = 0]
    // v0.1.30: standardized to the Inventory frame (Ed, Oct 27: all
    // windows share the Inventory dimensions: menu width 34 FONTW, the
    // 24-FONTW content column centered on it with fixed 5-FONTW pads).
    // REWORK (Nov 13, Ed approved mockups v5/v6): steel window
    // (window_steel.png, replaces parchment) with WHITE text — the old
    // dark brown (43/30/18) was for parchment and is unreadable on black
    // glass. The 180/110/110 restore at the end is the default for other
    // menus, unchanged. Layout (mockup v5/v6): equipment area on top
    // (slots flanking the character's select-page portrait, Cape + Off
    // Hand in a centered bottom row), CHARACTER STATS section underneath
    // with < > paging, tabs at the bottom. Spells does NOT swap the
    // center — it toggles the floating spells panel (newgui rpgspells,
    // docked right of the sheet via guishiftx) listing the class spells;
    // the center keeps the last stats tab.
    // All text centered (Ed, Nov 13: "centered text and clean").
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): the sheet content
    // lives in a fixed 38 FONTW x 30 FONTH frame (guiminbox). The frame
    // never shrinks below the minimum, so every stats tab renders the
    // same window size (Offense is the tallest tab, ~28.3 FONTH; 30 gives
    // headroom). Content taller than the frame grows it; content wider
    // is clipped. The 7+24+7 pad/column structure centers the 24-FONTW
    // column in the 38-FONTW frame. (Ed, Nov 14, Note 78: wider so the
    // icons are bigger, a little shorter.)
    guiminbox 38 30 [
        guistrut 7 0
        guilist [
            // --- the sheet column ---
            // (v0.1.103: the spells list is a separate floating window,
            // newgui rpgspells — it is no longer a column in this window.)
            guilist [
                guilist [
                    guistrut 24 1 // alt=1: 24*FONTW min width, same as Inventory
                    guistrut 1.0 0 // top inset inside the tight frame (uniform across windows)
                    // header: name centered | X top-right, all inside the frame
                    guilist [
                        guistrut 3.4 0
                        guispring 1
                        guitextscale 1.2 [ guitext (getname) "" 0 ]
                        guispring 1
                        guibutton "X" [hidegui rpgspells; rpgshowspells = 0; cleargui] "0"
                        guistrut 1.0 0
                    ]
                    // Spacer so the Level/XP line clears the title plaque
                    // in the steel background (it overlapped the plaque
                    // and the name). 1.8 FONTH was not enough (Note 50:
                    // still sitting on the plaque in .104) — 2.5 drops it
                    // into the dark interior below the plaque, matching
                    // the gap in mockup v6. Estimate; Ed to confirm in game.
                    guistrut 2.5 0
                    guilist [
                        guispring 1
                        // WoW-style header line: "Level 12 Warrior   XP: 1234"
                        // (same row, same position; class from rpgclass, "" when
                        // unknown). Row stays under the 30-FONTW column budget.
                        guitext (concatword "Level " (rpglevel) " " (rpgclass) "   XP: " (rpgxp)) "" 0
                        guispring 1
                    ]
                    guibar
                    // ===== EQUIPMENT AREA =====
                    // Slots flank the character's portrait (the select-page
                    // portrait art, resolved from the current model dir via
                    // playermodeldir — e.g. warrior_male ->
                    // portrait_warrior_male.png). icon_ preserves the 1:2
                    // aspect and centers it in its box, so it is never
                    // squished. The 1.2 strut centers the 5.6-FONTH slot
                    // columns (4 x 1.4 FONTH cells) in the 8-FONTH
                    // portrait row (children in a row are top-aligned).
                    guilist [
                        guispring 1
                        guilist [
                            guistrut 1.2 0
                            rpgpaperdoll "mainhand"
                            rpgpaperdoll "torso"
                            rpgpaperdoll "legs"
                            rpgpaperdoll "feet"
                        ]
                        guistrut 0.5 0
                        guiimage (concatword "packages/ui/rpg/portraits/portrait_" (playermodeldir) ".png") "" 5.0 0
                        guistrut 0.5 0
                        guilist [
                            guistrut 1.2 0
                            rpgpaperdoll "head"
                            rpgpaperdoll "neck"
                            rpgpaperdoll "ring1"
                            rpgpaperdoll "ring2"
                        ]
                        guispring 1
                    ]
                    // ===== BOTTOM ROW: Cape + Off Hand, centered =====
                    // Both are real paperdolls. Off Hand is the new slot
                    // (Nov 13): Warrior shield / Magi orb, Ranger none.
                    // Empty until shield/orb item defs exist; the slotbg is
                    // a shield silhouette (slotbg_offhand.png).
                    guilist [
                        guispring 1
                        guilist [
                            guialign 0 [
                                rpgpaperdoll "cape"
                                guitextscale 0.65 [ guitext "Cape" "" 0 ]
                            ]
                        ]
                        guistrut 1.0 0
                        guilist [
                            guialign 0 [
                                rpgpaperdoll "offhand"
                                guitextscale 0.65 [ guitext "Off Hand" "" 0 ]
                            ]
                        ]
                        guispring 1
                    ]
                    guibar
                    // ===== STATS SECTION =====
                    // "CHARACTER STATS" header with < > paging through the
                    // three stats tabs (Primary/Offense/Defense). Each tab's
                    // content is centered (guialign 0); the two-column
                    // Primary block centers as one row.
                    guilist [
                        guispring 1
                        guitextscale 1.0 [ guitext "CHARACTER STATS" "" 0 ]
                        guispring 1
                        guibutton "<" "rpgchartab = (mod (+ $rpgchartab 2) 3)" "" ""
                        guibutton ">" "rpgchartab = (mod (+ $rpgchartab 1) 3)" "" ""
                    ]
                    if (= $rpgchartab 0) [
                    guialign 0 [
                    // FIX (Note 50/52, Nov 13): the tab content must stack
                    // VERTICALLY inside the 24 FONTW column. guialign
                    // pushes to an odd (horizontal) depth, so the bare
                    // guitext items ran in one long row and stretched the
                    // window. This inner guilist is the even (vertical)
                    // depth, so rows stack and every tab is the same width.
                    // 2x4 grid like mockup v6: left Strength/Dexterity/
                    // Vitality/Max HP, right Knowledge/Wisdom/Cunning/
                    // Max Mana. Font/icon scale unchanged (0.65) so the
                    // text stays crisp, layout does the fitting.
                    guilist [
                    guitextscale 0.65 [
                        guilist [
                            guilist [
                                guitext (concatword (rpgattrname 0) ": " (rpgattr 0)) "" 0
                                guitext (concatword (rpgattrname 1) ": " (rpgattr 1)) "" 0
                                guitext (concatword (rpgattrname 2) ": " (rpgattr 2)) "" 0
                                guitext (concatword "Max HP: " (rpgmaxhp)) "" 0
                            ]
                            guistrut 1.0 0
                            guilist [
                                guitext (concatword (rpgattrname 3) ": " (rpgattr 3)) "" 0
                                guitext (concatword (rpgattrname 4) ": " (rpgattr 4)) "" 0
                                guitext (concatword (rpgattrname 5) ": " (rpgattr 5)) "" 0
                                guitext (concatword "Max Mana: " (rpgmaxmana)) "" 0
                            ]
                        ]
                        // Phase 3: equipped gear bonuses, post-weighting,
                        // alongside the base attributes ("" when none).
                        if (!= (rpggearline) "") [
                            guitext (concatword "Gear: " (rpggearline)) "" 0
                        ]
                    ] ] ] ]
                    if (= $rpgchartab 1) [
                    guialign 0 [
                    // FIX (Note 51, Nov 13): same vertical-stack fix as
                    // Primary — the spell lines ran in one horizontal row
                    // off both edges. Inner guilist is the vertical depth.
                    guilist [
                    guitextscale 0.7 [
                        looplist a "0 1 2 3 4" [
                            guitext (concatword (rpgabname $a) " (" (rpgabtype $a) "): " (rpgabstatdmg $a) " dmg") "" 0
                            guitext (concatword "  " (rpgabcdstr $a) " cd   " (rpgabmana $a) " mana") "" 0
                        ]
                        guitext (concatword "Crit: " (rpgcritchance) "  " (rpgcritmult)) "" 0
                        guitext (concatword "Weapon: +" (rpgweapondmg) "  Mana: " (rpgmana) " / " (rpgmaxmana)) "" 0
                    ] ] ] ]
                    if (= $rpgchartab 2) [
                    guialign 0 [
                    // FIX (Note 53, Nov 13): same vertical-stack fix, and
                    // the 9 gear slots move into a two-column grid (was 9
                    // separate lines in one horizontal row, running off the
                    // right edge). Inner guilist is the vertical depth.
                    guilist [
                    guitextscale 0.7 [
                        guitext (concatword "Armor: " (rpgarmortotal) "  reduces " (rpgarmorred)) "" 0
                        guilist [
                            guilist [
                                guitext (concatword "head: +" (rpgeqarmor "head")) "" 0
                                guitext (concatword "neck: +" (rpgeqarmor "neck")) "" 0
                                guitext (concatword "torso: +" (rpgeqarmor "torso")) "" 0
                                guitext (concatword "legs: +" (rpgeqarmor "legs")) "" 0
                                guitext (concatword "feet: +" (rpgeqarmor "feet")) "" 0
                            ]
                            guistrut 1.0 0
                            guilist [
                                guitext (concatword "ring1: +" (rpgeqarmor "ring1")) "" 0
                                guitext (concatword "ring2: +" (rpgeqarmor "ring2")) "" 0
                                guitext (concatword "cape: +" (rpgeqarmor "cape")) "" 0
                                guitext (concatword "offhand: +" (rpgeqarmor "offhand")) "" 0
                            ]
                        ]
                        guitext "Resists (not active yet):" "" 0
                        guilist [
                            guilist [
                                guitext (concatword (rpgresistname 0) ": " (rpgresist 0)) "" 0
                                guitext (concatword (rpgresistname 1) ": " (rpgresist 1)) "" 0
                                guitext (concatword (rpgresistname 2) ": " (rpgresist 2)) "" 0
                            ]
                            guistrut 1.0 0
                            guilist [
                                guitext (concatword (rpgresistname 3) ": " (rpgresist 3)) "" 0
                                guitext (concatword (rpgresistname 4) ": " (rpgresist 4)) "" 0
                                guitext (concatword (rpgresistname 5) ": " (rpgresist 5)) "" 0
                            ]
                        ]
                    ] ] ] ]
                    guibar
                    // tabs: Primary/Offense/Defense switch the center stats;
                    // Spells toggles the floating panel (rpg_togglespells)
                    // and does NOT swap the center. Active tab shown as title text.
                    // FIX (Note 50, Nov 13): the four tab labels at full scale
                    // are 27 chars + struts = ~29 FONTW, past the 24 FONTW
                    // column, so they ran together and clipped. Scale 0.8
                    // brings the row to ~23 FONTW; struts 0.6. Font stays
                    // readable (0.8, not shrunk to fit by making it tiny).
                    guilist [
                        guispring 1
                        guitextscale 0.8 [
                        if (= $rpgchartab 0) [ guititle "Primary" 0 ] [ guibutton "Primary" "rpgchartab = 0" "" "" ]
                        guistrut 0.6 0
                        if (= $rpgchartab 1) [ guititle "Offense" 0 ] [ guibutton "Offense" "rpgchartab = 1" "" "" ]
                        guistrut 0.6 0
                        if (= $rpgchartab 2) [ guititle "Defense" 0 ] [ guibutton "Defense" "rpgchartab = 2" "" "" ]
                        guistrut 0.6 0
                        if (= $rpgshowspells 1) [ guititle "Spells" 0 ] [ guibutton "Spells" "rpg_togglespells" "" "" ]
                        ]
                        guispring 1
                    ]
                    // ---- hover tooltip (WoW-style, additive) ----
                    // Paperdoll cell actions are "rpgunequip <slot>", so the hovered
                    // slot is the tail of that string. Same 1-frame-lag pattern as
                    // the inventory tooltip: the engine sets guirolloverimgaction
                    // during the render pass, so read last frame's value, then clear
                    // it so a stale hover can't linger. Hover-only, info-only:
                    // clicking a cell still unequips immediately (unchanged).
                    // Empty slots carry no action, so they never tooltip; tab/X
                    // buttons carry other actions and are rejected by the prefix
                    // check. Value is appended to the detail line only when > 0.
                    // Hover delay (Note 20, Nov 13): same ~3s rule as the
                    // inventory tooltip — reset when the hovered slot changes.
                    // Scales shrunk (Note 20): name 0.85 -> 0.7, detail
                    // 0.7 -> 0.55, icon 0.7 -> 0.55. The tooltip row is now
                    // ~1.25 FONTH (was 1.55), so the bottom pad grows 0.5 ->
                    // 0.8 to keep the 2.05 FONTH height budget (hint 0.75 +
                    // 1.3 pad), so hovering never changes the window height.
                    rpg_charhover = ""
                    rpg_cact = (getalias guirolloverimgaction)
                    alias guirolloverimgaction ""
                    if (>= (strstr $rpg_cact "rpgunequip ") 0) [rpg_charhover = (substr $rpg_cact 11)]
                    if (!=s $rpg_charhover $rpg_charhover_cell) [
                        rpg_charhover_cell = $rpg_charhover
                        rpg_charhover_since = (getmillis 1)
                    ]
                    rpg_charhover_ready = (&& (!=s $rpg_charhover "") (>= (- (getmillis 1) $rpg_charhover_since) 3000))
                    if ($rpg_charhover_ready) [
                        rpg_hslot = $rpg_charhover
                        if (=s $rpg_charhover "mainhand") [rpg_hslot = "Main Hand"]
                        if (=s $rpg_charhover "head") [rpg_hslot = "Head"]
                        if (=s $rpg_charhover "neck") [rpg_hslot = "Neck"]
                        if (=s $rpg_charhover "torso") [rpg_hslot = "Chest"]
                        if (=s $rpg_charhover "legs") [rpg_hslot = "Legs"]
                        if (=s $rpg_charhover "feet") [rpg_hslot = "Feet"]
                        if (=s $rpg_charhover "ring1") [rpg_hslot = "Ring 1"]
                        if (=s $rpg_charhover "ring2") [rpg_hslot = "Ring 2"]
                        if (=s $rpg_charhover "cape") [rpg_hslot = "Cape"]
                        if (=s $rpg_charhover "offhand") [rpg_hslot = "Off Hand"]
                        rpg_hdetail = (concatword $rpg_hslot " | " (rpgeqstat $rpg_charhover))
                        if (> (rpgeqvalue $rpg_charhover) 0) [rpg_hdetail = (concatword $rpg_hdetail " | Value " (rpgeqvalue $rpg_charhover))]
                        guilist [
                            guiimage (rpgeqcell $rpg_charhover) "" 0.55 0
                            guistrut 0.4 0
                            guilist [
                                guitextscale 0.7 [ guitext (rpgeqname $rpg_charhover) "" 0 ]
                                guitextscale 0.55 [ guitext $rpg_hdetail "" 0 ]
                            ]
                        ]
                        guistrut 0.8 0 // bottom pad (tooltip shown)
                    ] [
                        guilist [
                            guispring 1
                            guitextscale 0.75 [ guitext "Click an equipped item to unequip it." "" 0 ]
                            guispring 1
                        ]
                        guistrut 1.3 0 // bottom pad (0.75 + 1.3 = tooltip 1.55 + 0.5)
                    ]
                ]
                // (v0.1.103: the spells list is now its own floating window,
                // newgui rpgspells — the side-panel column is gone.)
            ]
        ]
        guistrut 7 0
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen (v0.1.40: sheet stays open across tab clicks)
] "guinoskin; guilift 0; guipanel main" "0"

// ===== SPELLS FLOATING PANEL (v0.1.103) =====
// Separate window (newgui rpgspells), docked right of the character
// sheet via guishiftx 0.30 in the init script (same 0.12 lift as the
// sheet, so the tops align). Same info as the old .101 Spells tab
// (name, description, damage, mana, cooldown), with the ability icon
// per row. rpgspellid maps the class-list slot to an ability id; empty
// slots (id -1) render nothing, so Warrior/Ranger show 2 rows and
// Magi 3. The spell rows scroll on the mouse wheel (guiscroll, engine
// widget in 3dgui.cpp) when more spells exist than fit in 14 FONTH;
// the SPELLS header and the bar above stay fixed, only the rows scroll.
// With 2-3 spells it all fits and nothing scrolls. The X button closes
// just this panel (and resets the toggle flag); the sheet stays open.
newgui rpgspells [
    guistayopen [
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): the spells panel
    // lives in a fixed 20 FONTW x 17 FONTH frame (guiframe). The panel
    // is narrower than the standard windows (3+14+3 pads); the spell
    // rows keep their own 14 FONTH scroll region nested inside.
    guiminbox 20 18 [
        guistrut 3 0
        guilist [
            guistrut 14 1 // min width for the spells list
            guistrut 1.0 0 // top inset, matches the sheet
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guititle "SPELLS" 0 ]
                guispring 1
                guibutton "X" [hidegui rpgspells; rpgshowspells = 0] "0"
                guistrut 1.0 0
            ]
            // FIX (Nov 14, same plaque-overlap class as Notes 79/80): the
            // first spell sat at ~2.2 FONTH, inside the 3.5-FONTH plaque.
            // A 1.3-FONTH spacer drops the list clear of the plaque.
            guistrut 1.3 0
            guibar
            // Scrollable spell rows: the inner guilist stacks the rows
            // vertically (the scroll list takes the opposite direction
            // from its parent).
            guiscroll "spells" 14 [
                guilist [
                    looplist s "0 1 2" [
                        if (>= (rpgspellid $s) 0) [
                            guilist [
                                guiimage (rpgabicon (rpgspellid $s)) "" 0.7 0
                                guistrut 0.4 0
                                guilist [
                                    guitextscale 0.75 [ guitext (rpgabname (rpgspellid $s)) "" 0 ]
                                    guitextscale 0.65 [ guitext (rpgabdesc (rpgspellid $s)) "" 0 ]
                                    guitextscale 0.65 [ guitext (concatword (rpgabdmg (rpgspellid $s)) " dmg   " (rpgabmana (rpgspellid $s)) " mana   " (rpgabcdstr (rpgspellid $s)) " cd") "" 0 ]
                                ]
                            ]
                            guistrut 0.5 0
                        ]
                    ]
                ]
            ]
        ]
        guistrut 3 0
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen
] "guinoskin; guilift 0; guidockright 38 1" "0"

// RPG keybinds: I opens inventory, C opens the character screen (replacing U/K).
// RPG-gated: on RPG maps they open the RPG windows; anywhere else they keep
// their stock actions (I = taunt, C = radio team menu), so FPS maps are untouched.
bind I [if (isrpgmap) [rpginventory] [taunt]]
bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
// Chat prompt posts to the ACTIVE chat tab's channel: Clan tab -> teamsay,
// World and System tabs -> say (System is read-only). The "b" inputcommand flag
// marks this as a chat-box input: it renders in the panel's framed field on ALL
// maps (world + battlegrounds, user ruling Oct 19), never at the stock
// bottom-left. Chat keys (T, /, Y) open the in-panel field on all maps.
rpgchat = [inputcommand $arg1 (if (= $rpg_chattab 1) [sayteam (getcommandbuf)] [say (getcommandbuf)]) "[Chat]" "b"]
bind T [rpgchat ""]
bind SLASH [rpgchat "/"]
bind Y [rpgchat ""]
// Talk to the selected NPC (quest chain v1): F on RPG maps sends N_RPG_TALK
// for the selected NPC; the server runs the dialogue state machine. Stock F
// has no gameplay bind, so the fallthrough is empty and FPS maps are untouched.
// Right-click stays auto-attack — it never talks.
bind F [if (isrpgmap) [rpgtalk] []]
// Quest log (quest engine v2, Oct 21): J on RPG maps opens the derived
// quest-log view. Stock J has no gameplay bind, so the fallthrough is empty.
bind J [if (isrpgmap) [rpgjournal] []]
// BG cluster, Nov 3: L opens the leave-match confirm (bgleave no-ops outside a match).
bind L [bgleave]
// Action slots, keys 1-0 (kit-strip HUD): on RPG maps 1 casts Power Strike,
// 2 casts Spark Bolt, 3 casts Arcane Bolt and 4 casts Ice Bolt (the bolt
// spells are wizard/sorceress-only, server-gated; slots 5-0 are empty today,
// so they do nothing); on any other map the stock weapon-selection binds
// run unchanged.
bind 1 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 0] [ability1]] [setweapon 1]]
bind 2 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 1] [ability2]] [setweapon 2]]
bind 3 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 2] [ability3]] [setweapon 3]]
bind 4 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 3] [ability4]] [setweapon 4]]
bind 5 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 4] [ability5]] [setweapon 5]]
bind 6 [if (isrpgmap) [] [setweapon 6]]
bind 7 [if (isrpgmap) [] [setweapon 7]]
bind 8 [if (isrpgmap) [] [setweapon 8]]
bind 9 [if (isrpgmap) [] [setweapon 9]]
bind 0 [if (isrpgmap) [] [setweapon 10]]
// Mouse, RPG-gated: on RPG maps the mouse is a free cursor - left click
// selects (rpgclick 0), right click selects + auto-attacks (rpgclick 1).
// On any other map the stock FPS attack binds run unchanged. While a menu
// is open the GUI consumes clicks before binds ever fire, so the windows
// keep working exactly as before.
bind MOUSE1 [if (isrpgmap) [rpgclick 0] [attack 0]]
bind MOUSE2 [if (isrpgmap) [rpgclick 1] [attack 1]]
// Tab, RPG-gated (Issue #11, Oct 21): on RPG maps Tab cycles nearby
// targets nearest-first (wrapping) instead of the stock scoreboard;
// anywhere else the scoreboard is unchanged. The chat box tabs are
// mouse-driven, so Tab has no chat function to conflict with.
bind TAB [if (isrpgmap) [rpgtabcycle] [showscores]]
// defaults.cfg loads AFTER this file and rebinds keys to the stock actions,
// so re-assert our binds on every map start. Chat keys (T/SLASH/Y) are asserted
// on ALL maps (uniform chat surface, user ruling Oct 19); the RPG-action binds
// stay RPG-gated (battleground maps keep their stock I/C/1-0/MOUSE/F binds).

// Quest engine v2: dialogue panel (Oct 21). The server sends node text +
// response buttons (N_RPG_DIALOG); the buttons send back the button index.
// Keys 1-4 mirror the buttons while the panel is open (see binds above).
// v0.1.8: framed dialogue window (Ed: "text just goes in a long line, feels
// awkward"). Same kit window treatment as rpgjournal: window_inventory.png
// backdrop, NPC name as title, wrapped dialogue text, response buttons.
// The dialogue text is pre-wrapped at ~50 chars by rpg_dlg_wrap (client.cpp).
newgui bgleaveconfirm [
    // Leave-match confirm (BG cluster, Nov 3): forfeit warning + LEAVE/STAY.
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    guilist [
        guistrut 5 0
        guilist [
            guistrut 24 1
            guistrut 1.0 0
            guitextscale 1.2 [ guitext "Leave the battleground?" "" 0 ]
            guitextscale 0.6 [ guitext "Leaving forfeits all Embers earned during this match." "" 0 ]
            guitextscale 0.6 [ guitext "The match continues for everyone else." "" 0 ]
            guilist [
                guibutton "LEAVE" [bgleaveconfirm] "0"
                guistrut 2 0
                guibutton "STAY" [cleargui] "0"
            ]
            guistrut 0.5 0
        ]
        guistrut 5 0
    ]
    // v0.1.47 notes fix 1(c): this was the ONLY parchment window that set
    // the dark-brown text colour (43/30/18) without restoring the light
    // default (180/110/110) at the end, so after opening it the next menu
    // (e.g. the ESC pause menu) inherited near-black text on the dark
    // skin and read as black/unreadable. Restore, like every other
    // parchment window.
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
]

newgui rpgdialog [
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, same size/position.
    // Parchment is light, so text runs dark brown again (journal precedent).
    // v0.1.36 tight frame, mirrored from Inventory/Crafting (Ed Oct 29
    // playtest: the dialogue window dripped down BEHIND the HUD action
    // bar on his laptop): parchment background stretched over the
    // content box (guibackgroundtex) — the frame hugs the content, no
    // fixed 8-scale image, no strut. The engine centers the menu rect,
    // so a long dialogue grows symmetrically and clears the HUD bar
    // instead of dripping down. Title, pre-wrapped text, and response
    // buttons are unchanged; lift is now the shared 0.12 anchor like
    // the other windows (the old dialogue-only 0.15 was a band-aid for
    // the fixed-image drip and is no longer needed).
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): dialogue lives in
    // a fixed 34 FONTW x 14 FONTH frame (guiframe). Dialogue length
    // varies by NPC, so longer dialogues scroll inside the frame
    // instead of growing the window past the HUD bar. 14 FONTH fits
    // typical dialogues (header + text + responses); Ed to confirm.
    guiminbox 34 14 [
        guistrut 5 0 // left pad, 5+24+5 = 34 FONTW panel like Inventory
        guilist [
            guistrut 24 1 // 24*FONTW min width, same as Inventory
            guistrut 1.0 0 // top inset inside the tight frame (uniform across windows)
            // header: NPC name centered, X top-right
            // FIX (Note 54, Nov 13): title 1.2 -> 1.0. The dialog window
            // is short, so the stretched steel plaque is short too and
            // the 1.2 title overflowed it. 1.0 fits the plaque and stays
            // crisp. Spacer below the header drops the dialogue text
            // clear of the plaque, like the sheet's Level line.
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.0 [ guitext (rpg_dlg_npc) "" 0 ]
                guispring 1
                guibutton "X" [rpg_closerdlg] "0"
                guistrut 1.0 0
            ]
            guistrut 1.5 0
            guibar
            // dialogue text (pre-wrapped): 0.6 scale like the quest log so the
            // 50-char wrap stays inside the 36-FONTW column
            guitextscale 0.6 [
                loop i (rpg_dlg_lines) [
                    guitext (rpg_dlg_line $i) "" 0
                ]
            ]
            guibar
            // response buttons
            // v0.1.42-test-fixes: bake the index into each button action.
            // The old [rpgrespond $i] looked $i up at CLICK time, when the
            // loop has already restored it, so every response fired the
            // first one (Farewell landed on modes; Not yet. queued CTF).
            loop i (rpg_dlg_n) [
                guibutton (concatword (+ $i 1) ". " (rpg_dlg_resp $i)) (concatword "rpgrespond " $i) "0"
            ]
            // FIX (Note 54): bottom pad was guistrut 0.5 0, a HORIZONTAL
            // strut (0 height) that added no vertical room, so the last
            // response clipped at the frame bottom. Vertical 1.0 FONTH
            // pad gives the last option room inside the frame.
            guistrut 1.0 0
        ]
        guistrut 5 0 // right pad, 5+24+5 = 34 FONTW panel like Inventory
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guilift 0; guipanel main" "0"

// Quest engine v2: J-key quest log (Oct 21). A derived view over the client
// quest caches (no new table); rpgjournal rebuilds the lines on open.
// FRAMED (Oct 21): the same kit window treatment as the character and
// inventory windows - window_inventory.png as the panel, the -22 strut
// pulling the content cursor back up over the art, title + X inside the
// frame, content column centered on the panel box. Content and behavior
// are unchanged: the engine wraps lines at ~58 chars, so the log text runs
// at 0.6 scale to stay inside the 36-FONTW column; short logs are
// bottom-padded so the content fills the 22-FONTH panel.
newgui rpgjournal [
    guiimage "packages/ui/rpg/windows/window_steel.png" "" 11 0
    guistrut -22 0
    // v0.1.10 fix 3: parchment is light, so journal text runs dark brown
    // (mirrors rpgdialog; defaults restored at the end of this block)
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    guilist [
        guistrut 4 0 // left pad: centers the 36-FONTW column on the 44-FONTW box
        guilist [
            guistrut 36 1 // alt=1: 36*FONTW min width; rows stay <= 36
            guistrut 0.75 0 // top pad inside frame
            // header: title centered, X top-right inside the frame
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Quest Log" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            guibar
            guitextscale 0.6 [
                loop i (rpg_journal_lines) [
                    guitext (rpg_journal_line $i) "" 0
                ]
            ]
            // pad short logs so the content reaches the 22-FONTH panel
            // (header ~2.75 FONTH + 0.6 per line + 0.5 bottom pad)
            rpg_jrpad = (- 19.2 (* (rpg_journal_lines) 0.6))
            if (> $rpg_jrpad 0) [guistrut $rpg_jrpad 0]
            guistrut 0.5 0 // bottom pad
        ]
        guistrut 4 0 // right pad
    ]
    // restore the default light-on-dark text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guipanel main" "0"

map_changed = [
    bind T [rpgchat ""]
    bind SLASH [rpgchat "/"]
    bind Y [rpgchat ""]
    if (isrpgmap) [
        bind I [if (isrpgmap) [rpginventory] [taunt]]
        bind C [if (isrpgmap) [rpgcharacter] [togglegui_radioteam]]
        bind 1 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 0] [ability1]] [setweapon 1]]
        bind 2 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 1] [ability2]] [setweapon 2]]
        bind 3 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 2] [ability3]] [setweapon 3]]
        bind 4 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 3] [ability4]] [setweapon 4]]
        bind J [if (isrpgmap) [rpgjournal] []]
        bind 5 [if (isrpgmap) [if (rpgdlgo) [rpgrespond 4] [ability5]] [setweapon 5]]
        bind 6 [if (isrpgmap) [] [setweapon 6]]
        bind 7 [if (isrpgmap) [] [setweapon 7]]
        bind 8 [if (isrpgmap) [] [setweapon 8]]
        bind 9 [if (isrpgmap) [] [setweapon 9]]
        bind 0 [if (isrpgmap) [] [setweapon 10]]
        bind MOUSE1 [if (isrpgmap) [rpgclick 0] [attack 0]]
        bind MOUSE2 [if (isrpgmap) [rpgclick 1] [attack 1]]
        bind TAB [if (isrpgmap) [rpgtabcycle] [showscores]]
        bind F [if (isrpgmap) [rpgtalk] []]
// Quest log (quest engine v2, Oct 21): J on RPG maps opens the derived
// quest-log view. Stock J has no gameplay bind, so the fallthrough is empty.
bind J [if (isrpgmap) [rpgjournal] []]
        rpgcleartarget
    ]
]

// In-game pause menu (playtest fix, Oct 19): Esc with no RPG window open shows
// exactly these four options on ALL maps (world + battlegrounds). Styled with
// the main-menu family (logo, centered text column). If an RPG window is open,
// Esc closes it first (togglemainmenu pops one GUI before showing this).
newgui sspause [
    // v0.1.47 notes fix 1(c): the pause menu sets its own light text
    // colour up front, so it never inherits a dark parchment colour
    // left behind by another window (see bgleaveconfirm, which used
    // to leak dark brown into this menu). Belt and braces with the
    // restore there: this menu is readable in BG mode regardless.
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    guicenter [
        guilist [
            guiimage "packages/ui/rpg/menu/logo.png" [] 6 0
            guistrut 1
            guibar
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Return to Game" [cleargui] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Switch Character" [disconnect; rpg_charlist; showgui characters] "0" ] ]
            guistrut 1
            if (|| (m_ctf (getmode)) (m_koth (getmode)) (m_tff (getmode))) [ guialign 0 [ guitextscale 1.3 [ guibutton "Leave Battleground" [cleargui; bgleave] "0" ] ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Settings" [showgui Options] "0" ] ]
            guistrut 1
            guialign 0 [ guitextscale 1.3 [ guibutton "Exit" [quit] "0" ] ]
            guistrut 1
            guibar
        ]
    ]
]

// ---- vendor GUI (v0.1.23): Glimmer's shop ----
// Opens when talking to Glimmer (N_RPG_VENDOR). Sets rpg_atvendor = 1 so
// the inventory pop-up shows Sell instead of Drop. Closing resets it.
// Buy list is Glimmer's fixed stock (prices = item value in copper).
// Sell: open inventory (I) while here and use the Sell button on any gear.
newgui rpgvendor [
    // v0.1.30: NOT guistayopen. Vendor is now a normal modal GUI, like
    // Inventory, Dialogue and Character, so it renders in the same
    // framed, centered path as the other windows (Ed's Oct 27
    // standardization). The actual talk failure was server-side:
    // sendf "r" sent an empty packet, so the client never received
    // N_RPG_VENDOR at all; stayopen removal alone did not fix talk
    // (headless test v30c, still no GUI), the "ri" send fix did.
    // v0.1.30: frame scale 10, strut -20, NOT 8/-16. The shop has
    // 15 buy buttons plus header and footer, which need ~20 FONTH
    // tall, while Inventory needs 16; at 8/-16 the last three items
    // and the footer spilled below the frame (headless proof Oct 27).
    // Width, column (24) and centering still match Inventory; only
    // height is taller, because the shop content is taller. Flagged
    // to Ed, not hidden: if he wants exact Inventory height, the
    // buy list would need tabs or smaller text instead.
    // v0.1.30, Ed Oct 27 09:39: parchment for ALL windows, same size/position.
    // v0.1.42-test-hud-cleanup (Nov 3): tight frame, like Inventory —
    // the parchment is a background stretched over the content box, so
    // the engine centers the menu rect; the fixed 10-unit image + -20
    // strut is what left this window off-center and off-screen.
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // v0.1.31: center the content in the wider frame. Scale 10 is a
    // 20 FONTH = 40 FONTW panel, but the old pads were 4 on the left
    // only, so the 24 column sat left of center with 12 FONTW of
    // empty parchment on the right (Ed's "off screen / should be
    // centered" vendor shot). 8 + 24 + 8 = 40, centered exactly.
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): the shop lives in
    // a fixed 40 FONTW x 20 FONTH frame (guiframe), keeping its wider
    // panel. The frame never grows with content; the buy list scrolls
    // inside it if it ever exceeds the frame.
    guiminbox 40 20 [
        guistrut 8 0
        guilist [
            guistrut 24 1
            guistrut 0.75 0
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Glimmer's Wares" "" 0 ]
                guispring 1
                guibutton "X" [rpg_atvendor = 0; cleargui] "0"
                guistrut 1.0 0
            ]
            // FIX (Nov 14, same plaque-overlap class as Notes 79/80): the
            // greeting sat at ~2.0 FONTH, inside the 3.5-FONTH plaque.
            // A 1.3-FONTH spacer drops it clear of the plaque.
            guistrut 1.3 0
            // Glimmer greeting (MMO research: vendor barks are flavour, shop opens regardless)
            guilist [
                guispring 1
                guitextscale 0.85 [ guitext "Shiny things for shiny coins!" "" 0 ]
                guispring 1
            ]
            guibar
            // Player gold (copper/silver/gold format from rpgmoney)
            guilist [
                guitextscale 1.0 [ guitext (concat "Your coin: " (rpgmoney)) "" 0 ]
            ]
            guibar
            guitextscale 0.9 [ guitext "Buy from Glimmer (click to buy):" "" 0 ]
            // v0.1.30: buy list is VERTICAL, one button per row, at 0.7
            // scale. The old horizontal rows summed to ~68 FONTW (four
            // buttons side by side), which stretched the 24 column
            // past the Inventory frame and rendered the shop as a
            // full-width strip instead of a framed window (headless
            // proof Oct 27). Vertical at 0.7: longest button 22 chars
            // = 15.4 FONTW, and 15 buttons at ~0.7 FONTH each fit
            // the 16 FONTH frame height with header and footer.
            // Footer buttons are also stacked, and the Sell line is
            // shortened, for the same reason.
            // v0.1.31: 0.7 -> 0.65, with the footer in one row, so the
            // whole shop (15 buys + footer) fits the scale-10 frame
            // with Close Shop inside it, not just below the edge.
            // v0.1.72 (Nov 10, Ed): class-filtered shop, same rpgclass
            // mechanism as Blasque — each class sees only its own armor
            // and weapons, plus the universal starter weapon and jewelry.
            // One starter set per class: Warrior mail, Ranger leather,
            // Magi cloth. Per-class button counts (Warrior 12, Ranger 9,
            // Magi 8) are all under the old 17, so the frame still fits.
            guitextscale 0.65 [
                // Universal: starter weapon (no weaponcat, all classes)
                // and jewelry (rings/necklaces are class-free by design).
                guibutton "Puglin Stick - 10c" [rpgbuy puglin_stick] "" ""
                guibutton "Copper Necklace - 15c" [rpgbuy copper_necklace] "" ""
                guibutton "Copper Ring - 12c" [rpgbuy copper_ring] "" ""
                guibutton "Silver Ring - 18c" [rpgbuy silver_ring] "" ""
                guibutton "Cape - 20c" [rpgbuy cape] "" ""
                // Warrior: mail set + class weapons + Warrior outfits.
                if (=s (rpgclass) "Warrior") [
                    guibutton "Imp Mace - 60c" [rpgbuy imp_mace] "" ""
                    guibutton "Warrior Sword - 60c" [rpgbuy warrior_sword] "" ""
                    guibutton "Mail Helm - 25c" [rpgbuy iron_helm] "" ""
                    guibutton "Chain Tunic - 45c" [rpgbuy chain_tunic] "" ""
                    guibutton "Ranger Outfit - 30c" [rpgbuy ranger_outfit] "" ""
                    guibutton "Peasant Outfit - 10c" [rpgbuy peasant_outfit] "" ""
                    guibutton "Mail Leggings - 25c" [rpgbuy iron_leggings] "" ""
                    guibutton "Mail Boots - 20c" [rpgbuy iron_boots] "" ""
                ]
                // Ranger: leather set + bow.
                if (=s (rpgclass) "Ranger") [
                    guibutton "Wooden Bow - 25c" [rpgbuy wooden_bow] "" ""
                    guibutton "Ranger Tunic - 30c" [rpgbuy ranger_tunic] "" ""
                    guibutton "Ranger Pants - 15c" [rpgbuy ranger_pants] "" ""
                    guibutton "Ranger Boots - 12c" [rpgbuy ranger_boots] "" ""
                ]
                // Magi: cloth set (new Nov 10) + Wooden Staff starter.
                if (=s (rpgclass) "Magi") [
                    guibutton "Wooden Staff - 25c" [rpgbuy wooden_staff] "" ""
                    guibutton "Cloth Helm - 15c" [rpgbuy cloth_helm] "" ""
                    guibutton "Cloth Tunic - 30c" [rpgbuy cloth_tunic] "" ""
                    guibutton "Cloth Leggings - 15c" [rpgbuy cloth_leggings] "" ""
                    guibutton "Cloth Boots - 12c" [rpgbuy cloth_boots] "" ""
                ]
            ]
            guibar
            guitextscale 0.7 [ guitext "Sell via inventory (half value)." "" 0 ]
            // v0.1.31: footer fits the frame. The old stacked footer
            // (two buttons at 0.7) plus 15 buy buttons at 0.7 pushed
            // Close Shop just below the frame edge in game. Buy
            // buttons drop to 0.65 and the footer buttons sit side by
            // side in one row, saving enough height to keep Close
            // Shop inside the frame at the same scale 10.
            guitextscale 0.7 [
                guilist [
                    guibutton "Open Inventory to Sell" [rpginventory] "" ""
                    guistrut 1.0 0
                    guibutton "Close Shop" [rpg_atvendor = 0; cleargui] "" ""
                ]
            ]
            guistrut 0.5 0
        ]
        guistrut 8 0 // right pad, centers the 24 column in the 40 frame
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guipanel main" "0"
// v0.1.30, Ed feedback Oct 27 on v30e shot: vendor was the ONLY window
// without "guinoskin" "0", so the engine drew its default skin (the big
// dark background covering most of the screen, hard to read against)
// and a showtab label "RPGVENDOR" above the frame. Inventory,
// Character and Dialogue all end "guinoskin" "0": no skin, no tab.
// Vendor now matches them exactly, so no background and no label.
// ---- crafting window (Phase 1, Oct 27, uncommitted) ----
// Parchment window in the Inventory family (same art, dark brown text,
// 24-FONTW content column, fixed pads). Taller than Inventory (scale 9,
// 18 FONTH) because the materials list needs the room; vendor already
// sets the precedent for a taller frame (scale 10). Two tabs: Craft
// (two slots + materials list + Craft button) and Recipes (the player's
// discovered recipes, server-sent, verbatim). Results arrive via the
// System tab (rpg_qmsg), like sell messages, so no result row is needed
// here. Add-button actions are format-baked ("rpgcraftadd N") because a
// loop variable read at click time would hold the loop-end value.
rpg_crafttab = 0
newgui rpgcraft [
    guistayopen [
    // v0.1.36 tight frame (Ed Oct 28, WoW-style): parchment background
    // stretched over the content box (guibackgroundtex) — each tab hugs
    // its own content, no fixed 8.5 image, no strut. The engine centers
    // the menu rect, so Craft and Recipes share one center while their
    // edges move with content (Ed's vertical-center rule); no tab pad
    // is needed or wanted — padding the smaller tab would reintroduce
    // the dead space this direction removes.
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    // FIXED FRAME (Nov 13, UI enhancement Phase 1): crafting lives in
    // a fixed 34 FONTW x 20 FONTH frame (guiframe). The frame never
    // grows with content, so the CRAFT button and the "Failed
    // combinations" footer stay inside the frame and visible; the
    // Materials/Gear lists scroll inside their own 10 FONTH region.
    // 20 FONTH is an estimate (scroll 10 + fixed content ~10); Ed to
    // confirm in game.
    guiminbox 34 22 [
        guistrut 5 0
        guilist [
            guistrut 24 1
            guistrut 1.0 0 // top inset inside the tight frame (uniform across windows)
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Crafting" "" 0 ]
                guispring 1
                guibutton "X" [cleargui] "0"
                guistrut 1.0 0
            ]
            // FIX (Note 79, Nov 14): the tab row sat at ~2.2 FONTH, inside
            // the 3.5-FONTH plaque, so Craft/Recipes overlapped the plaque
            // edge and were hard to read. A 1.3-FONTH spacer drops the tabs
            // to 3.5 FONTH, clear of the plaque — same fix as the sheet's
            // Level line and the inventory coin line.
            guistrut 1.3 0
            // tab row (v0.1.35): Craft / Recipes only — Inventory lives
            // in its own window now (Ed Oct 28: Craft+Recipes pulled out
            // together, separate from Inventory).
            guilist [
                guispring 1
                if (= $rpg_crafttab 0) [ guititle "Craft" 0 ] [ guibutton "Craft" "rpg_crafttab = 0" "0" ]
                guistrut 1.5 0
                if (= $rpg_crafttab 1) [ guititle "Recipes" 0 ] [ guibutton "Recipes" "rpg_crafttab = 1" "0" ]
                guispring 1
            ]
            guibar
            // v0.1.36: the dynamic tab pads are GONE (they modeled row
            // heights with constants and still missed by ~1 FONTH in
            // the empty state, shifting the center 19px on tab switch).
            // With the background frame, each tab hugs its own content
            // and the engine centers the menu rect, so both tabs share
            // one center with no padding at all.
            if (= $rpg_crafttab 0) [
                // Shortened + scale 0.7: the 0.85 "then Craft" line ran
                // past the 24 FONTW column and clipped at the right.
                // The CRAFT button below says it already.
                guitextscale 0.7 [ guitext "Pick a gear piece and a material." "" 0 ]
                guilist [
                    guilist [
                        guiimage (rpgcraftsloticon 0) "rpgcraftclear 0" 0.7 0
                        guitextscale 0.7 [ guitext (rpgcraftslotname 0) "" 0 ]
                    ]
                    guistrut 1.0 0
                    guilist [
                        guiimage (rpgcraftsloticon 1) "rpgcraftclear 1" 0.7 0
                        guitextscale 0.7 [ guitext (rpgcraftslotname 1) "" 0 ]
                    ]
                ]
                guitextscale 0.7 [ guitext "Click a slot to clear it." "" 0 ]
                // Shortened: the full "Results also appear in the System
                // tab." ran past the column and clipped at the left.
                guitextscale 0.7 [ guitext "Results show in the System tab." "" 0 ]
                guibar
                // Scroll region (Nov 13): the Materials + Gear lists grow
                // with the inventory, so a full inventory pushed the
                // window past the bottom of the screen and clipped the
                // CRAFT button and the "Failed combinations" line. The
                // lists now scroll inside 8 FONTH (Nov 14, Note 79: 10 was
                // still too tall — the CRAFT button and footer fell below
                // the frame); the CRAFT button and the footer stay fixed
                // below, always visible.
                guiscroll "craftlists" 8 [
                guilist [
                guitextscale 0.85 [ guitext "Materials:" "" 0 ]
                loop i (rpginvcount) [
                    if (= (rpginvtype $i) 3) [
                        guilist [
                            guitextscale 0.7 [ guitext (concatword (rpginvname $i) " x" (rpginvnum $i)) "" 0 ]
                            guispring 1
                            guibutton "Add" (format "rpgcraftadd %1" $i) "0"
                        ]
                    ]
                ]
                // Phase 3: gear pieces slot alongside materials (same
                // rpgcraftadd path; the server validates the combination).
                guibar
                guitextscale 0.85 [ guitext "Gear:" "" 0 ]
                loop i (rpginvcount) [
                    if (= (rpginvtype $i) 1) [
                        guilist [
                            guitextscale 0.7 [ guitext (concatword (rpginvname $i) " x" (rpginvnum $i)) "" 0 ]
                            guispring 1
                            guibutton "Add" (format "rpgcraftadd %1" $i) "0"
                        ]
                    ]
                ]
                ]
                ]
                guibar
                guilist [
                    guispring 1
                    guibutton "Craft" [rpgcraftsend] "0"
                    guispring 1
                ]
                // v0.1.34: persistent in-window result line. It stays
                // visible until the next craft (cleared on send), so the
                // outcome cannot be missed when the window stays open.
                if (rpg_craft_result_has) [
                    guitextscale 0.85 [ guitext (rpg_craft_result) "" 0 ]
                ]
                guitextscale 0.7 [ guitext "Failed combinations cost nothing." "" 0 ]
            ] [
                guitextscale 0.85 [ guitext "Discovered recipes:" "" 0 ]
                if (= (rpg_recipe_lines) 0) [
                    guitextscale 0.7 [ guitext "No recipes discovered yet." "" 0 ]
                ] [
                    guitextscale 0.7 [
                        loop i (rpg_recipe_lines) [
                            guitext (rpg_recipe_line $i) "" 0
                        ]
                    ]
                ]
            ]
            guistrut 0.5 0
        ]
        guistrut 5 0
    ]
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
    ] // guistayopen
] "guinoskin; guilift 0; guipanel main" "0"

// Vendor open sets the at-vendor flag (inventory Sell button appears).
// The N_RPG_VENDOR handler calls rpgvendor, which shows this GUI; the
// flag is set here so it is active as soon as the window renders.
rpgvendoropen = [rpg_atvendor = 1; showgui rpgvendor]

// ---- PvP vendor GUI (Oct 31): Blasque's shop ----
// Opens ONLY when talking to Blasque (N_RPG_VENDOR with vendor id 1;
// client.cpp branches to rpgvendor_pvpopen). Glimmer's rpgvendor menu
// is untouched — this is a second menu, not an edit of hers.
// Frame matches Glimmer's exactly (parchment, scale 10, 24 column,
// 8 pads: Ed's Oct 27 all-windows-same-size standardization), even
// though only 4 buy buttons show at a time (3 items + class weapon).
// CLASS-FILTERED LISTING: rpgclass is the character archetype
// ("Ranger"/"Warrior"/"Magi"); each branch shows only that class's 3
// items plus its class weapon. Unknown class ("") shows no buy buttons at all — display
// fails closed, matching the server purchase gate. (Nov 13 vendor
// rule: rpgclass now uses rpg::classforname — archetype first,
// model-dir fallback — the same derivation as the server gate, so the
// display can no longer disagree with the server about the player's
// class. The old stored-archetype-only gap is closed.)
// Prices are Embers (rpgembers, synced via N_RPG_EMBERS); PvP items
// have no copper value and are never charged in copper.
newgui rpgvendor_pvp [
    // v0.1.42-test-hud-cleanup (Nov 3): tight frame, like Inventory —
    // the parchment is a background stretched over the content box, so
    // the engine centers the menu rect; the fixed 10-unit image + -20
    // strut is what left this window off-center and off-screen.
    guibackgroundtex "packages/ui/rpg/windows/window_steel.png"
    guitextcolorr 245
    guitextcolorg 244
    guitextcolorb 240
    guilist [
        guistrut 8 0
        guilist [
            guistrut 24 1
            guistrut 0.75 0
            guilist [
                guistrut 3.4 0
                guispring 1
                guitextscale 1.2 [ guitext "Blasque's Wares" "" 0 ]
                guispring 1
                guibutton "X" [rpg_atvendor = 0; cleargui] "0"
                guistrut 1.0 0
            ]
            // FIX (Nov 14, same plaque-overlap class as Notes 79/80): the
            // greeting sat at ~2.0 FONTH, inside the 3.5-FONTH plaque.
            // A 1.3-FONTH spacer drops it clear of the plaque.
            guistrut 1.3 0
            guilist [
                guispring 1
                guitextscale 0.85 [ guitext "Ember-forged gear for the arena." "" 0 ]
                guispring 1
            ]
            guibar
            guilist [
                guitextscale 1.0 [ guitext (concat "Your Embers: " (rpgembers)) "" 0 ]
            ]
            guibar
            guitextscale 0.9 [ guitext "Buy from Blasque (click to buy):" "" 0 ]
            guitextscale 0.65 [
                if (=s (rpgclass) "Magi") [
                    guibutton "Ember Talon Band - 2500 Embers" [rpgbuy pvp_magi_ring] "" ""
                    guibutton "Talon's Ember Pendant - 5000 Embers" [rpgbuy pvp_magi_necklace] "" ""
                    guibutton "Ember Stride Boots - 10000 Embers" [rpgbuy pvp_magi_boots] "" ""
                    guibutton "Ember Talon Orb - 10000 Embers" [rpgbuy pvp_magi_orb] "" ""
                    guibutton "The Gilded Talon - 20000 Embers" [rpgbuy pvp_magi_staff] "" ""
                ]
                if (=s (rpgclass) "Warrior") [
                    guibutton "Thornband - 2500 Embers" [rpgbuy pvp_warrior_ring] "" ""
                    guibutton "Duskthorn Chain - 5000 Embers" [rpgbuy pvp_warrior_necklace] "" ""
                    guibutton "Thorn Treads - 10000 Embers" [rpgbuy pvp_warrior_boots] "" ""
                    guibutton "Duskthorn Aegis - 10000 Embers" [rpgbuy pvp_warrior_shield] "" ""
                    guibutton "Duskthorn - 20000 Embers" [rpgbuy pvp_warrior_sword] "" ""
                ]
                if (=s (rpgclass) "Ranger") [
                    guibutton "Marrow Band - 2500 Embers" [rpgbuy pvp_ranger_ring] "" ""
                    guibutton "Bonestring Charm - 5000 Embers" [rpgbuy pvp_ranger_necklace] "" ""
                    guibutton "Pale Striders - 10000 Embers" [rpgbuy pvp_ranger_boots] "" ""
                    guibutton "Marrowstring - 20000 Embers" [rpgbuy pvp_ranger_bow] "" ""
                ]
                if (=s (rpgclass) "") [
                    guitext "Your class is unknown, so no wares are shown." "" 0
                ]
            ]
            guibar
            guitextscale 0.7 [ guitext "PvP gear only reduces damage from players." "" 0 ]
            guitextscale 0.7 [
                guilist [
                    guibutton "Close Shop" [rpg_atvendor = 0; cleargui] "" ""
                ]
            ]
            guistrut 0.5 0
        ]
        guistrut 8 0 // right pad, centers the 24 column in the 40 frame
    ]
    // restore default light text colors for other menus
    guitextcolorr 180
    guitextcolorg 110
    guitextcolorb 110
] "guinoskin; guipanel main" "0"

// PvP vendor open (Oct 31): same at-vendor flag as Glimmer's open,
// then Blasque's menu. The client N_RPG_VENDOR handler calls this
// only for vendor id 1; typing it at the console also opens the shop.
rpgvendor_pvpopen = [rpg_atvendor = 1; showgui rpgvendor_pvp]

// --- RPG: editor Phase 1 (Oct 24, 2026) - NPC placement tool ---
// F7 in EDIT MODE ONLY opens the NPC editor. Outside edit mode, F7 still
// takes a screenshot (data/screenshot.cfg bind is untouched; editbinds only
// apply while editing).
// v0.1.27 (item 5): F7 needs editing actually toggled ON (E key), not just
// the COOP EDIT game mode - if F7 flashes (screenshot), editing is not
// toggled on. Fallback that always works: open the console and type
// shownpceditor. If the GUI name is ever unregistered, showgui now logs
// "unknown menu" to the console instead of failing silently.
editbind F7 [showgui npceditor]

// Editor state (CubeScript aliases; the GUI reads them live).
npc_sel = -1
npc_new_id = "new_npc"
npc_new_name = "New NPC"
npc_new_model = "npcs/male_peasant_static"

newgui npceditor [
    guitext "NPC Editor - Phase 1" "" 0
    guitext (concatword "Map: " (npc_loaded_map) " - " (npc_count) " NPCs (" (if (= (npc_from_file) 1) ["from file"] ["fallback"]) ")") "" 0
    guibar
    // NPC list: click a row to select it for move/delete.
    loop i (npc_count) [
        guilist [
            guibutton (concatword (npc_name $i) " [" (npc_id $i) "] " (npc_model $i)) (concatword "npc_sel = " $i) "" // test-fixes: baked index, same late-$i bug as rpgdialog
            guitext (concatword (npc_x $i) " " (npc_y $i) " " (npc_z $i) " yaw " (npc_yaw $i) " " (npc_type $i)) "" 0
        ]
    ]
    guibar
    guitext (concatword "Selected: " (npc_name $npc_sel) " [" (npc_id $npc_sel) "]") "" 0
    guilist [
        guibutton "Move to me" [npc_move_here $npc_sel] ""
        guibutton "Move to view target" [npc_move_view $npc_sel] ""
        guibutton "Delete" [npc_remove $npc_sel; npc_sel = -1] ""
    ]
    guibar
    guitext "Add new NPC (default model is the male peasant; type/dialogue in Phase 2):" "" 0
    guilist [
        guitext "ID:" "" 0
        guifield npc_new_id 20
        guitext "Name:" "" 0
        guifield npc_new_name 20
    ]
    guilist [
        guitext "Model:" "" 0
        guifield npc_new_model 30
    ]
    guilist [
        guibutton "Add here" [npc_add_here $npc_new_id $npc_new_name $npc_new_model] ""
        guibutton "Add at view target" [npc_add_view $npc_new_id $npc_new_name $npc_new_model] ""
    ]
    guibar
    guilist [
        guibutton "Save NPCs" [npc_save] ""
        guibutton "Close" [cleargui] ""
    ]
    guitext "Save writes data/rpg/npcs_<map>.cfg. Reload the map for the server to pick it up." "" 0
]
